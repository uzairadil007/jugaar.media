<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>book.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Ccircle cx='23' cy='22' r='4' fill='%23d8ff29'/%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--lime:#d8ff29;--ink:#0a0a0a;--paper:#ffffff;--line:#e8e8e8;--sub:#6b6b6b;--soft:#f6f6f6;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;min-height:100vh;}
button,input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
header :focus-visible,.book-info :focus-visible{outline-color:var(--lime);}

/* ---------- header (same as the tracker) ---------- */
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0;}
.brand{display:flex;align-items:center;font-size:19px;background:none;border:0;color:inherit;cursor:pointer;padding:4px 8px;margin:-4px -8px;border-radius:8px;font-family:inherit;}
.brand .logo{font-style:italic;font-weight:800;letter-spacing:.01em;color:#fff;}
.brand .logo-dot{color:var(--lime);}
nav{display:flex;gap:4px;background:#161616;border-radius:10px;padding:4px;flex-wrap:wrap;}
nav button{background:none;border:0;color:#bbb;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;}
nav button.active{background:var(--lime);color:var(--ink);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.admin-pill{font-size:11px;background:var(--lime);color:var(--ink);padding:6px 12px;border-radius:20px;font-weight:800;letter-spacing:.03em;}
button.hdr-btn{background:transparent;border:1px solid #444;color:#eee;border-radius:9px;padding:8px 13px;font-size:12px;cursor:pointer;}
main{max-width:1040px;margin:0 auto;padding:22px 20px 40px;width:100%;flex:1 0 auto;}
.site-footer{flex-shrink:0;text-align:center;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);}
.site-footer a{color:var(--ink);font-weight:700;text-decoration:none;}

/* ---------- shared components ---------- */
.banner{background:#fff7e0;border:1px solid #f0dca0;color:#6b5400;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:18px;line-height:1.5;}
.banner.err{background:#fff0f0;border-color:#f3bcbc;color:#8a1c1c;}
.banner.ok{background:#f6ffd1;border-color:#d8ff29;color:#2c3300;}
.banner button{margin-left:8px;}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;background:#fff;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat b{display:block;font-size:24px;margin-bottom:2px;}
.stat span{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
.stat.hot{background:var(--lime);border-color:var(--lime);}
.stat.hot span{color:#3a4200;}
h2{font-size:18px;margin:0 0 4px;}
h3{font-size:14px;margin:0 0 12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
.muted{color:var(--sub);font-size:13px;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.tag.ok{background:var(--lime);color:var(--ink);}
.tag.warn{background:#111;color:#fff;}
.tag.off{background:#f2f2f2;color:#777;}
.tag.verified{background:#111;color:var(--lime);border:1px solid var(--lime);}
button.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:13.5px;cursor:pointer;}
button.btn.lime{background:var(--lime);color:var(--ink);}
button.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
button.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px;}
button.btn:disabled{opacity:.4;cursor:not-allowed;}
label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);display:block;margin-bottom:6px;}
select,input[type=number],input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],textarea{
  width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--ink);}
textarea{resize:vertical;min-height:84px;line-height:1.45;}
.field{margin-bottom:14px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.overflow{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chipbtn{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);}
.chipbtn.active{background:var(--ink);color:var(--lime);border-color:var(--ink);}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
a.wa{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:2px;}
.rowcancel{opacity:.5;}

/* ---------- invoices ---------- */
.invlayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;}
@media (max-width:900px){.invlayout{grid-template-columns:1fr;}}
.itemrow{display:grid;grid-template-columns:1fr 70px 100px 38px;gap:8px;margin-bottom:8px;align-items:center;}
.itemrow.head{font-size:11.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
.invpaper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.06);}
.invdoc{font-size:13px;color:#111;line-height:1.5;}
.inv-top{display:flex;justify-content:space-between;gap:16px;margin-bottom:22px;}
.inv-from{font-size:18px;font-weight:800;}
.inv-small{font-size:12px;color:#666;}
.inv-title{font-size:26px;font-weight:800;font-style:italic;text-align:right;}
.inv-stamp{display:block;font-size:12px;font-style:normal;font-weight:800;background:var(--lime);border-radius:20px;padding:3px 10px;margin-top:6px;text-align:center;}
.inv-stamp.void{background:#eee;color:#777;}
.inv-meta{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;}
.inv-meta small,.inv-pay small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700;}
.inv-items{width:100%;border-collapse:collapse;margin-bottom:12px;}
.inv-items th{background:#111;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px;text-align:left;}
.inv-items td{padding:9px 8px;border-bottom:1px solid #eee;vertical-align:top;}
.inv-items .num{text-align:right;white-space:nowrap;}
.inv-sum{margin-left:auto;max-width:260px;}
.inv-sum div{display:flex;justify-content:space-between;padding:4px 0;}
.inv-sum .grand{border-top:2px solid #111;margin-top:4px;padding-top:8px;font-size:16px;font-weight:800;}
.inv-pay{background:#f6ffd1;border-radius:10px;padding:12px 14px;margin-top:18px;}
.inv-notes{margin-top:16px;color:#555;font-size:12.5px;}
#printRoot{display:none;}
@media print{
  body.printing > *:not(#printRoot){display:none !important;}
  body.printing #printRoot{display:block !important;padding:0;}
  body.printing{background:#fff;}
  .inv-items th,.inv-stamp,.inv-pay{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
.matchcard{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.matchcard .why{font-size:12.5px;color:#3a4200;background:#f6ffd1;display:inline-block;border-radius:8px;padding:3px 8px;margin-top:6px;}
tr.payrow.sel td{background:#fbffe6;}
.need{font-size:12.5px;color:var(--sub);margin-top:3px;max-width:280px;line-height:1.4;}
pre.rules{background:#101010;color:var(--lime);padding:14px;border-radius:10px;font-size:12px;line-height:1.5;overflow:auto;max-height:280px;white-space:pre;margin:10px 0;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--lime);
  padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- client booking page: one question per screen ---------- */
main.client{max-width:640px;font-size:17px;padding-top:30px;}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--sub);font-size:15px;line-height:1.55;}
.fine{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.5;}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
.err-msg{color:#c00;font-size:15px;font-weight:700;margin:0 0 14px;min-height:0;}
.err-msg:empty{display:none;}
.codebox{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:26px;letter-spacing:.2em;background:var(--ink);color:var(--lime);border-radius:14px;padding:12px 20px;display:inline-block;}
a.btn{display:inline-block;text-decoration:none;background:var(--ink);color:#fff;border-radius:10px;padding:12px 20px;font-weight:700;font-size:13.5px;}
a.btn.lime{background:var(--lime);color:var(--ink);}
a.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}

.hero{margin:0 0 22px;}
.hero .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:8px;}
.hero h1{font-size:clamp(32px,9vw,44px);line-height:1.06;margin:0 0 14px;font-weight:800;font-style:italic;letter-spacing:-.01em;}
.hero h1 span{background:linear-gradient(transparent 62%,var(--lime) 62%);padding:0 2px;}
.facts{display:flex;gap:8px;flex-wrap:wrap;}
.fact{border:1.5px solid var(--ink);border-radius:30px;padding:8px 15px;font-weight:800;font-size:15px;}
.fact.lime{background:var(--lime);}
.hero p{color:var(--sub);font-size:15.5px;line-height:1.5;margin:12px 0 0;}

.stepper{list-style:none;display:flex;gap:8px;margin:0 0 24px;padding:0;}
.stepper li{flex:1;font-size:13px;font-weight:700;color:#a0a0a0;}
.stepper .bar{display:block;height:5px;border-radius:5px;background:#ececec;overflow:hidden;margin-bottom:8px;}
.stepper .bar i{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;}
.stepper li.done,.stepper li.now{color:var(--ink);}
.stepper li.done .bar i,.stepper li.now .bar i{transform:scaleX(1);}

.stage{min-height:280px;}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:70px 10px;color:var(--sub);font-weight:700;font-size:15px;text-align:center;}
.sec-title{font-size:22px;font-weight:800;margin:0 0 4px;}
.sec-sub{color:var(--sub);font-size:15px;margin:0 0 18px;line-height:1.45;}

.quick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--lime);border:2px solid var(--ink);border-radius:18px;padding:15px 16px;cursor:pointer;text-align:left;margin-bottom:26px;color:var(--ink);transition:transform .15s,box-shadow .15s;}
.quick:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);}
.quick:active{transform:translateY(0);box-shadow:none;}
.quick small{display:block;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.65;margin-bottom:2px;}
.quick b{font-size:19px;}
.quick .go{background:var(--ink);color:var(--lime);border-radius:30px;padding:10px 16px;font-weight:800;font-size:14px;white-space:nowrap;}

.daygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (min-width:520px){.daygrid{grid-template-columns:repeat(4,1fr);}}
.daycard{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:12px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--ink);min-height:116px;transition:transform .15s,border-color .15s,box-shadow .15s;}
.daycard:hover{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.09);}
.daycard:active{transform:scale(.97);}
.dc-top{font-size:13px;font-weight:800;color:var(--sub);}
.dc-num{font-size:32px;font-weight:800;line-height:1.1;}
.dc-mon{font-size:13px;color:var(--sub);margin-bottom:7px;}
.dc-pill{font-size:11px;font-weight:800;background:var(--lime);border-radius:20px;padding:3px 9px;}
.daycard:disabled{background:var(--soft);cursor:not-allowed;color:#aaa;}
.daycard:disabled .dc-top,.daycard:disabled .dc-mon{color:#b4b4b4;}
.daycard:disabled .dc-pill{background:#e6e6e6;color:#888;}
.daycard:disabled:hover{transform:none;box-shadow:none;border-color:var(--line);}
.more-btn{margin:14px auto 0;display:block;background:none;border:0;font-weight:800;font-size:15px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:4px;padding:12px;color:var(--ink);}

.backbtn{background:none;border:0;font-size:15px;font-weight:800;cursor:pointer;padding:10px 0;margin:-8px 0 10px;color:var(--ink);}
.chosen{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:14px 16px;margin-bottom:22px;}
.chosen b{display:block;font-size:17px;}
.chosen span{color:var(--sub);font-size:14px;}
.chosen button{background:#fff;border:1px solid var(--line);border-radius:30px;padding:9px 15px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap;}
.group-title{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:20px 0 10px;}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
.slot{padding:16px 6px;border-radius:14px;border:1.5px solid var(--ink);background:#fff;font-weight:800;font-size:16px;cursor:pointer;color:var(--ink);transition:transform .15s,background .15s;}
.slot:hover{background:var(--lime);}
.slot:active{transform:scale(.96);}

.cform .field{margin-bottom:18px;}
.cform label{font-size:15px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--ink);margin-bottom:8px;}
.cform input,.cform textarea{padding:16px 14px;font-size:17px;border:1.5px solid #d9d9d9;border-radius:14px;transition:border-color .15s,box-shadow .15s;}
.cform textarea{min-height:96px;}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(216,255,41,.6);}
.row2{display:grid;grid-template-columns:1fr 130px;gap:12px;}
.opt{font-weight:400;color:var(--sub);}
.cform select{width:100%;padding:16px 14px;font-size:17px;border:1.5px solid #d9d9d9;border-radius:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;}
.cform select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(216,255,41,.6);}
.cform .hint{font-size:13.5px;color:var(--sub);margin:7px 0 0;line-height:1.4;}
.cform details{margin-bottom:20px;}
.cform summary{cursor:pointer;font-weight:800;font-size:15px;padding:8px 0;}
.cform details .field{margin:10px 0 0;}
.fee-note{text-align:center;color:var(--sub);font-size:15px;margin:2px 0 14px;line-height:1.45;}
.fee-note b{color:var(--ink);}
.bigbtn{width:100%;background:var(--lime);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:18px;font-size:18px;font-weight:800;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:transform .15s,box-shadow .15s;}
.bigbtn:hover{box-shadow:0 6px 0 var(--ink);transform:translateY(-2px);}
.bigbtn:active{transform:translateY(0);box-shadow:none;}
.bigbtn:disabled{opacity:.65;cursor:wait;transform:none;box-shadow:none;}
.spin{width:18px;height:18px;border:3px solid rgba(0,0,0,.2);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;}

.done{text-align:center;}
.tick{width:96px;height:96px;margin:4px auto 14px;}
.tick svg{width:100%;height:100%;overflow:visible;}
.tick .fillc{fill:var(--lime);transform-origin:center;transform-box:fill-box;}
.tick .ring{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:240;}
.tick .chk{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;}
.done h2{font-size:28px;margin:0 0 6px;}
.done .when{font-size:18px;font-weight:800;margin:14px 0 2px;}
.done .sub{color:var(--sub);font-size:15px;margin:0;}
.codewrap{margin:22px 0 4px;}
.codewrap small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:8px;}
.todo{list-style:none;padding:0;margin:22px 0 8px;text-align:left;}
.todo li{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line);}
.todo li:last-child{border-bottom:1px solid var(--line);}
.todo .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.todo .t{flex:1;min-width:0;font-size:16px;line-height:1.5;}
.todo .t b{display:block;font-size:17px;margin-bottom:2px;}
.todo .amt{font-size:24px;font-weight:800;}
.todo pre{white-space:pre-wrap;font-family:inherit;font-size:15.5px;line-height:1.55;margin:8px 0 0;background:var(--soft);border-radius:12px;padding:12px 14px;}
.todo .bigbtn{margin-top:12px;text-decoration:none;font-size:16px;padding:15px;}
.done .actions{justify-content:center;margin-top:18px;}
.linkbtn{background:none;border:0;color:var(--sub);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:6px;}
.linkbtn.plain{color:inherit;text-decoration:none;font:inherit;padding:0;}

/* ---------- motion (only plays when the screen changes — see `animate` in render) ---------- */
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
@keyframes inR{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:none;}}
@keyframes inL{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:none;}}
@keyframes fillbar{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
.enter.fwd{animation:inR .4s cubic-bezier(.2,.8,.2,1) both;}
.enter.back{animation:inL .4s cubic-bezier(.2,.8,.2,1) both;}
.enter .daycard,.enter .slot,.enter .quick{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms + 120ms);}
.hero.enter > *{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms);}
.stepper li.grow .bar i{animation:fillbar .55s .1s cubic-bezier(.2,.8,.2,1) both;}
.enter .tick .fillc{transform:scale(0);animation:pop .45s .5s cubic-bezier(.3,1.7,.5,1) forwards;}
.enter .tick .ring{stroke-dashoffset:240;animation:draw .7s .05s ease forwards;}
.enter .tick .chk{stroke-dashoffset:60;animation:draw .45s .65s ease forwards;}
.enter .done-rise{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.85s + var(--i,0)*110ms);}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
  .enter .tick .fillc{transform:none;}
}

/* ---------- login ---------- */
.gate-card{max-width:420px;margin:8px auto 18px;}
.gate{text-align:center;}
.gate-icon{font-size:36px;margin-bottom:4px;filter:drop-shadow(0 2px 0 var(--lime));}
.gate form{text-align:left;margin-top:18px;}

/* ---------- sheet ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.toolbar .grow{flex:1 1 200px;min-width:160px;}
.toolbar select{min-width:130px;}
.sheet-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:68vh;}
table.sheet{border-collapse:separate;border-spacing:0;min-width:2000px;font-size:13px;}
table.sheet th{position:sticky;top:0;background:var(--soft);z-index:2;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 8px;white-space:nowrap;}
table.sheet td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#fff;}
table.sheet td.rn{background:var(--soft);text-align:center;color:var(--sub);font-size:11px;width:38px;position:sticky;left:0;z-index:1;}
table.sheet th.rn{left:0;z-index:3;}
table.sheet td input,table.sheet td select{border:0;border-radius:0;background:transparent;padding:10px 8px;width:100%;font-size:13px;display:block;}
table.sheet td input:focus,table.sheet td select:focus{outline:2px solid var(--ink);outline-offset:-2px;background:#fffef0;}
table.sheet td .cell.st-paid,table.sheet td .cell.st-completed{background:var(--lime);font-weight:700;}
table.sheet td .cell.st-proof{background:#111;color:#fff;font-weight:700;}
table.sheet td .cell.st-blocked{background:#e9e9e9;font-weight:700;}
table.sheet td .cell.st-no-show{background:#ffe3e3;}
table.sheet td.del{width:44px;text-align:center;}
.rm{background:none;border:0;color:#b00;cursor:pointer;font-size:15px;padding:8px 10px;}

/* ---------- availability editor ---------- */
.wk{display:grid;grid-template-columns:110px 70px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px;}
.wk .day-name{font-weight:700;font-size:14px;}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0;}
.switch input{width:18px;height:18px;accent-color:var(--ink);}
.blk{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:20px;padding:6px 6px 6px 12px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0;}
.blk button{background:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:800;}

@media (max-width:640px){
  main{padding:16px 14px 32px;}
  .card{padding:16px;border-radius:14px;}
  select,input[type=number],input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],textarea{font-size:16px;}
  nav button{padding:10px 12px;}
  .two{grid-template-columns:1fr;}
  .wk{grid-template-columns:1fr 1fr;}
  .wk .day-name{grid-column:1/2;}
  .wk .sw{grid-column:2/3;}
}
@media (max-width:480px){
  header{flex-direction:column;align-items:stretch;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));}
  .brand{justify-content:center;}
  nav{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;}
  nav button{white-space:nowrap;}
  .hdr-right{justify-content:center;}
  button.btn{width:100%;}
  .actions .btn{width:auto;}
}
</style>
</head>
<body>
<header>
  <button type="button" class="brand" data-act="logo" aria-label="book. — admin"><span class="logo">book<span class="logo-dot">.</span></span></button>
  <nav id="tabs"></nav>
  <div class="hdr-right" id="hdrRight"></div>
</header>
<main id="app"></main>
<footer class="site-footer">
  <button type="button" class="linkbtn plain" data-act="logo" aria-label="book. — admin">book.</button> by <a href="https://www.jugaar.media" target="_blank" rel="noopener">@jugaar.media</a>
</footer>
<div id="printRoot" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG — same Firebase project as the VA tracker
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAZn-MWlArpHYcb7Z88u-wzKdrBxtIsYiE",
  authDomain: "tracker-9a8cb.firebaseapp.com",
  projectId: "tracker-9a8cb",
  storageBucket: "tracker-9a8cb.firebasestorage.app",
  messagingSenderId: "765187139896",
  appId: "1:765187139896:web:61ddd4fad7ee85364239cd"
};

// All times on this page are wall-clock times in this zone (Pakistan has no daylight saving).
const TZ = 'Asia/Karachi';
const TZ_OFFSET_MIN = 300;
const TZ_NAME = 'Pakistan time (PKT)';

const DEFAULTS = {
  title: 'Consultation',
  host: '',
  description: 'A one-on-one consultation. Pick a day and a time that suits you and book it in under a minute.',
  duration: 30, buffer: 0, horizon: 21, notice: 3,
  price: 0, currency: 'PKR', whatsapp: '', payInstructions: '',
  invName: '', invDetails: '', invNote: 'Thank you for your business.', invTax: 0,
  blocked: [],
  weekly: {
    0:{on:false,start:'11:00',end:'19:00'},
    1:{on:true, start:'11:00',end:'19:00'},
    2:{on:true, start:'11:00',end:'19:00'},
    3:{on:true, start:'11:00',end:'19:00'},
    4:{on:true, start:'11:00',end:'19:00'},
    5:{on:true, start:'11:00',end:'19:00'},
    6:{on:true, start:'11:00',end:'19:00'},
  }
};

const OCC = ['booked','completed','no-show','blocked']; // statuses that hold a slot
const PAY_OPTS = [['unpaid','Unpaid'],['proof','Proof sent'],['paid','Paid'],['refunded','Refunded'],['free','Free']];
const PAY_METHODS = ['JazzCash','Easypaisa','Bank transfer','Cash','Other'];
const HEARD_OPTS = ['Instagram','Facebook','TikTok','YouTube','Friend or family','Other'];
const STATUS_OPTS = [['booked','Booked'],['completed','Completed'],['no-show','No-show'],['cancelled','Cancelled'],['blocked','Blocked']];
const SOURCES = ['Website','Instagram','Facebook','TikTok','WhatsApp','Other'];
const COLS = [
  {k:'date',l:'Date',t:'date',w:140},
  {k:'time',l:'Time',t:'time',w:110},
  {k:'name',l:'Client',t:'text',w:170},
  {k:'phone',l:'WhatsApp',t:'text',w:150},
  {k:'city',l:'City',t:'text',w:130},
  {k:'age',l:'Age',t:'number',w:80},
  {k:'email',l:'Email',t:'text',w:180},
  {k:'amount',l:'Amount',t:'number',w:100},
  {k:'payStatus',l:'Payment',t:'select',opts:PAY_OPTS,w:130},
  {k:'status',l:'Status',t:'select',opts:STATUS_OPTS,w:130},
  {k:'payRef',l:'Payment ref',t:'text',w:150},
  {k:'source',l:'Source',t:'select',opts:SOURCES.map(s=>[s,s]),w:120},
  {k:'heard',l:'Heard via',t:'select',opts:[['','—']].concat(HEARD_OPTS.map(x => [x,x])),w:140},
  {k:'notes',l:'Needs help with',t:'text',w:260},
  {k:'adminNote',l:'My notes',t:'text',w:200},
];

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = s => document.querySelector(s);
const main = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? (+m[1])*60 + (+m[2]) : NaN; };
const fromMin = n => pad(Math.floor(n/60)) + ':' + pad(n%60);
const fmt12 = t => { const n = toMin(t); if (isNaN(n)) return '—'; const h = Math.floor(n/60), m = n%60; return ((h%12)||12) + ':' + pad(m) + ' ' + (h<12?'AM':'PM'); };
const parseDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(Date.UTC(+m[1], +m[2]-1, +m[3])) : null; };
const dateStr = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate());
const addDays = (s,n) => { const d = parseDate(s); d.setUTCDate(d.getUTCDate()+n); return dateStr(d); };
const weekday = s => parseDate(s).getUTCDay();
const fmtDay = s => { const d = parseDate(s); return d ? d.toLocaleDateString('en-GB',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'}) : '—'; };
const fmtDayShort = s => { const d = parseDate(s); return d ? d.toLocaleDateString('en-GB',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short'}) : '—'; };
const fmtMonth = ym => { const [y,m] = ym.split('-').map(Number); return new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-GB',{timeZone:'UTC',month:'long',year:'numeric'}); };
const fmtMoney = n => Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const plural = (n,w) => n + ' ' + w + (n===1?'':'s');
const waNumber = n => { let d = String(n||'').replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '92' + d.slice(1); return d; };
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => { let s=''; for (let i=0;i<6;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return s; };
const takenKey = (date,time) => date + '_' + String(time).replace(':','');

function nowTz(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { date: g('year')+'-'+g('month')+'-'+g('day'), min: (+g('hour'))*60 + (+g('minute')) };
}
function instantUTC(date,time){ // wall-clock in TZ -> real instant
  const d = parseDate(date), n = toMin(time);
  return new Date(d.getTime() + n*60000 - TZ_OFFSET_MIN*60000);
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

function mergeSettings(d){
  d = d || {};
  const s = Object.assign({}, DEFAULTS, d);
  s.weekly = {};
  for (let i=0;i<7;i++) s.weekly[i] = Object.assign({}, DEFAULTS.weekly[i], (d.weekly||{})[i] || {});
  ['duration','buffer','horizon','notice','price'].forEach(k => s[k] = Number(s[k]) || 0);
  s.duration = s.duration || 30; s.horizon = s.horizon || 21;
  s.blocked = Array.isArray(d.blocked) ? d.blocked.slice() : [];
  return s;
}

/* =====================================================================
   STATE
   ===================================================================== */
let db = null, auth = null, user = null, authReady = false;
let settings = mergeSettings({}), settingsExists = false;
let taken = [];                 // public: which times are held
let bookingsById = {};          // admin only
let pubErr = null, bkErr = null, authErr = '', loadedS = false, loadedT = false, slow = false;
const clientReady = () => !!pubErr || (loadedS && loadedT);
let view = (location.hash === '#admin') ? 'login' : 'book';
let step = 'day', selDate = null, selTime = null, showAllDays = false, anim = true, dir = 'fwd';
let formVals = {name:'',phone:'',city:'',age:'',email:'',notes:'',heard:'',ref:'',hp:''}, formErr = '', busy = false, lastBooking = null;
let ovFilter = 'all', sheetQ = '', sheetStatus = 'all', sheetPay = 'all', sheetSort = 'new';
let invMode = 'list', invDraft = null, invFilter = 'all', unsubI = null;
let payFilter = 'check', payOpen = null, payMatches = null, invs = {};
const keep = {};            // unsaved text in admin panels survives background refreshes
let pendingRender = false, pendingFocus = null, unsubB = null, loginBusy = false;
try { lastBooking = JSON.parse(localStorage.getItem('book_last') || 'null'); } catch(e) {}
const isAdmin = () => !!user;

/* =====================================================================
   AVAILABILITY LOGIC
   ===================================================================== */
function slotTimes(date){
  const s = settings, w = s.weekly[weekday(date)];
  if (!w || !w.on || s.blocked.includes(date)) return [];
  const a = toMin(w.start), b = toMin(w.end);
  if (isNaN(a) || isNaN(b)) return [];
  const step = s.duration + s.buffer, out = [];
  for (let t = a; t + s.duration <= b; t += step) out.push(t);
  return out;
}
function isPast(date,t){
  const n = nowTz();
  if (date < n.date) return true;
  if (date > n.date) return false;
  return t < n.min + settings.notice*60;
}
const overlapsTaken = (date,t,dur) => taken.some(k => k.date === date && t < k.end && k.start < t + dur);
const capacity = date => slotTimes(date).filter(t => !isPast(date,t)).length;
const openSlots = date => slotTimes(date).filter(t => !isPast(date,t) && !overlapsTaken(date,t,settings.duration));
const maxDate = () => addDays(nowTz().date, settings.horizon);
const inRange = date => date >= nowTz().date && date <= maxDate();

function nextAvailable(){
  const today = nowTz().date;
  for (let i=0;i<=settings.horizon;i++){
    const d = addDays(today,i), o = openSlots(d);
    if (o.length) return {date:d, t:o[0]};
  }
  return null;
}
function openThisWeek(){
  const today = nowTz().date; let n = 0;
  for (let i=0;i<7;i++) n += openSlots(addDays(today,i)).length;
  return n;
}
/* =====================================================================
   FIREBASE
   ===================================================================== */
const T = id => db.collection('bk_taken').doc(id);
const occKey = b => (OCC.includes(b.status) && parseDate(b.date) && !isNaN(toMin(b.time))) ? takenKey(b.date,b.time) : null;

function initFirebase(){
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try { auth = firebase.auth(); } catch(e) { auth = null; }
  } catch(e) { db = null; }
  if (!db){ pubErr = 'init'; authReady = true; render(); return; }

  db.collection('bk_settings').doc('config').onSnapshot(snap => {
    settingsExists = snap.exists; settings = mergeSettings(snap.exists ? snap.data() : {}); loadedS = true;
    pubErr = null; softRender(['book','ov','pay','avail','settings']);
  }, err => { pubErr = err.code || 'error'; render(); });

  db.collection('bk_taken').where('date','>=',nowTz().date).onSnapshot(snap => {
    taken = snap.docs.map(d => Object.assign({id:d.id}, d.data())); loadedT = true;
    pubErr = null; softRender(['book','ov']);
  }, err => { pubErr = err.code || 'error'; render(); });

  if (auth){
    auth.onAuthStateChanged(u => {
      const changed = !!u !== !!user || view !== 'book';   // a visitor who is simply not signed in changes nothing on screen
      user = u; authReady = true;
      if (u){ subBookings(); if (view === 'login') view = 'ov'; }
      else { unsubBookings(); if (view !== 'book' && view !== 'login') view = 'book'; }
      if (changed) render();
    });
  } else { authReady = true; render(); }
}
function subBookings(){
  if (unsubB) return;
  subInvoices();
  unsubB = db.collection('bk_bookings').onSnapshot(snap => {
    bookingsById = {};
    snap.docs.forEach(d => { bookingsById[d.id] = Object.assign({code:d.id}, d.data()); });
    bkErr = null; softRender(['ov','sheet','pay']);
  }, err => { bkErr = err.code || 'error'; render(); });
}
function unsubBookings(){ unsubInvoices(); if (unsubB){ unsubB(); unsubB = null; } bookingsById = {}; bkErr = null; }

async function saveBooking(id, patch){
  const prev = bookingsById[id]; if (!prev) return;
  const next = Object.assign({}, prev, patch);
  const pk = occKey(prev), nk = occKey(next);
  const bref = db.collection('bk_bookings').doc(id);
  await db.runTransaction(async tx => {
    let pSnap = null, nSnap = null;
    if (pk && pk !== nk) pSnap = await tx.get(T(pk));
    if (nk) nSnap = await tx.get(T(nk));
    if (nk && nSnap.exists && nSnap.data().code !== id){
      const e = new Error('CONFLICT'); e.other = nSnap.data().code; throw e;
    }
    if (pk && pk !== nk && pSnap && pSnap.exists && pSnap.data().code === id) tx.delete(T(pk));
    if (nk){
      const start = toMin(next.time);
      tx.set(T(nk), {date:next.date, start, end:start + (Number(next.duration) || settings.duration), code:id});
    }
    tx.set(bref, next);
  });
  bookingsById[id] = next;
}
async function deleteBooking(id){
  const prev = bookingsById[id]; if (!prev) return;
  const pk = occKey(prev);
  await db.runTransaction(async tx => {
    let s = null;
    if (pk) s = await tx.get(T(pk));
    if (s && s.exists && s.data().code === id) tx.delete(T(pk));
    tx.delete(db.collection('bk_bookings').doc(id));
  });
  delete bookingsById[id];
}
async function saveSettings(patch){
  await db.collection('bk_settings').doc('config').set(patch, {merge:true});
}

/* =====================================================================
   RENDER — dispatch
   ===================================================================== */
const isEditing = () => { const a = document.activeElement; return !!(a && main.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); };
function softRender(views){
  if (views && !views.includes(view)) return;
  if (isEditing()){ pendingRender = true; return; }
  render();
}
function render(){
  pendingRender = false;
  // entrance animations play once per screen change — and only after real data has arrived,
  // otherwise the first redraw (defaults -> live data) would cut the animation short
  const ready = view !== 'book' || clientReady();
  const animate = anim && ready; if (ready) anim = false;
  renderHeader();
  main.className = (view === 'book') ? 'client' : '';
  if (view !== 'book' && view !== 'login' && !isAdmin()) view = authReady ? 'login' : view;
  if (view === 'login') main.innerHTML = loginHtml();
  else if (view === 'ov') main.innerHTML = overviewHtml();
  else if (view === 'sheet'){ main.innerHTML = sheetHtml(); renderSheetBody(); }
  else if (view === 'pay') main.innerHTML = payHtml();
  else if (view === 'inv') main.innerHTML = invHtml();
  else if (view === 'avail') main.innerHTML = availHtml();
  else if (view === 'settings') main.innerHTML = settingsHtml();
  else main.innerHTML = bookHtml(animate);
  if (pendingFocus){
    const el = main.querySelector('[data-id="' + pendingFocus.id + '"][data-k="' + pendingFocus.k + '"]');
    if (el) el.focus();
    pendingFocus = null;
  }
}
function renderHeader(){
  const tabs = $('#tabs'), right = $('#hdrRight');
  if (isAdmin()){
    const TABS = [['book','Booking page'],['ov','Overview'],['sheet','Sheet'],['pay','Payments'],['inv','Invoices'],['avail','Availability'],['settings','Settings']];
    tabs.innerHTML = TABS.map(t => '<button type="button" data-act="go" data-v="' + t[0] + '" class="' + (view===t[0]?'active':'') + '">' + t[1] + '</button>').join('');
    tabs.style.display = '';
    right.innerHTML = '<span class="admin-pill">ADMIN</span><button type="button" class="hdr-btn" data-act="signOut">Sign out</button>';
  } else {
    tabs.innerHTML = ''; tabs.style.display = 'none';
    right.innerHTML = view === 'login'
      ? '<button type="button" class="hdr-btn" data-act="go" data-v="book">← Back to booking</button>'
      : '';
  }
}

/* =====================================================================
   CLIENT: booking page — one question per screen
   day -> time -> details -> done. Each step is its own small function.
   ===================================================================== */
const moneyTxt = n => (settings.currency === 'PKR' ? 'Rs ' : settings.currency + ' ') + fmtMoney(n);
const timesLeft = n => n === 1 ? '1 time left' : n + ' times left';
function hoursParts(){
  const order = [1,2,3,4,5,6,0], nm = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], groups = {};
  order.forEach(d => { const w = settings.weekly[d]; if (w.on){ const k = w.start + '|' + w.end; (groups[k] = groups[k] || []).push(d); } });
  return Object.entries(groups).map(([k,days]) => {
    const [a,b] = k.split('|');
    const idx = days.map(d => order.indexOf(d)), runs = []; let cur = [idx[0]];
    for (let i=1;i<idx.length;i++){ if (idx[i] === idx[i-1]+1) cur.push(idx[i]); else { runs.push(cur); cur = [idx[i]]; } }
    runs.push(cur);
    const label = runs.map(r => r.length >= 3 ? nm[order[r[0]]] + '–' + nm[order[r[r.length-1]]] : r.map(i => nm[order[i]]).join(', ')).join(', ');
    return label + ', ' + fmt12(a) + ' – ' + fmt12(b);
  });
}
function dayName(date){
  const t = nowTz().date;
  return date === t ? 'Today' : date === addDays(t,1) ? 'Tomorrow' : parseDate(date).toLocaleDateString('en-GB',{timeZone:'UTC',weekday:'short'});
}

function stepperHtml(animate){
  const n = {day:1, time:2, form:3}[step], L = ['Choose day','Choose time','Your details'];
  return '<ol class="stepper" aria-label="Step ' + n + ' of 3">' + L.map((l,i) => {
    const k = i + 1, c = k < n ? 'done' : (k === n ? 'now' + (animate ? ' grow' : '') : '');
    return '<li class="' + c + '"' + (k === n ? ' aria-current="step"' : '') + '><span class="bar"><i></i></span>' + k + '. ' + l + '</li>';
  }).join('') + '</ol>';
}
function heroHtml(animate){
  const s = settings, hrs = hoursParts();
  const kids = [
    s.host ? '<div class="eyebrow">' + esc(s.host) + '</div>' : '',
    '<h1><span>' + esc(s.title) + '</span></h1>',
    '<div class="facts"><span class="fact">' + s.duration + ' minutes</span><span class="fact lime">' + (s.price > 0 ? esc(moneyTxt(s.price)) : 'Free') + '</span></div>',
    '<p>' + (hrs.length ? 'Open ' + esc(hrs.join(' · ')) + '.' : 'Opening hours coming soon.') + ' Takes about 1 minute to book. No account needed.</p>',
  ].filter(Boolean);
  return '<div class="hero' + (animate ? ' enter' : '') + '">' + kids.map((k,i) => k.replace(/^<(\w+)/, '<$1 style="--i:' + i + '"')).join('') + '</div>';
}
function bookHtml(animate){
  if (!clientReady()) return '<div class="loading" role="status"><span class="spin"></span>' + (slow ? 'This is taking longer than usual. Please check your internet.' : 'Loading available days…') + '</div>';
  if ((step === 'time' || step === 'form') && !selDate) step = 'day';
  if (step === 'form' && selTime == null) step = 'time';
  let banner = '';
  if (pubErr) banner = '<div class="banner err">Booking is not working right now. Please try again in a little while.' + (isAdmin() ? ' <b>(Admin: see Settings → Firebase setup.)</b>' : '') + '</div>';
  else if (isAdmin()) banner = '<div class="banner ok">You are previewing the client page. Bookings made here are real.</div>';
  else if (lastBooking && step === 'day' && lastBooking.date >= nowTz().date)
    banner = '<div class="banner ok">You already have a booking: <b>' + esc(fmtDayShort(lastBooking.date)) + ', ' + fmt12(lastBooking.time) + '</b>. <button type="button" class="btn sm" data-act="viewLast">See details</button></div>';
  const body = step === 'time' ? timeStepHtml() : step === 'form' ? formStepHtml() : step === 'done' ? doneHtml(animate) : dayStepHtml();

async function submitBooking(){
  if (busy) return;
  const v = formVals, s = settings;
  if (v.hp){ formErr = 'Something went wrong. Please reload the page and try again.'; return render(); } // honeypot — bots fill it, people never see it
  const name = v.name.trim(), phone = v.phone.replace(/[\s\-()]/g,''), email = v.email.trim(), notes = v.notes.trim(), ref = v.ref.trim(), city = v.city.trim(), heard = v.heard, ageN = String(v.age).trim();
  if (name.length < 2){ formErr = 'Please type your name.'; return render(); }
  if (!/^\+?\d{7,15}$/.test(phone)){ formErr = 'Please check your WhatsApp number. Use digits only, like 03001234567.'; return render(); }
  if (city.length < 2){ formErr = 'Please type your city.'; return render(); }
  if (ageN && !(Number(ageN) >= 10 && Number(ageN) <= 99)){ formErr = 'Please check your age. Use a number between 10 and 99.'; return render(); }
  if (notes.length < 3){ formErr = 'Please write a few words about what you need help with.'; return render(); }
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ formErr = 'That email address doesn\'t look right.'; return render(); }
  if (!db || pubErr){ formErr = 'Booking is not working right now. Please try again soon.'; return render(); }
  if (!selDate || selTime == null || !openSlots(selDate).includes(selTime)){
    formErr = ''; step = 'time'; dir = 'back'; anim = true; toast('That time was just taken. Please pick another time.'); return render();
  }
  busy = true; formErr = ''; render();
  const code = genCode(), time = fromMin(selTime);
  const booking = {code, date:selDate, time, duration:s.duration, name, phone, city, age: ageN ? Number(ageN) : '', email, notes, heard: HEARD_OPTS.includes(heard) ? heard : '',
    amount:s.price, payStatus: s.price > 0 ? (ref ? 'proof' : 'unpaid') : 'free', payRef:ref,
    status:'booked', source:'Website', adminNote:'', createdAt:new Date().toISOString()};
  const tk = {date:selDate, start:selTime, end:selTime + s.duration, code};
  try {
    await db.runTransaction(async tx => {
      const r = T(takenKey(selDate,time)), snap = await tx.get(r);
      if (snap.exists) throw new Error('SLOT_TAKEN');
      tx.set(r, tk);
      tx.set(db.collection('bk_bookings').doc(code), booking);
    });
    lastBooking = booking;
    try { localStorage.setItem('book_last', JSON.stringify(booking)); } catch(e) {}
    formVals = {name:'',phone:'',city:'',age:'',email:'',notes:'',heard:'',ref:'',hp:''};
    step = 'done'; dir = 'fwd'; anim = true;
  } catch(e){
    if (e && e.message === 'SLOT_TAKEN'){ step = 'time'; dir = 'back'; anim = true; toast('Sorry, someone just booked that time. Please pick another time.'); }
    else formErr = 'Sorry, your booking was not saved. Please try once more.';
  }
  busy = false; render();
}

async function doLogin(){
  if (loginBusy) return;
  if (!auth){ authErr = 'Sign-in could not load. Check your internet connection and reload.'; return render(); }
  const email = $('#l-email').value.trim(), pass = $('#l-pass').value;
  if (!email || !pass){ authErr = 'Enter your email and password.'; return render(); }
  loginBusy = true; authErr = ''; render();
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){
    const c = e.code || '';
    if (c === 'auth/operation-not-allowed' || c === 'auth/configuration-not-found') authErr = 'Sign-in isn\'t switched on yet. In the Firebase console go to Authentication → Sign-in method → Email/Password → Enable.';
    else if (c === 'auth/too-many-requests') authErr = 'Too many attempts. Wait a few minutes and try again.';
    else if (c === 'auth/network-request-failed') authErr = 'No connection. Check your internet and try again.';
    else authErr = 'Wrong email or password.';
  }
  loginBusy = false; render();
}

// Read an amount and transaction IDs out of a pasted SMS / receipt. Heuristic — the admin always confirms.
function parsePayment(t){
  const text = String(t || ''); let amount = null, m;
  const pats = [
    /(?:amount|amt|received|paid|sent|transferred)[^\d\n]{0,24}(?:rs\.?|pkr|₨)?\s*(\d[\d,]*(?:\.\d{1,2})?)/i,
    /(?:rs\.?|pkr|₨)\s*(\d[\d,]*(?:\.\d{1,2})?)/i,
    /(\d[\d,]*(?:\.\d{1,2})?)\s*(?:rs\b|pkr\b|rupees)/i,
  ];
  for (const re of pats){
    m = re.exec(text); if (!m) continue;
    const raw = m[1].replace(/,/g,''), v = Number(raw);
    if (v > 0 && v < 10000000 && !/^0\d{9,}$/.test(raw)){ amount = v; break; } // skip phone numbers
  }
  const ids = [];
  const idRe = /(?:tid|txn|trx|trans(?:action)?|ref(?:erence)?|id)\s*(?:id|no|number|#)?\s*[:#.\-]?\s*([A-Za-z0-9]{6,})/gi;
  while ((m = idRe.exec(text))) if (!ids.includes(m[1])) ids.push(m[1]);
  (text.match(/\b[A-Za-z0-9]{8,}\b/g) || []).forEach(x => { if ((x.match(/\d/g) || []).length >= 6 && !ids.includes(x)) ids.push(x); });
  return {amount, ids};
}
function matchPayments(text, p){
  const nt = norm(text), low = String(text).toLowerCase(), digits = String(text).replace(/\D/g,''), out = [];
  bookingsList().forEach(b => {
    if (!(Number(b.amount) > 0) || ['paid','free'].includes(b.payStatus) || ['cancelled','blocked'].includes(b.status)) return;
    const why = []; let strong = false, score = 0; const ref = norm(b.payRef);
    if (ref.length >= 5 && nt.includes(ref)){ why.push('Transaction ID ' + b.payRef + ' is in the message'); strong = true; score += 100; }
    const toks = String(b.name || '').toLowerCase().split(/\s+/).filter(x => x.length >= 3);
    if (toks.length && toks.some(x => low.includes(x))){ why.push('Name found in the message'); strong = true; score += 25; }
    const ph = String(b.phone || '').replace(/\D/g,'').slice(-10);
    if (ph.length === 10 && digits.includes(ph)){ why.push('Phone number found'); strong = true; score += 25; }
    if (p.amount && Math.abs(p.amount - Number(b.amount)) < 0.01){ why.push('Amount matches (' + moneyTxt(p.amount) + ')'); score += 30; }
    if (score > 0) out.push({b, why, strong, score});
  });
  return out.sort((a,b) => b.score - a.score).slice(0, 6);
}

    '<div class="two">' + f('iv-issue','Issue date','date','issueDate') + f('iv-due','Due date','date','dueDate') + '</div></div>' +
    '<div class="card"><h3>Items</h3><div class="itemrow head"><span>Description</span><span>Qty</span><span>Price</span><span></span></div>' + items +
    '<button type="button" class="btn ghost sm" data-act="addItem">+ Add item</button>' +
    '<div class="two" style="margin-top:14px">' + f('iv-disc','Discount (amount)','number','discount',' min="0" step="1"') + f('iv-tax','Tax %','number','taxPct',' min="0" max="100" step="0.5"') + '</div>' +
    '<div class="field"><label for="iv-notes">Note on the invoice</label><textarea id="iv-notes" data-inv="notes" maxlength="600">' + esc(d.notes) + '</textarea></div></div>' +
    '<div class="actions"><button type="button" class="btn lime" data-act="saveInv"' + (locked ? ' disabled' : '') + '>Save invoice</button>' +
    '<button type="button" class="btn" data-act="printInv">Print / Save as PDF</button>' +
    (waLink ? '<a class="btn ghost" id="ivWa" href="' + esc(waLink) + '" target="_blank" rel="noopener">Send on WhatsApp</a>' : '') +
    (d.number && !locked ? '<button type="button" class="btn ghost" data-act="invPaidToggle">' + (invPaid(d) && d.status === 'paid' ? 'Mark as unpaid' : 'Mark as paid') + '</button>' : '') +
    (d.number ? '<button type="button" class="btn ghost" data-act="invVoid">' + (locked ? 'Restore invoice' : 'Void invoice') + '</button>' : '') + '</div></div>' +
    '<div><div class="muted" style="margin:0 0 8px;font-size:12.5px">Preview — this is what the client gets</div><div class="invpaper" id="invPrev">' + invoiceDoc(d) + '</div></div></div>';
}
function invHtml(){ return invMode === 'edit' && invDraft ? invEditHtml() : invListHtml(); }
function refreshInvPreview(){ const p = document.getElementById('invPrev'); if (p && invDraft) p.innerHTML = invoiceDoc(invDraft); }
function onInvInput(t){
  if (!invDraft) return;
  if (t.dataset.inv){
    const k = t.dataset.inv; invDraft[k] = (t.type === 'number') ? (t.value === '' ? '' : Number(t.value)) : t.value;
  } else if (t.dataset.item !== undefined){
    const it = invDraft.items[Number(t.dataset.item)]; if (!it) return;
    it[t.dataset.k] = (t.dataset.k === 'desc') ? t.value : (t.value === '' ? '' : Number(t.value));
  } else return;
  refreshInvPreview();
}
async function saveInvoice(){
  const d = invDraft; if (!d) return false;
  if (String(d.clientName).trim().length < 2){ toast('Please type the client name.'); return false; }
  if (!d.items.some(i => Number(i.qty) > 0 && Number(i.price) > 0)){ toast('Add at least one item with a quantity and price.'); return false; }
  const clean = Object.assign({}, d, {
    clientName:String(d.clientName).trim(), items:d.items.filter(i => String(i.desc).trim() || Number(i.price)).map(i => ({desc:String(i.desc).trim(), qty:Number(i.qty) || 0, price:Number(i.price) || 0})),
    discount:Number(d.discount) || 0, taxPct:Number(d.taxPct) || 0, currency:d.currency || settings.currency,
  });
  clean.total = invTotals(clean).total;
  try {
    if (!clean.number){
      const cref = db.collection('bk_settings').doc('counters');
      await db.runTransaction(async tx => {
        const c = await tx.get(cref), n = ((c.exists && c.data().invoice) || 0) + 1;
        clean.number = 'INV-' + String(n).padStart(4, '0'); clean.createdAt = new Date().toISOString();
        tx.set(cref, {invoice:n}, {merge:true});
        tx.set(db.collection('bk_invoices').doc(clean.number), clean);
      });
    } else await db.collection('bk_invoices').doc(clean.number).set(clean);
    invs[clean.number] = clean; invDraft = Object.assign({}, clean, {items:clean.items.map(i => Object.assign({}, i))});
    toast('Invoice ' + clean.number + ' saved'); return true;
  } catch(e){ toast('Could not save. Check your connection and the Firebase rules.'); return false; }
}
async function patchInvoice(patch){
  const d = invDraft; if (!d || !d.number) return;
  try {
    await db.collection('bk_invoices').doc(d.number).set(patch, {merge:true});
    Object.assign(invs[d.number], patch); Object.assign(d, patch); return true;
  } catch(e){ toast('Could not save. Check your connection.'); return false; }
}
function printInvoice(){
  const root = document.getElementById('printRoot'); if (!root || !invDraft) return;
  root.innerHTML = invoiceDoc(invDraft); document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  try { window.print(); } catch(e){}
  setTimeout(() => { if (document.body.classList.contains('printing') && !('onafterprint' in window)) done(); }, 1500);
}
function subInvoices(){
  if (unsubI) return;
  unsubI = db.collection('bk_invoices').onSnapshot(snap => {
    invs = {}; snap.docs.forEach(d => { invs[d.id] = Object.assign({number:d.id}, d.data()); });
    softRender(['inv','pay']);
  }, err => { bkErr = err.code || 'error'; render(); });
}
function unsubInvoices(){ if (unsubI){ unsubI(); unsubI = null; } invs = {}; invDraft = null; invMode = 'list'; }

  const sel = (id, opts, cur) => '<select id="' + id + '">' + opts.map(o => '<option value="' + o[0] + '"' + (Number(o[0])===Number(cur)?' selected':'') + '>' + o[1] + '</option>').join('') + '</select>';
  return bkBanner() + '<div class="card"><h2>Weekly hours</h2><p class="muted" style="margin:0 0 16px">Clients can book inside these hours. Times are in ' + esc(TZ_NAME) + '.</p>' +
    DAYS.map(([i,name]) => {
      const w = s.weekly[i];
      return '<div class="wk"><div class="day-name">' + name + '</div><div class="sw"><label class="switch"><input type="checkbox" id="av-on-' + i + '"' + (w.on?' checked':'') + '> Open</label></div>' +
        '<input type="time" id="av-s-' + i + '" value="' + esc(w.start) + '" aria-label="' + name + ' start"><input type="time" id="av-e-' + i + '" value="' + esc(w.end) + '" aria-label="' + name + ' end"></div>';
    }).join('') +
    '<div class="two" style="margin-top:18px"><div class="field"><label for="av-dur">Consultation length</label>' + sel('av-dur',[[15,'15 min'],[20,'20 min'],[30,'30 min'],[45,'45 min'],[60,'60 min'],[90,'90 min']],s.duration) + '</div>' +
    '<div class="field"><label for="av-buf">Break between consultations</label>' + sel('av-buf',[[0,'None'],[5,'5 min'],[10,'10 min'],[15,'15 min'],[30,'30 min']],s.buffer) + '</div>' +
    '<div class="field"><label for="av-hor">Clients can book up to</label>' + sel('av-hor',[[7,'1 week ahead'],[14,'2 weeks ahead'],[21,'3 weeks ahead'],[30,'1 month ahead'],[60,'2 months ahead']],s.horizon) + '</div>' +
    '<div class="field"><label for="av-not">Minimum notice</label>' + sel('av-not',[[0,'None'],[1,'1 hour'],[3,'3 hours'],[6,'6 hours'],[12,'12 hours'],[24,'24 hours']],s.notice) + '</div></div>' +
    '<button type="button" class="btn lime" data-act="saveAvail">Save availability</button></div>' +
    '<div class="card"><h2>Days off</h2><p class="muted" style="margin:0 0 14px">Block a whole date (holiday, travel). Existing bookings on that date stay — deal with them in the Sheet.</p>' +
    '<div style="margin-bottom:12px">' + (s.blocked.slice().sort().map(d => '<span class="blk">' + esc(fmtDayShort(d)) + ' <button type="button" data-act="rmBlock" data-date="' + esc(d) + '" aria-label="Remove ' + esc(d) + '">✕</button></span>').join('') || '<span class="muted">No days blocked.</span>') + '</div>' +
    '<div class="actions"><input type="date" id="av-block" style="width:auto" aria-label="Date to block"><button type="button" class="btn ghost" data-act="addBlock">Block this date</button></div></div>';
}
function rulesText(){
  const email = user && user.email ? user.email : 'YOUR_ADMIN_EMAIL';
  return "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n" +
    "    function isAdmin() { return request.auth != null && request.auth.token.email == '" + email + "'; }\n\n" +
    "    // existing VA tracker (unchanged)\n    match /entries/{id} { allow read, write: if true; }\n\n" +
    "    // booking page\n    match /bk_settings/{id} { allow read: if true; allow write: if isAdmin(); }\n" +
    "    match /bk_taken/{id} { allow read: if true; allow create: if true; allow update, delete: if isAdmin(); }\n" +
    "    match /bk_bookings/{id} { allow create: if true; allow read, update, delete: if isAdmin(); }\n" +
    "    match /bk_invoices/{id} { allow read, write: if isAdmin(); }\n  }\n}\n";
}
function settingsHtml(){
  const s = settings;
  return bkBanner() + '<div class="card"><h2>Consultation details</h2><p class="muted" style="margin:0 0 16px">What clients see on the booking page.</p>' +
    '<div class="two"><div class="field"><label for="st-title">Title</label><input id="st-title" type="text" maxlength="60" value="' + esc(s.title) + '"></div>' +
    '<div class="field"><label for="st-host">Your name / brand</label><input id="st-host" type="text" maxlength="60" value="' + esc(s.host) + '"></div></div>' +
    '<div class="field"><label for="st-desc">Description</label><textarea id="st-desc" maxlength="400">' + esc(s.description) + '</textarea></div>' +
    '<div class="two"><div class="field"><label for="st-price">Price (0 = free)</label><input id="st-price" type="number" min="0" step="1" value="' + esc(s.price) + '"></div>' +

    '<p class="muted" style="margin:-4px 0 16px">Your bank / JazzCash / Easypaisa details are on the <b>Payments</b> tab.</p>' +

    '<div class="two"><div class="field"><label for="st-invname">Business name</label><input id="st-invname" type="text" maxlength="80" placeholder="' + esc(s.host || 'Your business') + '" value="' + esc(s.invName) + '"></div>' +
    '<div class="field"><label for="st-invtax">Default tax % (0 = none)</label><input id="st-invtax" type="number" min="0" max="100" step="0.5" value="' + esc(s.invTax) + '"></div></div>' +
    '<div class="field"><label for="st-invdet">Address, phone, NTN…</label><textarea id="st-invdet" maxlength="300">' + esc(s.invDetails) + '</textarea></div>' +
    '<div class="field"><label for="st-invnote">Default note at the bottom</label><textarea id="st-invnote" maxlength="300">' + esc(s.invNote) + '</textarea></div>' +
    '<button type="button" class="btn lime" data-act="saveInvSet">Save invoice details</button></div>' +
    '<div class="card"><h2>Firebase setup</h2><p class="muted" style="margin:0 0 6px">One-time. Without these rules anyone could read your clients\' details, so please do this before sharing the link.</p>' +
    '<ol class="muted" style="line-height:1.7;padding-left:18px;margin:8px 0">' +
    '<li>Firebase console → <b>Authentication</b> → Get started → <b>Email/Password</b> → Enable.</li>' +
    '<li>Authentication → <b>Users</b> → Add user (your email + a strong password). This is what you sign in with.</li>' +
    '<li>Firestore Database → <b>Rules</b> → paste the rules below → Publish.</li></ol>' +
    (user ? '' : '<p class="muted">Sign in first and your email is filled in automatically.</p>') +
    '<pre class="rules" id="rulesBox">' + esc(rulesText()) + '</pre>' +
    '<button type="button" class="btn ghost" data-act="copyRules">Copy rules</button></div>';
}
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
async function saveAvail(){
  const weekly = {};
  for (let i=0;i<7;i++){
    const on = document.getElementById('av-on-' + i).checked, a = val('av-s-' + i), b = val('av-e-' + i);
    if (on && (isNaN(toMin(a)) || isNaN(toMin(b)) || toMin(b) <= toMin(a))){ toast('Check the hours — closing time must be after opening time.'); return; }
    weekly[i] = {on, start:a || '11:00', end:b || '19:00'};
  }
  const patch = {weekly, duration:Number(val('av-dur')), buffer:Number(val('av-buf')), horizon:Number(val('av-hor')), notice:Number(val('av-not'))};
  try { await saveSettings(patch); toast('Availability saved'); } catch(e){ toast('Could not save. Check your connection.'); }
}
async function saveGeneral(){
  const patch = {title:val('st-title').trim() || 'Consultation', host:val('st-host').trim(), description:val('st-desc').trim(),
    price:Math.max(0, Number(val('st-price')) || 0), currency:val('st-cur').trim() || 'PKR', whatsapp:val('st-wa').trim()};
  try { await saveSettings(patch); toast('Details saved'); } catch(e){ toast('Could not save. Check your connection.'); }
}
async function addBlock(){
  const d = val('av-block'); if (!parseDate(d)){ toast('Pick a date first.'); return; }
  if (settings.blocked.includes(d)){ toast('That date is already blocked.'); return; }
  const live = bookingsList().filter(b => b.date === d && b.status === 'booked').length;
  try {
    await saveSettings({blocked: settings.blocked.concat(d)});
    toast(live ? 'Blocked — ' + plural(live,'booking') + ' on that day still ' + (live===1?'stands':'stand') + '.' : 'Date blocked');
  } catch(e){ toast('Could not save. Check your connection.'); }
}
async function rmBlock(d){
  try { await saveSettings({blocked: settings.blocked.filter(x => x !== d)}); toast('Date unblocked'); }
  catch(e){ toast('Could not save. Check your connection.'); }
}

/* =====================================================================
   EVENTS (delegated)
   ===================================================================== */
const ACT = {
  go(el){
    const v = el.dataset.v; view = v; authErr = ''; anim = true; dir = 'fwd';
    if (v === 'book'){ step = 'day'; if (location.hash) history.replaceState(null,'',location.pathname + location.search); }
    render(); window.scrollTo(0,0);
  },
  logo(){ view = isAdmin() ? 'ov' : 'login'; authErr = ''; anim = true; dir = 'fwd'; render(); window.scrollTo(0,0); },
  signOut(){ if (auth) auth.signOut(); },
  pickDay(el){ selDate = el.dataset.date; selTime = null; step = 'time'; dir = 'fwd'; anim = true; render(); window.scrollTo(0,0); },
  pickSlot(el){ selTime = Number(el.dataset.t); step = 'form'; formErr = ''; dir = 'fwd'; anim = true; render(); window.scrollTo(0,0); },
  back(){ step = step === 'form' ? 'time' : 'day'; if (step === 'day'){ selTime = null; } formErr = ''; dir = 'back'; anim = true; render(); window.scrollTo(0,0); },
  jumpNext(){ const nx = nextAvailable(); if (!nx) return; selDate = nx.date; selTime = nx.t; step = 'form'; formErr = ''; dir = 'fwd'; anim = true; render(); window.scrollTo(0,0); },
  moreDays(){ showAllDays = true; anim = false; render(); },
  bookAnother(){ step = 'day'; selDate = null; selTime = null; dir = 'back'; anim = true; render(); window.scrollTo(0,0); },
  viewLast(){ step = 'done'; dir = 'fwd'; anim = true; render(); },
  ovF(el){ ovFilter = el.dataset.f; render(); },
  payF(el){ payFilter = el.dataset.f; render(); },
  openPay(el){ clearKeep('pd-'); payOpen = el.dataset.id; render(); const p = document.getElementById('payPanel'); if (p && p.scrollIntoView) p.scrollIntoView({behavior:'smooth', block:'start'}); },
  closePay(){ payOpen = null; clearKeep('pd-'); render(); },
  savePay(){ savePay('save'); },
  verifyPay(){ savePay('verify'); },
  notRecv(){ savePay('notrecv'); },
  async saveInstr(){
    try { await saveSettings({payInstructions: val('pay-instr').trim()}); clearKeep('instr'); toast('Payment details saved'); }
    catch(e){ toast('Could not save. Check your connection.'); }
    render();
  },
  findPay(){
    const text = val('pc-text').trim(); keep.paste = text;
    if (text.length < 4){ toast('Paste the payment message first.'); return; }
    const parsed = parsePayment(text); payMatches = {text, parsed, list:matchPayments(text, parsed)}; render();
  },
  async confirmMatch(el){
    const m = payMatches, b = bookingsById[el.dataset.id]; if (!m || !b) return;
    const patch = {payStatus:'paid', paidAt:new Date().toISOString(), payDetails:m.text, payReceived:m.parsed.amount || Number(b.amount) || 0, payDate:nowTz().date};
    if (!b.payRef && m.parsed.ids[0]) patch.payRef = m.parsed.ids[0];
    try { await saveBooking(b.code, patch); toast('Payment confirmed for ' + (b.name || b.code) + ' ✓'); m.list = m.list.filter(x => x.b.code !== b.code); }
    catch(e){ toast('Could not save. Check your connection.'); }
    render();
  },
  async saveInvSet(){
    try { await saveSettings({invName:val('st-invname').trim(), invDetails:val('st-invdet').trim(), invNote:val('st-invnote').trim(), invTax:Math.max(0, Number(val('st-invtax')) || 0)}); toast('Invoice details saved'); }
    catch(e){ toast('Could not save. Check your connection.'); }
  },
  invF(el){ invFilter = el.dataset.f; render(); },
  newInv(){ invDraft = newDraft(null); invMode = 'edit'; anim = true; render(); window.scrollTo(0,0); },
  invFromBooking(el){ const b = bookingsById[el.dataset.id]; if (!b) return; invDraft = newDraft(b); invMode = 'edit'; view = 'inv'; anim = true; render(); window.scrollTo(0,0); },
  editInv(el){ const i = invs[el.dataset.id]; if (!i) return; invDraft = Object.assign({}, i, {items:(i.items || []).map(x => Object.assign({}, x))}); invMode = 'edit'; view = 'inv'; anim = true; render(); window.scrollTo(0,0); },
  invBack(){ invMode = 'list'; invDraft = null; render(); window.scrollTo(0,0); },
  addItem(){ invDraft.items.push({desc:'', qty:1, price:0}); render(); },
  rmItem(el){ if (invDraft.items.length > 1) invDraft.items.splice(Number(el.dataset.n), 1); else invDraft.items[0] = {desc:'', qty:1, price:0}; render(); },
  async saveInv(){ await saveInvoice(); render(); },
  async printInv(){ if (!invDraft.number && !(await saveInvoice())) return; render(); printInvoice(); },
  async invPaidToggle(){
    const nowPaid = !(invDraft.status === 'paid');
    if (await patchInvoice({status: nowPaid ? 'paid' : 'unpaid', paidAt: nowPaid ? new Date().toISOString() : null})){
      const b = bookingsById[invDraft.bookingCode];
      if (nowPaid && b && b.payStatus !== 'paid'){ try { await saveBooking(b.code, {payStatus:'paid', paidAt:new Date().toISOString(), payDate:nowTz().date, payReceived:b.payReceived || Number(b.amount) || 0}); } catch(e){} }
      toast(nowPaid ? 'Marked as paid ✓' : 'Marked as unpaid');
    }
    render();
  },
  async invVoid(){
    const v = !invDraft.void;
    if (v && !confirm('Void invoice ' + invDraft.number + '? It stays in the list but is marked void.')) return;
    if (await patchInvoice({void:v})) toast(v ? 'Invoice voided' : 'Invoice restored');
    render();
  },
  async markPaid(el){
    try { await saveBooking(el.dataset.id, {payStatus:'paid', paidAt:new Date().toISOString()}); toast('Payment confirmed'); }
    catch(e){ toast('Could not save. Check your connection.'); }
    render();
  },
  async cancelB(el){
    const b = bookingsById[el.dataset.id]; if (!b) return;
    if (!confirm('Cancel ' + (b.name || 'this booking') + ' on ' + fmtDayShort(b.date) + ' at ' + fmt12(b.time) + '? The slot opens up again.')) return;
    try { await saveBooking(b.code, {status:'cancelled'}); toast('Cancelled — slot is open again'); }
    catch(e){ toast('Could not save. Check your connection.'); }
    render();
  },
  async delRow(el){
    const b = bookingsById[el.dataset.id]; if (!b) return;
    if (!confirm('Permanently delete ' + (b.name || 'this empty entry') + (validWhen(b) ? ' (' + fmtDayShort(b.date) + ' ' + fmt12(b.time) + ')' : '') + '? This cannot be undone.')) return;
    try { await deleteBooking(b.code); toast('Deleted'); } catch(e){ toast('Could not delete. Check your connection.'); }
    render();
  },
  addRow, exportCsv, saveAvail, saveGeneral, addBlock,
  rmBlock(el){ rmBlock(el.dataset.date); },
  async copyRules(){
    const t = rulesText();
    try { await navigator.clipboard.writeText(t); toast('Rules copied'); }
    catch(e){ const r = document.createRange(); r.selectNodeContents($('#rulesBox')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl/Cmd + C to copy'); }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'bookForm') submitBooking();
  else if (e.target.id === 'loginForm') doLogin();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && (t.dataset.inv || t.dataset.item !== undefined)){ onInvInput(t); }
  else if (t.dataset && t.dataset.keep){ keep[t.dataset.keep] = t.value; }
  else if (t.dataset && t.dataset.form){ formVals[t.dataset.form] = t.value; }
  else if (t.dataset && t.dataset.sheet === 'q'){ sheetQ = t.value; renderSheetBody(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('cell')) onCellChange(t);
  else if (t.dataset && t.dataset.form){ formVals[t.dataset.form] = t.value; }
  else if (t.dataset && t.dataset.keep){ keep[t.dataset.keep] = t.value; }
  else if (t.dataset && t.dataset.sheet){
    if (t.dataset.sheet === 'status') sheetStatus = t.value;
    else if (t.dataset.sheet === 'pay') sheetPay = t.value;
    else if (t.dataset.sheet === 'sort') sheetSort = t.value;
    renderSheetBody();
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.classList && t.classList.contains('cell') && t.tagName === 'INPUT'){
    e.preventDefault(); t.blur();
    const nx = main.querySelector('[data-r="' + (Number(t.dataset.r)+1) + '"][data-c="' + t.dataset.c + '"]');
    if (nx) nx.focus();
  }
});
document.addEventListener('focusout', () => {
  setTimeout(() => { if (pendingRender && !isEditing()) render(); }, 0);
});
window.addEventListener('hashchange', () => {
  if (location.hash === '#admin'){ view = isAdmin() ? 'ov' : 'login'; render(); }
});

/* =====================================================================
   GO
   ===================================================================== */
render();
initFirebase();
setTimeout(() => { slow = true; if (view === 'book' && !clientReady()) render(); }, 8000);
// roll the page forward if it's left open past midnight / as notice windows pass
setInterval(() => { if (view === 'book' && step !== 'form' && !isEditing()) render(); }, 60000);
})();
