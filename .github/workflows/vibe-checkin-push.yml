name: vibe check-in push

on:
  schedule:
    # every 5 min, all day, so check-in times changed in Supreme Leader → Settings are always covered
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_va:
        description: 'Send a test notification now to: rimsha, amna or all (leave empty for a normal run)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: vibe-checkin-push
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Karachi
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock --no-audit --no-fund firebase-admin@12.7.0
      - run: node scripts/vibe-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_VA: ${{ inputs.test_va }}
