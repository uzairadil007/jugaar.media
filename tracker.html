<style>
  #tracker-root {
    --lime: #d8ff29;
    --ink: #111111;
    --paper: #ffffff;
    --panel: #fafafa;
    --line: #e8e8e6;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 28px 20px 40px;
    max-width: 980px;
    margin: 0 auto;
  }

  #tracker-root * { box-sizing: border-box; }

  .tt-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 16px;
  }

  .tt-title {
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    margin: 0;
  }

  .tt-title span {
    background: var(--lime);
    padding: 0 6px;
  }

  .tt-header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .tt-overall {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    color: #555;
    letter-spacing: 0.3px;
  }

  .tt-admin-btn {
    background: var(--ink);
    color: var(--lime);
    border: none;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 7px 12px;
    cursor: pointer;
    border-radius: 2px;
  }
  .tt-admin-btn.on { background: var(--lime); color: var(--ink); }

  .tt-cal-row {
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tt-cal-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--lime);
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tt-cal-link:hover { opacity: 0.85; }

  .tt-cal-edit {
    background: none;
    border: 1px solid var(--line);
    color: #666;
    font-size: 12px;
    padding: 7px 10px;
    cursor: pointer;
    border-radius: 2px;
  }
  .tt-cal-edit:hover { border-color: var(--ink); color: var(--ink); }

  .tt-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  @media (max-width: 720px) {
    .tt-grid { grid-template-columns: 1fr; }
  }

  .tt-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }

  .tt-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .tt-name {
    font-weight: 800;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    margin: 0;
  }

  .tt-name-input {
    font-weight: 800;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--lime);
    padding: 2px 0;
    width: 60%;
    color: var(--ink);
    font-family: inherit;
  }
  .tt-name-input:focus { outline: none; }

  .tt-count {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: #666;
    white-space: nowrap;
  }

  .tt-bar-track {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .tt-bar-fill {
    height: 100%;
    background: var(--lime);
    transition: width 0.25s ease;
  }

  .tt-add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .tt-input {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    border-radius: 2px;
  }

  .tt-input:focus {
    outline: none;
    border-color: var(--ink);
  }

  .tt-add-btn {
    background: var(--ink);
    color: var(--lime);
    border: none;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 0 16px;
    cursor: pointer;
    border-radius: 2px;
  }
  .tt-add-btn:hover { opacity: 0.85; }

  .tt-week {
    margin-bottom: 16px;
  }
  .tt-week:last-child { margin-bottom: 0; }

  .tt-week-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #888;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 8px;
  }

  .tt-day {
    margin-bottom: 10px;
  }
  .tt-day:last-child { margin-bottom: 0; }

  .tt-day-label {
    font-size: 11.5px;
    font-weight: 700;
    color: #444;
    margin-bottom: 5px;
  }

  .tt-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .tt-task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 10px 10px;
    border-radius: 2px;
  }

  .tt-check {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    border: 2px solid var(--ink);
    background: var(--paper);
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .tt-check.done { background: var(--lime); }
  .tt-check svg { display: none; width: 12px; height: 12px; }
  .tt-check.done svg { display: block; }

  .tt-task-text {
    flex: 1;
    font-size: 14.5px;
    line-height: 1.4;
    word-break: break-word;
    padding-top: 1px;
  }

  .tt-task.done .tt-task-text {
    text-decoration: line-through;
    color: #999;
  }

  .tt-del {
    flex-shrink: 0;
    background: none;
    border: none;
    color: #bbb;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
  }
  .tt-del:hover { color: var(--ink); }

  .tt-empty {
    font-size: 13px;
    color: #999;
    padding: 18px 0;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 2px;
  }

  .tt-loading {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: #999;
    padding: 40px 0;
    text-align: center;
  }

  .tt-footer {
    margin-top: 34px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 12.5px;
    color: #999;
  }
  .tt-footer a {
    color: var(--ink);
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid var(--lime);
  }
  .tt-footer a:hover { color: #555; }

  .tt-btn:focus-visible, .tt-input:focus-visible, .tt-name-input:focus-visible,
  .tt-add-btn:focus-visible, .tt-admin-btn:focus-visible, .tt-cal-edit:focus-visible,
  .tt-check:focus-visible, .tt-del:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>

<div id="tracker-root">
  <div class="tt-loading" id="tt-loading">loading tracker…</div>
  <div id="tt-app" style="display:none;">
    <div class="tt-header">
      <h1 class="tt-title">Task <span>Tracker</span></h1>
      <div class="tt-header-right">
        <div class="tt-overall" id="tt-overall">0/0 done</div>
        <button class="tt-admin-btn" id="tt-admin-toggle">Admin</button>
      </div>
    </div>
    <div class="tt-cal-row" id="tt-cal-row"></div>
    <div class="tt-grid" id="tt-grid"></div>
    <div class="tt-footer">Made with &#10084;&#65039; by <a href="https://www.jugaar.media" target="_blank" rel="noopener">jugaar.media</a></div>
  </div>
</div>

<script>
(function () {
  const PEOPLE = ["a", "b"];
  const DEFAULT_NAMES = { a: "Hafsa", b: "Kausar" };
  const ADMIN_PIN = "2580";

  let state = {
    names: { ...DEFAULT_NAMES },
    calendarLink: "",
    tasks: { a: [], b: [] }
  };
  let adminMode = false;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  async function loadState() {
    try {
      const res = await window.storage.get("tracker:state", true);
      if (res && res.value) {
        const parsed = JSON.parse(res.value);
        state.names = { ...DEFAULT_NAMES, ...(parsed.names || {}) };
        state.calendarLink = parsed.calendarLink || "";
        state.tasks = {
          a: Array.isArray(parsed.tasks && parsed.tasks.a) ? parsed.tasks.a : [],
          b: Array.isArray(parsed.tasks && parsed.tasks.b) ? parsed.tasks.b : []
        };
      }
    } catch (e) {
      // no existing data yet, use defaults
    }
  }

  async function saveState() {
    try {
      await window.storage.set("tracker:state", JSON.stringify(state), true);
    } catch (e) {
      console.error("Failed to save tracker state", e);
    }
  }

  function checkIcon() {
    return '<svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 6L4.5 9L10.5 2" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function groupByWeek(tasks) {
    const weeks = {};
    tasks.forEach(t => {
      const created = new Date(t.createdAt);
      const monday = getMonday(created);
      const weekKey = monday.toISOString().slice(0, 10);
      const dayKey = created.toISOString().slice(0, 10);
      if (!weeks[weekKey]) {
        weeks[weekKey] = {
          monday,
          label: "Week of " + monday.toLocaleDateString(undefined, { month: "short", day: "numeric" }),
          days: {}
        };
      }
      if (!weeks[weekKey].days[dayKey]) {
        weeks[weekKey].days[dayKey] = {
          date: created,
          label: created.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }),
          tasks: []
        };
      }
      weeks[weekKey].days[dayKey].tasks.push(t);
    });
    return Object.entries(weeks)
      .sort((a, b) => b[1].monday - a[1].monday)
      .map(([key, w]) => ({
        key,
        label: w.label,
        days: Object.entries(w.days)
          .sort((a, b) => a[1].date - b[1].date)
          .map(([dk, d]) => d)
      }));
  }

  function renderOverall() {
    let total = 0, done = 0;
    PEOPLE.forEach(p => {
      total += state.tasks[p].length;
      done += state.tasks[p].filter(t => t.done).length;
    });
    document.getElementById("tt-overall").textContent = done + "/" + total + " done";
  }

  function renderCalRow() {
    const el = document.getElementById("tt-cal-row");
    let html = "";
    if (state.calendarLink) {
      html += `<a class="tt-cal-link" href="${escapeHtml(state.calendarLink)}" target="_blank" rel="noopener">&#128197; Content Calendar</a>`;
    }
    if (adminMode) {
      html += `<button class="tt-cal-edit" id="tt-cal-edit-btn">${state.calendarLink ? "Edit" : "Add"} calendar link</button>`;
    }
    el.innerHTML = html;
    const editBtn = document.getElementById("tt-cal-edit-btn");
    if (editBtn) {
      editBtn.addEventListener("click", async () => {
        const url = window.prompt("Content calendar link:", state.calendarLink || "https://");
        if (url === null) return;
        state.calendarLink = url.trim();
        await saveState();
        renderCalRow();
      });
    }
  }

  function renderPanel(p) {
    const tasks = state.tasks[p];
    const done = tasks.filter(t => t.done).length;
    const total = tasks.length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const weeks = groupByWeek(tasks);

    const nameHtml = adminMode
      ? `<input class="tt-name-input" data-person="${p}" value="${escapeHtml(state.names[p])}" spellcheck="false" />`
      : `<h2 class="tt-name">${escapeHtml(state.names[p])}</h2>`;

    const weeksHtml = weeks.length
      ? weeks.map(w => `
        <div class="tt-week">
          <div class="tt-week-label">${escapeHtml(w.label)}</div>
          ${w.days.map(d => `
            <div class="tt-day">
              <div class="tt-day-label">${escapeHtml(d.label)}</div>
              <ul class="tt-list">
                ${d.tasks.map(t => `
                  <li class="tt-task ${t.done ? "done" : ""}" data-id="${t.id}">
                    <button class="tt-check ${t.done ? "done" : ""}" data-action="toggle" data-id="${t.id}" aria-label="Mark task complete">${checkIcon()}</button>
                    <div class="tt-task-text">${escapeHtml(t.text)}</div>
                    ${adminMode ? `<button class="tt-del" data-action="delete" data-id="${t.id}" aria-label="Delete task">&times;</button>` : ""}
                  </li>
                `).join("")}
              </ul>
            </div>
          `).join("")}
        </div>
      `).join("")
      : `<div class="tt-empty">No tasks yet</div>`;

    return `
      <div class="tt-panel" data-person="${p}">
        <div class="tt-panel-head">
          ${nameHtml}
          <div class="tt-count">${done}/${total}</div>
        </div>
        <div class="tt-bar-track"><div class="tt-bar-fill" style="width:${pct}%"></div></div>
        ${adminMode ? `
          <div class="tt-add-row">
            <input class="tt-input" type="text" placeholder="Add today's task…" data-person="${p}" data-role="new-task" />
            <button class="tt-add-btn" data-action="add" data-person="${p}">Add</button>
          </div>
        ` : ""}
        ${weeksHtml}
      </div>
    `;
  }

  function render() {
    document.getElementById("tt-admin-toggle").textContent = adminMode ? "Admin: On" : "Admin";
    document.getElementById("tt-admin-toggle").classList.toggle("on", adminMode);
    renderCalRow();
    document.getElementById("tt-grid").innerHTML = PEOPLE.map(renderPanel).join("");
    renderOverall();
    attachEvents();
  }

  function attachEvents() {
    if (adminMode) {
      document.querySelectorAll(".tt-name-input").forEach(input => {
        input.addEventListener("change", async (e) => {
          const p = e.target.getAttribute("data-person");
          state.names[p] = e.target.value.trim() || DEFAULT_NAMES[p];
          await saveState();
          render();
        });
      });

      document.querySelectorAll('[data-role="new-task"]').forEach(input => {
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") addTask(e.target.getAttribute("data-person"), e.target);
        });
      });

      document.querySelectorAll('[data-action="add"]').forEach(btn => {
        btn.addEventListener("click", (e) => {
          const p = e.target.getAttribute("data-person");
          const input = document.querySelector(`[data-role="new-task"][data-person="${p}"]`);
          addTask(p, input);
        });
      });

      document.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const p = e.currentTarget.closest(".tt-panel").getAttribute("data-person");
          const id = e.currentTarget.getAttribute("data-id");
          state.tasks[p] = state.tasks[p].filter(t => t.id !== id);
          await saveState();
          render();
        });
      });
    }

    document.querySelectorAll('[data-action="toggle"]').forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const p = e.currentTarget.closest(".tt-panel").getAttribute("data-person");
        const id = e.currentTarget.getAttribute("data-id");
        const task = state.tasks[p].find(t => t.id === id);
        if (task) task.done = !task.done;
        await saveState();
        render();
      });
    });
  }

  async function addTask(p, inputEl) {
    const text = inputEl.value.trim();
    if (!text) return;
    state.tasks[p].push({ id: uid(), text, done: false, createdAt: new Date().toISOString() });
    inputEl.value = "";
    await saveState();
    render();
    const newInput = document.querySelector(`[data-role="new-task"][data-person="${p}"]`);
    if (newInput) newInput.focus();
  }

  function toggleAdmin() {
    if (adminMode) {
      adminMode = false;
      render();
      return;
    }
    const pin = window.prompt("Enter admin PIN to add or edit tasks:");
    if (pin === null) return;
    if (pin === ADMIN_PIN) {
      adminMode = true;
      render();
    } else {
      window.alert("Incorrect PIN.");
    }
  }

  async function init() {
    await loadState();
    document.getElementById("tt-loading").style.display = "none";
    document.getElementById("tt-app").style.display = "block";
    document.getElementById("tt-admin-toggle").addEventListener("click", toggleAdmin);
    render();
  }

  init();
})();
</script>
