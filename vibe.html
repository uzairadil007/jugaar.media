<style>
:root{
  --lime:#d8ff29; --ink:#0a0a0a; --paper:#ffffff; --line:#e8e8e8; --sub:#6b6b6b;
}
:root:not([data-theme="light"]){ }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;min-height:100vh;}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0;}
.brand{display:flex;align-items:center;font-size:19px;}
.brand .logo{font-family:Helvetica,Arial,sans-serif;font-style:italic;font-weight:800;letter-spacing:.01em;color:#fff;}
.brand .logo-dot{color:var(--lime);}
nav{display:flex;gap:4px;background:#161616;border-radius:10px;padding:4px;flex-wrap:wrap;}
nav button{background:none;border:0;color:#bbb;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;}
nav button.active{background:var(--lime);color:var(--ink);}
.admin-toggle{display:flex;align-items:center;gap:8px;}
.admin-pin-wrap{position:relative;display:flex;align-items:center;}
input.admin-pin{width:104px;padding:9px 30px 9px 12px;border-radius:9px;border:1.5px solid #2b2b2b;background:#101010;color:var(--lime);
  font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:13px;letter-spacing:.18em;text-align:center;
  transition:box-shadow .15s,border-color .15s;}
input.admin-pin:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(216,255,41,.28);}
input.admin-pin::placeholder{color:#5a5a5a;letter-spacing:.02em;font-family:Helvetica,Arial,sans-serif;font-size:10.5px;text-transform:uppercase;}
button.admin-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8a8a8a;cursor:pointer;
  font-size:14px;padding:8px;line-height:1;}
button.admin-unlock{background:var(--lime);color:var(--ink);border:0;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 0 0 0 rgba(216,255,41,.5);
  transition:transform .1s;}
button.admin-unlock:active{transform:translateY(1px);}
.admin-pin-wrap.shake{animation:shakeAnim .4s;}
.admin-pin-err{width:100%;text-align:center;font-size:10.5px;color:#ff6b6b;margin-top:4px;}
.admin-pill{font-size:11px;background:var(--lime);color:var(--ink);padding:6px 12px;border-radius:20px;font-weight:800;letter-spacing:.03em;
  box-shadow:0 0 0 2px rgba(216,255,41,.25);}
button.admin-exit{background:transparent;border:1px solid #444;color:#eee;border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;}
main{max-width:980px;margin:0 auto;padding:22px 20px 40px;width:100%;flex:1 0 auto;}
.site-footer{flex-shrink:0;text-align:center;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);}
.site-footer a{color:var(--ink);font-weight:700;text-decoration:none;}
.banner{background:#fff7e0;border:1px solid #f0dca0;color:#6b5400;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:18px;}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;background:#fff;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat b{display:block;font-size:24px;margin-bottom:2px;}
.stat span{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
h2{font-size:18px;margin:0 0 4px;}
h3{font-size:14px;margin:0 0 12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
.muted{color:var(--sub);font-size:13px;}
.clock{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.clock-time{font-size:34px;font-weight:800;}
.clock-status{font-size:12.5px;color:var(--sub);margin-top:4px;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-left:8px;}
.tag.ok{background:var(--lime);color:var(--ink);}
.tag.warn{background:#111;color:#fff;}
.tag.off{background:#f2f2f2;color:#777;}
button.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:13.5px;cursor:pointer;}
button.btn.lime{background:var(--lime);color:var(--ink);}
button.btn:disabled{opacity:.4;cursor:not-allowed;}
button.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.form-row{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr auto;gap:10px;margin-bottom:12px;align-items:end;}
label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);display:block;margin-bottom:6px;}
select,input[type=number],input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--ink);}
select:disabled,input:disabled{background:#f7f7f7;color:#999;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
.rm{background:none;border:0;color:#b00;cursor:pointer;font-size:12px;padding:8px 6px;}
.lock-note{font-size:12.5px;color:var(--sub);margin-top:10px;}
.overflow{overflow-x:auto;-webkit-overflow-scrolling:touch;}
footer.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}
.tag.verified{background:#111;color:var(--lime);border:1px solid var(--lime);}
.gate-card{max-width:420px;margin:8px auto 18px;}
.gate{text-align:center;}
.gate-icon{font-size:36px;margin-bottom:4px;filter:drop-shadow(0 2px 0 var(--lime));}
.gate h2{margin-bottom:2px;}
.gate-input-wrap{position:relative;margin-top:18px;}
input.gate-input{width:100%;padding:16px 46px 16px 16px;border:2px solid var(--ink);border-radius:12px;
  font-size:20px;letter-spacing:.14em;font-family:'SFMono-Regular',Consolas,'Courier New',monospace;
  text-align:center;background:#101010;color:var(--lime);transition:box-shadow .15s,border-color .15s;}
input.gate-input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 4px rgba(216,255,41,.28);}
input.gate-input::placeholder{color:#555;letter-spacing:.05em;font-family:Helvetica,Arial,sans-serif;font-size:13px;}
.gate-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:17px;padding:6px;}
.gate-err{color:#c00;font-size:12.5px;margin-top:10px;min-height:16px;}
.gate-lock-btn{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;}
@keyframes shakeAnim{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
.gate.shake{animation:shakeAnim .45s;}
@media (max-width:640px){
  .form-row{grid-template-columns:1fr 1fr;}
  main{padding:16px 14px 32px;}
  .card{padding:16px;border-radius:14px;}
  select,input[type=number],input[type=text]{font-size:16px;}
  input.admin-pin{font-size:16px;letter-spacing:.1em;width:118px;}
  input.gate-input{font-size:18px;}
  .clock-time{font-size:26px;}
  nav button{padding:10px 14px;}
  button.admin-eye,button.gate-eye{padding:10px;}
}
@media (max-width:480px){
  header{flex-direction:column;align-items:stretch;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));}
  .brand{justify-content:center;}
  nav{overflow-x:auto;justify-content:flex-start;}
  .admin-toggle{justify-content:center;}
  .admin-pin-wrap{flex:1;}
  input.admin-pin{width:100%;}
  .form-row{grid-template-columns:1fr;}
  .grid3{grid-template-columns:1fr 1fr;}
  button.btn{width:100%;}
  footer.actions{flex-direction:column;align-items:stretch;}
  .clock{flex-direction:column;align-items:flex-start;}
  .clock > div:last-child{text-align:left;}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">vibe<span class="logo-dot">.</span></span></div>
  <nav id="tabs"></nav>
  <div class="admin-toggle" id="adminBox"></div>
</header>
<main id="app"></main>
<footer class="site-footer">
  VIBE by <a href="https://www.jugaar.media" target="_blank" rel="noopener">@jugaar.media</a>
</footer>

<script>
const VAS = [
  { id:'rimsha', name:'Rimsha', role:'va', shiftStart:9,  shiftEnd:15, shiftLabel:'9:00 AM – 3:00 PM' },
  { id:'amna',   name:'Amna',   role:'va', shiftStart:15, shiftEnd:21, shiftLabel:'3:00 PM – 9:00 PM' },
  { id:'noor',   name:'Noor',   role:'supervisor', shiftLabel:'Supervisor — verifies Rimsha & Amna' },
];
const PLATFORMS = ['Instagram','Facebook','TikTok','YouTube'];
const ACCOUNTS_BY_PLATFORM = {
  'Instagram': ['@tsk_diet','@tskdiet_stories','@tehreemkhan_tsk'],
  'Facebook':  ['@tsk_diet','@tskdiet_stories','@tehreemkhan_tsk'],
  'TikTok':    ['@tskdiet'],
  'YouTube':   ['Account 1','Account 2','Account 3'],
};
const accountsFor = platform => ACCOUNTS_BY_PLATFORM[platform] || ['Account 1'];
const ADMIN_PIN = '2029';
const PASSCODES = { rimsha:'@rimsha3#', amna:'@amna9(', noor:'@noor4$' };

let db = null, dbAvailable = false;
let entries = {};          // key: vaId_date -> {signIn,signOut,logs[],submitted,verifiedByNoor,verifiedAt}
let adminMode = false;
let activeTab = 'dashboard';
let unlocked = {};          // vaId -> true, once passcode entered this session
const localKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => localKey(new Date());
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true}) : '—';
const hoursBetween = (a,b) => a && b ? Math.max(0,(new Date(b)-new Date(a))/3600000) : 0;
const entryKey = (va,d) => va+'_'+d;

function getEntry(va, date){
  return entries[entryKey(va,date)] || { vaId:va, date, signIn:null, signOut:null, logs:[], submitted:false };
}
function totals(e){
  return e.logs.reduce((a,l)=>({appts:a.appts+Number(l.appts||0), dms:a.dms+Number(l.dms||0)}), {appts:0,dms:0});
}
function dmsByPlatform(day){
  const out = {}; PLATFORMS.forEach(p=> out[p]=0);
  VAS.filter(v=>v.role==='va').forEach(va=>{
    getEntry(va.id, day).logs.forEach(l=>{ out[l.platform] = (out[l.platform]||0) + Number(l.dms||0); });
  });
  return out;
}

// ---------- per-VA passcode lock ----------
function isUnlocked(vaId){
  if(adminMode) return true;
  if(unlocked[vaId]) return true;
  try{ return sessionStorage.getItem('vibe_unlock_'+vaId) === '1'; }catch(e){ return false; }
}
function unlockVa(vaId){
  unlocked[vaId] = true;
  try{ sessionStorage.setItem('vibe_unlock_'+vaId, '1'); }catch(e){}
}
function lockVa(vaId){
  delete unlocked[vaId];
  try{ sessionStorage.removeItem('vibe_unlock_'+vaId); }catch(e){}
}

// ---------- persistence ----------
function localSave(){ try{ localStorage.setItem('kpi_fallback', JSON.stringify(entries)); }catch(e){} }
function localLoad(){ try{ return JSON.parse(localStorage.getItem('kpi_fallback')||'{}'); }catch(e){ return {}; } }

async function writeEntry(va, date, patch){
  const key = entryKey(va,date);
  const current = getEntry(va,date);
  const next = { ...current, ...patch };
  entries[key] = next;
  if(dbAvailable && db){
    try{ await db.collection('entries').doc(key).set(next); }
    catch(err){ /* rejected write: keep local state, re-render */ render(); }
  } else {
    localSave(); render();
  }
}

// admin-only: wipe one day's attendance/logs for a VA back to blank (they can sign in fresh)
async function resetEntry(va, date){
  if(!adminMode) return;
  const key = entryKey(va,date);
  const blank = { vaId:va, date, signIn:null, signOut:null, logs:[], submitted:false, verifiedByNoor:false, verifiedAt:null };
  entries[key] = blank;
  if(dbAvailable && db){
    try{ await db.collection('entries').doc(key).set(blank); }
    catch(err){ render(); }
  } else {
    localSave();
  }
  render();
}

// admin-only: permanently remove a day's entry/log from the database entirely
async function deleteEntry(va, date){
  if(!adminMode) return;
  const key = entryKey(va,date);
  delete entries[key];
  if(dbAvailable && db){
    try{ await db.collection('entries').doc(key).delete(); }
    catch(err){ render(); }
  } else {
    localSave();
  }
  render();
}

const firebaseConfig = {
  apiKey: "AIzaSyAZn-MWlArpHYcb7Z88u-wzKdrBxtIsYiE",
  authDomain: "tracker-9a8cb.firebaseapp.com",
  projectId: "tracker-9a8cb",
  storageBucket: "tracker-9a8cb.firebasestorage.app",
  messagingSenderId: "765187139896",
  appId: "1:765187139896:web:61ddd4fad7ee85364239cd"
};

(async function init(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; }
  if(db){
    dbAvailable = true;
    db.collection('entries').orderBy('date','desc').limit(200).onSnapshot(
      snap => { entries = {}; snap.docs.forEach(d => entries[d.id] = d.data()); render(); },
      err => { dbAvailable = false; entries = localLoad(); render(); }
    );
  } else {
    entries = localLoad();
    render();
  }
  try{ adminMode = sessionStorage.getItem('kpi_admin') === '1'; }catch(e){}
  render();
  setInterval(tickLiveElements, 1000);
})();

// ---------- live (real-time) date/time/hours ticking ----------
function tickLiveElements(){
  const now = new Date();
  document.querySelectorAll('.live-clock-time').forEach(el=>{
    el.textContent = now.toLocaleString([], {weekday:'long', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true});
  });
  document.querySelectorAll('.live-hours').forEach(el=>{
    const signIn = el.dataset.signin || null;
    const signOut = el.dataset.signout || null;
    if(!signIn) return;
    const hrs = hoursBetween(signIn, signOut || now.toISOString());
    el.textContent = hrs.toFixed(2);
  });
  // if the day has rolled over past midnight while the page stayed open, refresh the whole view
  const k = todayKey();
  if(k !== tickLiveElements._lastDay){
    if(tickLiveElements._lastDay !== undefined) render();
    tickLiveElements._lastDay = k;
  }
}

// ---------- UI: header ----------
function renderNav(){
  const tabs = document.getElementById('tabs');
  const items = [{id:'dashboard',name:'Dashboard'}, ...VAS];
  tabs.innerHTML = items.map(t=>
    `<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}">${t.name}</button>`
  ).join('');
  tabs.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ activeTab = b.dataset.tab; render(); });

  const box = document.getElementById('adminBox');
  if(adminMode){
    box.innerHTML = `<span class="admin-pill">🔓 ADMIN MODE</span><button class="admin-exit" id="exitAdmin">Exit</button>`;
    document.getElementById('exitAdmin').onclick = ()=>{ adminMode=false; try{sessionStorage.removeItem('kpi_admin')}catch(e){} render(); };
  } else {
    box.innerHTML = `
      <div class="admin-pin-wrap" id="pinWrap">
        <input id="pinInput" class="admin-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="ADMIN PIN" maxlength="6">
        <button type="button" class="admin-eye" id="pinEye" aria-label="Show PIN">👁</button>
      </div>
      <button class="admin-unlock" id="pinBtn">🔒 Unlock</button>`;
    const pinInput = document.getElementById('pinInput');
    const pinWrap = document.getElementById('pinWrap');
    const tryUnlock = ()=>{
      const v = pinInput.value.trim();
      if(v === ADMIN_PIN){ adminMode = true; try{sessionStorage.setItem('kpi_admin','1')}catch(e){} render(); }
      else {
        pinWrap.classList.remove('shake'); void pinWrap.offsetWidth; pinWrap.classList.add('shake');
        pinInput.value=''; pinInput.focus();
      }
    };
    document.getElementById('pinBtn').onclick = tryUnlock;
    document.getElementById('pinEye').onclick = ()=>{ pinInput.type = pinInput.type==='password' ? 'text' : 'password'; };
    pinInput.onkeydown = ev => { if(ev.key === 'Enter') tryUnlock(); };
  }
}

function render(){
  renderNav();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!dbAvailable){
    app.innerHTML += `<div class="banner">Can't reach the shared database right now, so changes are being saved to this device only. Check your internet connection and reload — once it reconnects, everything will sync across the team automatically.</div>`;
  }
  if(activeTab === 'dashboard') renderDashboard(app);
  else renderVaPage(app, activeTab);
}

// ---------- Dashboard ----------
function renderDashboard(app){
  const d = todayKey();
  const staff = VAS.filter(v=>v.role==='va');
  let teamAppts=0, teamDms=0, working=0;
  const rows = staff.map(va=>{
    const e = getEntry(va.id, d);
    const t = totals(e);
    teamAppts += t.appts; teamDms += t.dms;
    const status = !e.signIn ? 'Not signed in' : (!e.signOut ? 'Working' : 'Signed out');
    if(status==='Working') working++;
    const hrs = hoursBetween(e.signIn, e.signOut || (status==='Working' ? new Date().toISOString() : null));
    return {va, e, t, status, hrs};
  });

  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <h2>Team overview — today</h2>
    <p class="muted live-clock-time">${new Date().toLocaleString([], {weekday:'long', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true})}</p>
    <div class="grid3" style="margin-top:14px;">
      <div class="stat"><b>${teamAppts}</b><span>Appointments booked</span></div>
      <div class="stat"><b>${teamDms}</b><span>DMs answered</span></div>
      <div class="stat"><b>${working}/${staff.length}</b><span>Currently clocked in</span></div>
    </div>`;
  app.appendChild(card);

  // one table: per-VA attendance/progress plus a platform-by-platform breakdown of appts/DMs
  const rowsWithPlatforms = rows.map(r=>{
    const byPlatform = PLATFORMS.map(p=>{
      const logs = r.e.logs.filter(l=>l.platform===p);
      return { platform:p, appts: logs.reduce((s,l)=>s+Number(l.appts||0),0), dms: logs.reduce((s,l)=>s+Number(l.dms||0),0) };
    }).filter(x=>x.appts>0 || x.dms>0);
    return { ...r, byPlatform: byPlatform.length ? byPlatform : [{platform:'—', appts:0, dms:0}] };
  });

  const table = document.createElement('div');
  table.className='card overflow';
  table.innerHTML = `<h3>Today by VA — platform breakdown</h3>
    <table><thead><tr><th>VA</th><th>Status</th><th>Sign in</th><th>Sign out</th><th class="num">Hours</th><th>Submitted</th><th>Verified</th><th>Platform</th><th class="num">Appts</th><th class="num">DMs</th>${adminMode?'<th></th>':''}</tr></thead>
    <tbody>${rowsWithPlatforms.map(r=> r.byPlatform.map((p,i)=>`<tr>
      ${i===0 ? `
      <td rowspan="${r.byPlatform.length}">${r.va.name}<div class="muted" style="font-size:12px;">${r.va.shiftLabel}</div></td>
      <td rowspan="${r.byPlatform.length}">${r.status}</td>
      <td rowspan="${r.byPlatform.length}">${fmtTime(r.e.signIn)}</td>
      <td rowspan="${r.byPlatform.length}">${fmtTime(r.e.signOut)}</td>
      <td class="num" rowspan="${r.byPlatform.length}"><span class="live-hours" data-signin="${r.e.signIn||''}" data-signout="${r.e.signOut||''}">${r.hrs.toFixed(2)}</span></td>
      <td rowspan="${r.byPlatform.length}">${r.e.submitted ? '<span class="tag ok">Submitted</span>' : '<span class="tag off">Open</span>'}</td>
      <td rowspan="${r.byPlatform.length}">${r.e.verifiedByNoor ? '<span class="tag verified">Verified</span>' : '<span class="tag off">—</span>'}</td>` : ''}
      <td>${p.platform}</td>
      <td class="num">${p.appts}</td>
      <td class="num">${p.dms}</td>
      ${i===0 && adminMode ? `<td rowspan="${r.byPlatform.length}"><button class="btn ghost" data-va="${r.va.id}" onclick="activeTab='${r.va.id}';render();">Open</button> <button class="btn ghost" data-reset-today="${r.va.id}">Reset</button></td>` : ''}
    </tr>`).join('')).join('')}</tbody></table>
    <p class="muted" style="margin-top:12px;">Noor supervises Rimsha and Amna — she verifies each submitted day from her own tab.${adminMode?` <button class="btn ghost" onclick="activeTab='noor';render();">Open Noor's tab</button>`:''}</p>`;
  app.appendChild(table);
  table.querySelectorAll('[data-reset-today]').forEach(b=>{
    b.onclick = ()=>{ if(confirm(`Reset today's attendance and logs for ${b.dataset.resetToday}? This clears sign-in/out, logs, submitted and verified status for today only.`)) resetEntry(b.dataset.resetToday, d); };
  });

  const noor = VAS.find(v=>v.id==='noor');
  const ne = getEntry(noor.id, d);
  const nStatus = !ne.signIn ? 'Not signed in' : (!ne.signOut ? 'Working' : 'Signed out');
  const nHrs = hoursBetween(ne.signIn, ne.signOut || (nStatus==='Working' ? new Date().toISOString() : null));
  const nCard = document.createElement('div');
  nCard.className='card';
  nCard.innerHTML = `<h3>Noor — supervisor attendance today</h3>
    <div class="grid3">
      <div class="stat"><b>${nStatus}</b><span>Status</span></div>
      <div class="stat"><b>${fmtTime(ne.signIn)} → ${fmtTime(ne.signOut)}</b><span>Sign in / out</span></div>
      <div class="stat"><b><span class="live-hours" data-signin="${ne.signIn||''}" data-signout="${ne.signOut||''}">${nHrs.toFixed(2)}</span></b><span>Hours today</span></div>
    </div>`;
  app.appendChild(nCard);
}

// ---------- passcode gate ----------
function renderGate(app, va){
  const card = document.createElement('div');
  card.className='card gate-card';
  card.innerHTML = `
    <div class="gate">
      <div class="gate-icon">🔒</div>
      <h2>${va.name}'s private area</h2>
      <p class="muted">${va.shiftLabel}</p>
      <p class="muted">Enter your passcode to continue.</p>
      <div class="gate-input-wrap">
        <input type="password" id="gatePass" class="gate-input" placeholder="• • • • • •" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" id="gateToggle" class="gate-eye" aria-label="Show passcode">👁</button>
      </div>
      <button class="btn lime" id="gateBtn" style="width:100%;margin-top:14px;">Unlock</button>
      <p class="gate-err" id="gateErr"></p>
    </div>`;
  app.appendChild(card);
  const input = card.querySelector('#gatePass');
  const err = card.querySelector('#gateErr');
  const gate = card.querySelector('.gate');
  const tryUnlock = ()=>{
    if(input.value === PASSCODES[va.id]){
      unlockVa(va.id); render();
    } else {
      err.textContent = 'Incorrect passcode — try again.';
      gate.classList.remove('shake'); void card.offsetWidth; gate.classList.add('shake');
      input.value=''; input.focus();
    }
  };
  card.querySelector('#gateBtn').onclick = tryUnlock;
  input.onkeydown = ev => { if(ev.key==='Enter') tryUnlock(); };
  card.querySelector('#gateToggle').onclick = ()=>{ input.type = input.type==='password' ? 'text' : 'password'; };
  input.focus();
}

// ---------- Noor's supervision dashboard ----------
function renderSupervisionPage(app, noor){
  const d = todayKey();
  const staff = VAS.filter(v=>v.role==='va');
  const ne = getEntry(noor.id, d);
  const nStatus = !ne.signIn ? 'not-in' : (!ne.signOut ? 'working' : 'done');
  const nLiveHrs = hoursBetween(ne.signIn, ne.signOut || (nStatus==='working' ? new Date().toISOString() : null));

  const head = document.createElement('div');
  head.className='card';
  head.innerHTML = `
    <div class="clock">
      <div>
        <h2>${noor.name} <span class="tag ${nStatus==='working'?'ok':(nStatus==='done'?'off':'warn')}">${nStatus==='working'?'On shift':(nStatus==='done'?'Signed out':'Not signed in')}</span></h2>
        <div class="clock-status">Verifies Rimsha &amp; Amna's daily entries &middot; <span class="live-clock-time">${new Date().toLocaleString([], {weekday:'long', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true})}</span></div>
      </div>
      <div style="text-align:right;">
        <div class="clock-time">${fmtTime(ne.signIn)} → ${fmtTime(ne.signOut)}</div>
        <div class="clock-status"><span class="live-hours" data-signin="${ne.signIn||''}" data-signout="${ne.signOut||''}">${nLiveHrs.toFixed(2)}</span> hrs logged today</div>
      </div>
    </div>
    <footer class="actions">
      <button class="btn lime" id="noorSignIn" ${ne.signIn?'disabled':''}>Sign In</button>
      <button class="btn" id="noorSignOut" ${(!ne.signIn||ne.signOut)?'disabled':''}>Sign Out</button>
      ${adminMode ? `<button class="btn ghost" id="resetNoorToday">Reset today's attendance</button>` : ''}
      <button class="btn ghost" id="lockNoor" style="margin-left:auto;">Lock this tab</button>
    </footer>`;
  app.appendChild(head);
  head.querySelector('#lockNoor').onclick = ()=>{ lockVa(noor.id); render(); };
  head.querySelector('#noorSignIn').onclick = ()=> writeEntry(noor.id, d, { signIn: new Date().toISOString() });
  head.querySelector('#noorSignOut').onclick = ()=> writeEntry(noor.id, d, { signOut: new Date().toISOString() });
  const resetNoorBtn = head.querySelector('#resetNoorToday');
  if(resetNoorBtn) resetNoorBtn.onclick = ()=>{ if(confirm("Reset Noor's own attendance for today?")) resetEntry(noor.id, d); };

  staff.forEach(va=>{
    const e = getEntry(va.id, d);
    const t = totals(e);
    const status = !e.signIn ? 'Not signed in' : (!e.signOut ? 'Working' : 'Signed out');
    const hrs = hoursBetween(e.signIn, e.signOut || (status==='Working' ? new Date().toISOString() : null));
    const card = document.createElement('div');
    card.className='card overflow';
    card.innerHTML = `
      <h3>${va.name} <span class="muted" style="text-transform:none;letter-spacing:0;">&middot; ${va.shiftLabel}</span></h3>
      <div class="grid3">
        <div class="stat"><b>${status}</b><span>Status today</span></div>
        <div class="stat"><b>${fmtTime(e.signIn)} → ${fmtTime(e.signOut)}</b><span>Sign in / out</span></div>
        <div class="stat"><b><span class="live-hours" data-signin="${e.signIn||''}" data-signout="${e.signOut||''}">${hrs.toFixed(2)}</span></b><span>Hours today</span></div>
        <div class="stat"><b>${t.appts} / ${t.dms}</b><span>Appts / DMs</span></div>
      </div>
      <footer class="actions">
        ${!e.submitted ? '<span class="tag off">Not submitted yet</span>' :
          (e.verifiedByNoor ? '<span class="tag verified">Verified ✓</span>' : `<button class="btn lime" data-verify="${va.id}">Verify today's entry</button>`)}
        ${adminMode ? `<button class="btn ghost" data-reset-va="${va.id}" style="margin-left:auto;">Reset today's attendance</button>` : ''}
      </footer>`;
    app.appendChild(card);
    const btn = card.querySelector('[data-verify]');
    if(btn) btn.onclick = ()=> writeEntry(va.id, d, { verifiedByNoor:true, verifiedAt:new Date().toISOString() });
    const rst = card.querySelector('[data-reset-va]');
    if(rst) rst.onclick = ()=>{ if(confirm(`Reset today's attendance and logs for ${va.name}?`)) resetEntry(va.id, d); };

    const days = [...Array(7)].map((_,i)=>{ const dt=new Date(); dt.setDate(dt.getDate()-i); return localKey(dt); });
    const hist = document.createElement('div');
    hist.className='card overflow';
    hist.innerHTML = `<h3>${va.name} — last 7 days</h3>
      <table><thead><tr><th>Date</th><th>Sign in</th><th>Sign out</th><th class="num">Hours</th><th class="num">Appts</th><th class="num">DMs</th><th>Submitted</th><th>Verified</th><th></th>${adminMode?'<th></th>':''}</tr></thead>
      <tbody>${days.map(dt=>{
        const he = getEntry(va.id, dt); const ht = totals(he); const hh = hoursBetween(he.signIn, he.signOut);
        return `<tr><td>${dt}</td><td>${fmtTime(he.signIn)}</td><td>${fmtTime(he.signOut)}</td><td class="num">${hh.toFixed(1)}</td><td class="num">${ht.appts}</td><td class="num">${ht.dms}</td>
          <td>${he.submitted ? '<span class="tag ok">Submitted</span>' : '<span class="tag off">Open</span>'}</td>
          <td>${he.verifiedByNoor ? '<span class="tag verified">Verified</span>' : '<span class="tag off">—</span>'}</td>
          <td>${he.submitted && !he.verifiedByNoor ? `<button class="btn ghost" data-verify-day="${va.id}_${dt}">Verify</button>` : ''}</td>
          ${adminMode ? `<td><button class="rm" data-delete-day="${va.id}_${dt}">Delete</button></td>` : ''}
        </tr>`;
      }).join('')}</tbody></table>`;
    app.appendChild(hist);
    hist.querySelectorAll('[data-verify-day]').forEach(b=>{
      b.onclick = ()=>{
        const raw = b.dataset.verifyDay; const idx = raw.indexOf('_');
        const vid = raw.slice(0, idx), dt = raw.slice(idx+1);
        writeEntry(vid, dt, { verifiedByNoor:true, verifiedAt:new Date().toISOString() });
      };
    });
    hist.querySelectorAll('[data-delete-day]').forEach(b=>{
      b.onclick = ()=>{
        const raw = b.dataset.deleteDay; const idx = raw.indexOf('_');
        const vid = raw.slice(0, idx), dt = raw.slice(idx+1);
        if(confirm(`Permanently delete ${vid}'s entry for ${dt}? This cannot be undone.`)) deleteEntry(vid, dt);
      };
    });
  });

  // Noor's own attendance history
  const nDays = [...Array(7)].map((_,i)=>{ const dt=new Date(); dt.setDate(dt.getDate()-i); return localKey(dt); });
  const nHist = document.createElement('div');
  nHist.className='card overflow';
  nHist.innerHTML = `<h3>Noor — attendance, last 7 days</h3>
    <table><thead><tr><th>Date</th><th>Sign in</th><th>Sign out</th><th class="num">Hours</th>${adminMode?'<th></th>':''}</tr></thead>
    <tbody>${nDays.map(dt=>{
      const he = getEntry(noor.id, dt); const hh = hoursBetween(he.signIn, he.signOut);
      return `<tr><td>${dt}</td><td>${fmtTime(he.signIn)}</td><td>${fmtTime(he.signOut)}</td><td class="num">${hh.toFixed(1)}</td>${adminMode?`<td><button class="rm" data-delete-noor-day="${dt}">Delete</button></td>`:''}</tr>`;
    }).join('')}</tbody></table>`;
  app.appendChild(nHist);
  nHist.querySelectorAll('[data-delete-noor-day]').forEach(b=>{
    b.onclick = ()=>{ if(confirm(`Permanently delete Noor's entry for ${b.dataset.deleteNoorDay}? This cannot be undone.`)) deleteEntry(noor.id, b.dataset.deleteNoorDay); };
  });
}

// ---------- VA page ----------
function renderVaPage(app, vaId){
  const va = VAS.find(v=>v.id===vaId);
  if(!isUnlocked(vaId)){ renderGate(app, va); return; }
  if(va.role === 'supervisor'){ renderSupervisionPage(app, va); return; }

  const d = todayKey();
  const e = getEntry(vaId, d);
  const t = totals(e);
  const locked = e.submitted && !adminMode;
  const status = !e.signIn ? 'not-in' : (!e.signOut ? 'working' : 'done');
  const liveHrs = hoursBetween(e.signIn, e.signOut || (status==='working'?new Date().toISOString():null));

  const minutesOfDay = dt => dt.getHours()*60 + dt.getMinutes();
  const lateIn = e.signIn && minutesOfDay(new Date(e.signIn)) > va.shiftStart*60 + 5; // 5 min grace
  const earlyOut = e.signOut && minutesOfDay(new Date(e.signOut)) < va.shiftEnd*60;

  const clock = document.createElement('div');
  clock.className='card';
  clock.innerHTML = `
    <div class="clock">
      <div>
        <h2>${va.name} <span class="tag ${status==='working'?'ok':(status==='done'?'off':'warn')}">${status==='working'?'On shift':(status==='done'?'Signed out':'Not signed in')}</span></h2>
        <div class="clock-status">Shift: ${va.shiftLabel} &middot; <span class="live-clock-time">${new Date().toLocaleString([], {weekday:'long', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true})}</span></div>
      </div>
      <div style="text-align:right;">
        <div class="clock-time">${fmtTime(e.signIn)} → ${fmtTime(e.signOut)}</div>
        <div class="clock-status"><span class="live-hours" data-signin="${e.signIn||''}" data-signout="${e.signOut||''}">${liveHrs.toFixed(2)}</span> hrs logged today ${lateIn?'· late sign-in':''} ${earlyOut?'· early sign-out':''}</div>
      </div>
    </div>
    <footer class="actions">
      <button class="btn lime" id="signInBtn" ${e.signIn?'disabled':''}>Sign In</button>
      <button class="btn" id="signOutBtn" ${(!e.signIn||e.signOut)?'disabled':''}>Sign Out</button>
      ${adminMode ? `<button class="btn ghost" id="resetVaToday">Reset today's attendance</button>` : ''}
      <button class="btn ghost" id="lockVa" style="margin-left:auto;">Lock this tab</button>
    </footer>`;
  app.appendChild(clock);
  clock.querySelector('#lockVa').onclick = ()=>{ lockVa(vaId); render(); };
  clock.querySelector('#signInBtn').onclick = ()=> writeEntry(vaId, d, { signIn: new Date().toISOString() });
  clock.querySelector('#signOutBtn').onclick = ()=> writeEntry(vaId, d, { signOut: new Date().toISOString() });
  const resetVaBtn = clock.querySelector('#resetVaToday');
  if(resetVaBtn) resetVaBtn.onclick = ()=>{ if(confirm(`Reset today's attendance and logs for ${va.name}? This clears sign-in/out, logs, submitted and verified status for today only.`)) resetEntry(vaId, d); };

  const form = document.createElement('div');
  form.className='card';
  form.innerHTML = `
    <h2>Log today's work</h2>
    <p class="muted" style="margin-bottom:14px;">Add one row per account you worked on today.</p>
    <div class="form-row">
      <div><label>Platform</label><select id="fPlatform" ${locked?'disabled':''}>${PLATFORMS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div><label>Account</label><select id="fAccount" ${locked?'disabled':''}>${accountsFor(PLATFORMS[0]).map(a=>`<option>${a}</option>`).join('')}</select></div>
      <div><label>Appointments</label><input type="number" min="0" id="fAppts" value="0" ${locked?'disabled':''}></div>
      <div><label>DMs answered</label><input type="number" min="0" id="fDms" value="0" ${locked?'disabled':''}></div>
      <div><button class="btn" id="addRow" ${locked?'disabled':''}>+ Add</button></div>
    </div>
    <div class="overflow">
    <table><thead><tr><th>Platform</th><th>Account</th><th class="num">Appointments</th><th class="num">DMs</th>${locked?'':'<th></th>'}</tr></thead>
    <tbody id="logRows">
      ${e.logs.length===0 ? `<tr><td colspan="${locked?4:5}" class="muted">No entries yet.</td></tr>` : e.logs.map((l,i)=>`
      <tr><td>${l.platform}</td><td>${l.account}</td><td class="num">${l.appts}</td><td class="num">${l.dms}</td>
      ${locked?'':`<td><button class="rm" data-i="${i}">Remove</button></td>`}</tr>`).join('')}
    </tbody></table>
    </div>
    <div class="grid3" style="margin-top:16px;">
      <div class="stat"><b>${t.appts}</b><span>Appointments today</span></div>
      <div class="stat"><b>${t.dms}</b><span>DMs answered today</span></div>
      <div class="stat"><b>${liveHrs.toFixed(1)}</b><span>Hours worked today</span></div>
    </div>
    <footer class="actions">
      <button class="btn lime" id="submitDay" ${locked||e.logs.length===0?'disabled':''}>${e.submitted?'Re-submit day':'Submit day'}</button>
      ${e.submitted ? `<span class="lock-note">${locked ? 'Submitted — locked. Only an admin can edit this now.' : 'Admin mode: editing an already-submitted day.'}</span>` : ''}
    </footer>`;
  app.appendChild(form);

  form.querySelector('#fPlatform').onchange = ev=>{
    const fAccount = form.querySelector('#fAccount');
    fAccount.innerHTML = accountsFor(ev.target.value).map(a=>`<option>${a}</option>`).join('');
  };
  form.querySelector('#addRow').onclick = ()=>{
    const platform = form.querySelector('#fPlatform').value;
    const account = form.querySelector('#fAccount').value;
    const appts = Number(form.querySelector('#fAppts').value||0);
    const dms = Number(form.querySelector('#fDms').value||0);
    const logs = [...e.logs, {platform,account,appts,dms}];
    writeEntry(vaId, d, { logs });
  };
  form.querySelectorAll('.rm').forEach(btn=>{
    btn.onclick = ()=>{
      const logs = e.logs.filter((_,idx)=> idx !== Number(btn.dataset.i));
      writeEntry(vaId, d, { logs });
    };
  });
  const submitBtn = form.querySelector('#submitDay');
  if(submitBtn) submitBtn.onclick = ()=> writeEntry(vaId, d, { submitted: true });

  // history (last 7 days incl today)
  const hist = document.createElement('div');
  hist.className='card overflow';
  const days = [...Array(7)].map((_,i)=>{
    const dt = new Date(); dt.setDate(dt.getDate()-i);
    return localKey(dt);
  });
  hist.innerHTML = `<h3>Last 7 days</h3>
    <table><thead><tr><th>Date</th><th>Sign in</th><th>Sign out</th><th class="num">Hours</th><th class="num">Appts</th><th class="num">DMs</th><th>Status</th>${adminMode?'<th></th>':''}</tr></thead>
    <tbody>${days.map(dt=>{
      const he = getEntry(vaId, dt);
      const ht = totals(he);
      const hh = hoursBetween(he.signIn, he.signOut);
      return `<tr><td>${dt}</td><td>${fmtTime(he.signIn)}</td><td>${fmtTime(he.signOut)}</td><td class="num">${hh.toFixed(1)}</td><td class="num">${ht.appts}</td><td class="num">${ht.dms}</td><td>${he.submitted?'<span class="tag ok">Submitted</span>':(he.signIn?'<span class="tag off">Open</span>':'—')}</td>${adminMode?`<td><button class="rm" data-delete-va-day="${dt}">Delete</button></td>`:''}</tr>`;
    }).join('')}</tbody></table>`;
  app.appendChild(hist);
  hist.querySelectorAll('[data-delete-va-day]').forEach(b=>{
    b.onclick = ()=>{ if(confirm(`Permanently delete ${va.name}'s entry for ${b.dataset.deleteVaDay}? This cannot be undone.`)) deleteEntry(vaId, b.dataset.deleteVaDay); };
  });
}
</script>
</body>
</html>
