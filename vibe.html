<style>
:root{
  --lime:#d8ff29; --ink:#0a0a0a; --paper:#ffffff; --line:#e8e8e8; --sub:#6b6b6b;
}
:root:not([data-theme="light"]){ }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0;}
.brand{display:flex;align-items:center;font-size:19px;}
.brand .logo{font-family:'Helvetica World','Helvetica Neue',Helvetica,Arial,sans-serif;font-style:italic;font-weight:800;letter-spacing:.01em;color:#fff;}
.brand .logo-dot{color:var(--lime);}
nav{display:flex;gap:4px;background:#161616;border-radius:10px;padding:4px;flex-wrap:wrap;}
nav button{background:none;border:0;color:#bbb;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;}
nav button.active{background:var(--lime);color:var(--ink);}
.admin-toggle{display:flex;align-items:center;gap:8px;}
.admin-pin-wrap{position:relative;display:flex;align-items:center;}
input.admin-pin{width:104px;padding:9px 30px 9px 12px;border-radius:9px;border:1.5px solid #2b2b2b;background:#101010;color:var(--lime);
  font-family:inherit;font-size:13px;letter-spacing:.18em;text-align:center;
  transition:box-shadow .15s,border-color .15s;}
input.admin-pin:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(216,255,41,.28);}
input.admin-pin::placeholder{color:#5a5a5a;letter-spacing:.02em;font-family:inherit;font-size:10.5px;text-transform:uppercase;}
button.admin-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8a8a8a;cursor:pointer;
  font-size:14px;padding:8px;line-height:1;}
button.admin-unlock{background:var(--lime);color:var(--ink);border:0;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 0 0 0 rgba(216,255,41,.5);
  transition:transform .1s;}
button.admin-unlock:active{transform:translateY(1px);}
.admin-pin-wrap.shake{animation:shakeAnim .4s;}
.admin-pin-err{width:100%;text-align:center;font-size:10.5px;color:#ff6b6b;margin-top:4px;}
.admin-pill{font-size:11px;background:var(--lime);color:var(--ink);padding:6px 12px;border-radius:20px;font-weight:800;letter-spacing:.03em;
  box-shadow:0 0 0 2px rgba(216,255,41,.25);}
button.admin-exit{background:transparent;border:1px solid #444;color:#eee;border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;}
main{max-width:980px;margin:0 auto;padding:22px 20px 40px;width:100%;flex:1 0 auto;}
.site-footer{flex-shrink:0;text-align:center;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);}
.site-footer a{color:var(--ink);font-weight:700;text-decoration:none;}
.banner{background:#fff7e0;border:1px solid #f0dca0;color:#6b5400;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:18px;}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;background:#fff;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;}

.form-row{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr auto;gap:10px;margin-bottom:12px;align-items:end;}

@media (max-width:640px){

/* ---- passcode gate (modern) ---- */
.g2-wrap{display:flex;justify-content:center;padding:clamp(8px,4vh,40px) 0 20px;}
.g2-card{position:relative;width:100%;max-width:400px;background:#fffefb;border:1.5px solid #e6e4d4;border-radius:28px;
  padding:38px 30px 30px;text-align:center;overflow:hidden;box-shadow:0 1px 0 #fff inset,0 24px 60px -28px rgba(10,10,10,.28);
  animation:g2In .7s cubic-bezier(.2,.8,.2,1) both;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;}
.g2-card::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:70%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(216,255,41,.38),rgba(216,255,41,0));animation:g2Glow 6s ease-in-out infinite alternate;}
.g2-card>*{position:relative;}
.g2-card>.g2-i{animation:g2Up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 150ms);}
.g2-icon{width:78px;height:78px;margin:0 auto 18px;border-radius:24px;background:var(--ink);display:grid;place-items:center;
  animation:g2Float 4s ease-in-out infinite;box-shadow:0 12px 28px -10px rgba(10,10,10,.5);}
.g2-icon::after{content:"";position:absolute;inset:0;border-radius:24px;border:2px solid var(--lime);opacity:0;animation:g2Ring 2.6s ease-out infinite;}
.g2-icon svg{width:36px;height:36px;overflow:visible;}
.g2-icon .shackle{transform-origin:16px 11px;transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
.g2-card h2{font-size:23px;letter-spacing:-.01em;margin:0 0 10px;}
.g2-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#55554e;background:#f2f0e4;border-radius:999px;padding:6px 12px;}
.g2-chip i{width:7px;height:7px;border-radius:50%;background:#f0553a;animation:g2Blink 1.6s ease-in-out infinite;}
.g2-sub{font-size:14px;color:var(--sub);margin:16px 0 18px;}
.g2-field{position:relative;}
.g2-field input{width:100%;height:56px;padding:0 50px 0 18px;border:2px solid transparent;border-radius:16px;background:#f3f1e6;color:var(--ink);
  font-family:inherit;font-size:18px;letter-spacing:.14em;text-align:center;
  transition:background .2s,border-color .2s,box-shadow .25s;}
.g2-field input::placeholder{letter-spacing:.02em;font-family:inherit;font-size:14px;color:#9a9a90;}
.g2-field input:hover{background:#eeebdd;}
.g2-field input:focus{outline:none;background:#fff;border-color:var(--ink);box-shadow:0 0 0 5px rgba(216,255,41,.55);}
.g2-field input.bad{border-color:#f0553a;background:#fff4f1;box-shadow:0 0 0 5px rgba(240,85,58,.14);}
.g2-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;border-radius:12px;cursor:pointer;color:#7a7a72;display:grid;place-items:center;transition:background .2s,color .2s;}
.g2-eye:hover{background:rgba(10,10,10,.06);color:var(--ink);}
.g2-eye svg{width:20px;height:20px;}
.g2-err{min-height:20px;margin:10px 0 0;font-size:13px;font-weight:600;color:#e2452a;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;}
.g2-err.show{opacity:1;transform:none;}
.g2-btn{position:relative;width:100%;height:54px;margin-top:6px;border:0;border-radius:16px;background:var(--ink);color:var(--lime);font-weight:800;font-size:15px;letter-spacing:.02em;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:transform .15s,box-shadow .25s,background .3s,color .3s;}
.g2-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(216,255,41,.28) 50%,transparent 70%);transform:translateX(-120%);}
.g2-btn:hover{box-shadow:0 12px 26px -12px rgba(10,10,10,.6);transform:translateY(-1px);}
.g2-btn:hover::before{transition:transform .8s;transform:translateX(120%);}
.g2-btn:active{transform:translateY(1px) scale(.99);}
.g2-btn svg{width:18px;height:18px;transition:transform .25s;}
.g2-btn:hover svg{transform:translateX(4px);}
.g2-card.shake{animation:g2Shake .45s;}
.g2-card.ok{transform:scale(.97) translateY(-6px);opacity:0;transition-delay:.35s;}
.g2-card.ok .shackle{transform:translateY(-4px) rotate(24deg);}
.g2-card.ok .g2-icon{background:var(--lime);animation:none;transform:scale(1.06);transition:background .3s,transform .4s cubic-bezier(.34,1.56,.64,1);}
.g2-card.ok .g2-icon svg *{stroke:var(--ink);}
.g2-card.ok .g2-btn{background:var(--lime);color:var(--ink);}
@keyframes g2In{from{opacity:0;transform:translateY(24px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes g2Up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes g2Float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes g2Ring{0%{opacity:.7;transform:scale(1);}100%{opacity:0;transform:scale(1.55);}}
@keyframes g2Glow{from{transform:translateX(-6%);}to{transform:translateX(8%) translateY(6%);}}
@keyframes g2Blink{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes g2Shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
@media (max-width:480px){.g2-card{padding:30px 20px 24px;border-radius:24px;}.g2-field input{font-size:16px;}}
@media (prefers-reduced-motion:reduce){.g2-card,.g2-card *,.g2-card::before{animation:none!important;transition:none!important;}}

.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.dash-tools{display:flex;align-items:center;gap:6px;}
.dash-tools button{height:34px;min-width:34px;padding:0 10px;border:1.5px solid #e6e4d4;background:#fffefb;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;transition:background .2s,transform .15s;}
.dash-tools button:hover:not(:disabled){background:#f3f1e6;} .dash-tools button:active:not(:disabled){transform:scale(.96);} .dash-tools button:disabled{opacity:.4;cursor:default;}
.dash-tools input[type=date]{height:34px;padding:0 8px;border:1.5px solid #e6e4d4;border-radius:10px;font-size:13px;background:#fffefb;font-family:inherit;}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:14px;}
.kpi{border:1.5px solid #e6e4d4;border-radius:14px;padding:10px 12px;background:#fffefb;animation:g2Up .5s both;animation-delay:calc(var(--i,0)*50ms);}
.kpi b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;}
.kpi span{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.kpi.hero{background:var(--ink);border-color:var(--ink);} .kpi.hero b{color:var(--lime);} .kpi.hero span{color:#aaa;}
.dash-sec{font-size:10.5px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px;}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;}
.plat{border:1.5px solid #e6e4d4;border-radius:12px;padding:9px 11px;background:#fffefb;}
.plat div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
.plat b{font-size:18px;font-variant-numeric:tabular-nums;} .plat small{font-size:10.5px;color:var(--sub);font-weight:600;}
.plat em{font-style:normal;font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.plat i{display:block;height:4px;border-radius:3px;background:#e9e6d9;margin-top:7px;overflow:hidden;} .plat i u{display:block;height:100%;background:#f0553a;border-radius:3px;transition:width .4s;}
.dtable{min-width:760px;}
.dtable td{vertical-align:middle;white-space:nowrap;}
.dtable .who{background:none;border:0;padding:0;font:inherit;font-weight:800;cursor:pointer;color:var(--ink);text-align:left;}
.dtable .who:hover{text-decoration:underline;}
.dtable .role{display:block;font-size:10.5px;color:var(--sub);font-weight:600;}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c9c9c0;margin-right:7px;}
.sdot.on{background:#2fbf5b;box-shadow:0 0 0 3px rgba(47,191,91,.2);} .sdot.done{background:#0a0a0a;} .sdot.warn{background:#f0a23a;}
.flag{font-size:10px;font-weight:800;color:#f0553a;text-transform:uppercase;margin-left:6px;}
.edt{color:#f0553a;font-size:11px;cursor:help;}
button.ed{background:#fffefb;border:1.5px solid #e6e4d4;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer;} button.ed:hover{background:var(--lime);border-color:var(--lime);}

/* ---- v5: single command panel + admin remake ---- */
.adm-btn{border-radius:999px;padding:7px 14px 7px 10px;background:#161616;border:1.5px solid #2c2c2c;}
.adm-btn .adm-ic{width:22px;height:22px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;color:var(--lime);transition:background .2s,color .2s;}
.adm-btn .adm-ic svg{width:12px;height:12px;}
.adm-btn:hover .adm-ic{background:var(--lime);color:var(--ink);}
.adm-on{border-radius:999px;padding:4px 4px 4px 12px;box-shadow:0 0 0 4px rgba(216,255,41,.18);}
.adm-on button{border-radius:999px;width:auto;padding:0 10px;height:24px;font-size:11px;font-weight:800;}
.adm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;margin-top:14px;}
.adm-bar b{color:var(--lime);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
.adm-bar span{font-size:12px;color:#aaa;flex:1;min-width:140px;}
.adm-bar .btn{padding:7px 12px;}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
.alert{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 12px;border-radius:10px;background:#fff4f1;border:1px solid #f6cfc6;color:#8a2a16;}
.alert.info{background:#f4f8de;border-color:#e2eba8;color:#4d5a10;}
.alert button{margin-left:auto;}
.trend{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px;}
.tcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--sub);cursor:pointer;}
.tcol i{display:block;width:100%;max-width:34px;background:#e4e1d4;border-radius:5px 5px 2px 2px;min-height:3px;transition:height .4s;}
.tcol.sel i{background:var(--ink);} .tcol:hover i{background:var(--lime);}
.tcol.sel{color:var(--ink);font-weight:800;}
.tcol em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11.5px;background:#f3f1e6;border-radius:999px;padding:5px 10px;color:#55554e;} .chip b{color:var(--ink);}
.dtable tr.sub td{background:#faf9f1;white-space:normal;font-size:12px;color:#55554e;padding:10px 12px;}
button.xp{background:none;border:0;cursor:pointer;font-size:12px;color:var(--sub);padding:4px 6px;transition:transform .2s;} button.xp.open{transform:rotate(90deg);}
.shiftbar{height:5px;border-radius:3px;background:#e9e6d9;margin-top:5px;overflow:hidden;min-width:70px;} .shiftbar u{display:block;height:100%;background:#2fbf5b;}
.te select{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;padding:0 8px;background:#fff;}
.te-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.te-quick{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 8px;} .te-quick .te-mini{height:30px;font-size:11px;}
.mdl.wide{max-width:400px;}
.kpi small{display:block;font-size:10px;color:#8a8a80;margin-top:2px;} .kpi.hero small{color:#888;}

/* ---- v6: minimal dashboard ---- */
.dboard .vc-grid{margin-bottom:14px;}
.dboard .vcard.compact{border-width:1px;}
.mn{border:1px solid #e6e4d4;border-radius:20px;background:#fffefb;padding:18px 20px 14px;}
.mn-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.mn-head h2{margin:0;font-size:15px;} .mn-head .muted{font-size:11.5px;}
.mn-nums{display:flex;flex-wrap:wrap;margin:16px 0 4px;}
.mn-nums div{flex:1 1 90px;padding:2px 14px;border-left:1px solid #e6e4d4;}
.mn-nums div:first-child{border-left:0;padding-left:0;}
.mn-nums b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;}
.mn-nums span{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.mn-plat{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 2px;font-size:12.5px;color:var(--sub);}
.mn-plat b{color:var(--ink);font-variant-numeric:tabular-nums;} .mn-plat small{color:#9a9a90;}
.mn-acct{font-size:11.5px;color:#9a9a90;margin:2px 0 0;}
.mn-sep{height:1px;background:#eeecdf;margin:14px 0 4px;}
.mn .dtable th{border-bottom:1px solid #eeecdf;} .mn .dtable td{border-bottom:1px solid #f4f2e8;}
.adm-line{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-top:12px;}
.adm-line b{color:var(--ink);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--lime);padding:3px 8px;border-radius:999px;}
.adm-line .ed{margin-left:auto;}

/* ---- v7: decluttered ---- */
.mn-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.mn-bar h2{margin:0;font-size:18px;} .mn-bar .muted{font-size:11.5px;}
.dash-tools .adm-go{background:var(--lime);border-color:var(--lime);}
.dwrap{display:contents;} .dlabel{display:none;}
.mn{margin-top:14px;}
.mn-nums{margin-top:0;}
.vc-x{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
.vc-x .chip{font-size:11px;}
.xp-link{margin-left:auto;background:none;border:0;font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;padding:4px 0;} .xp-link:hover{color:var(--ink);}
.vc-detail{flex-basis:100%;font-size:12px;color:#55554e;padding-top:8px;border-top:1px dashed #e6e4d4;margin-top:4px;}
.vc-detail .chips{flex-direction:column;align-items:flex-start;gap:4px;} .vc-detail .chip{background:none;padding:0;font-size:12px;}
.alert{padding:7px 12px;}

/* ---- v8: mobile pass + dashboard card footer + unsubmit ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
button,select,input,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.vc-x .tag{margin:0;font-size:11.5px;padding:5px 12px;}
button.ed.danger{color:#b3261e;}
button.ed.danger:hover{background:#fde8e6;border-color:#f3b8b2;color:#8a1a13;}
button.btn.danger{background:#e2452a;color:#fff;}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.acts .btn{width:auto;}
@media (max-width:640px){
  /* header: brand + admin on one row, tabs on a second row */
  header{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));}
  .brand{justify-content:flex-start;}
  #adminBox{grid-column:2;grid-row:1;justify-content:flex-end;}
  nav{grid-column:1/-1;grid-row:2;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);gap:3px;overflow-x:auto;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{padding:9px 10px;min-height:38px;font-size:12.5px;text-align:center;white-space:nowrap;}
  main{padding:10px 12px 24px;}

  /* dashboard toolbar */
  .mn-bar > div:first-child{width:100%;}
  .mn-bar{gap:6px;margin-bottom:8px;}
  .mn-bar h2{font-size:15px;line-height:1.2;}
  .mn-bar .muted{font-size:10.5px;line-height:1.3;display:block;}
  .dash-tools{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 30px auto;gap:4px;align-items:center;}
  .dash-tools button{height:30px;min-width:0;padding:0 9px;font-size:11.5px;border-radius:8px;border-width:1px;touch-action:manipulation;}
  .dwrap{display:flex;position:relative;align-items:center;justify-content:center;height:30px;min-width:0;border:1px solid #e6e4d4;border-radius:8px;background:#fffefb;}
  .dlabel{display:block;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;}
  /* real date input stays on top, invisible, so tapping opens the native picker (16px avoids iOS zoom) */
  .dash-tools .dwrap input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;font-size:16px;cursor:pointer;}
  .dash-tools .adm-go{grid-column:1/-1;height:30px;}

  /* dashboard cards */
  .vc-grid{grid-template-columns:1fr;gap:10px;}
  .compact .vc-meta{font-size:13px;gap:4px 12px;}
  .compact .vc-foot{font-size:12.5px;}
  .vc-x{gap:8px;margin-top:12px;}
  .vc-x .tag{font-size:12px;padding:6px 13px;}
  button.ed{min-height:36px;padding:6px 12px;font-size:12.5px;}
  .xp-link{min-height:36px;padding:6px 0 6px 10px;font-size:12.5px;}
  .vc-detail{font-size:12.5px;}

  /* summary panel */
  .mn{padding:14px 14px 10px;border-radius:18px;}
  .mn-nums{display:grid;grid-template-columns:1fr 1fr;gap:14px 0;}
  .mn-nums div{padding:0 12px;border-left:0;}
  .mn-nums div:nth-child(odd){padding-left:0;}
  .mn-nums div:nth-child(even){border-left:1px solid #e6e4d4;}
  .mn-nums b{font-size:24px;}
  .mn-plat{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
  .alert{flex-wrap:wrap;}

  /* forms */
  select,input[type=number],input[type=text]{min-height:44px;}
  .form-row{grid-template-columns:1fr 1fr;}
  .form-row > div:nth-child(1),.form-row > div:nth-child(2),.form-row > div:nth-child(5){grid-column:1/-1;}
  button.btn{min-height:44px;}
  .grid3 .stat:last-child:nth-child(odd){grid-column:1/-1;}

  /* tables become stacked rows */
  .card.overflow{overflow:visible;}
  .rtable,.rtable tbody{display:block;}
  .rtable thead{display:none;}
  .rtable tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px 2px;border-bottom:1px solid var(--line);}
  .rtable.c3 tr{grid-template-columns:repeat(3,minmax(0,1fr));}
  .rtable tr:last-child{border-bottom:0;}
  .rtable td{display:block;border:0;padding:0;text-align:left;min-width:0;font-size:13.5px;}
  .rtable td[data-label]::before{content:attr(data-label);display:block;font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
  .rtable td:not([data-label]),.rtable td.full{grid-column:1/-1;}
  .rtable td:empty{display:none;}
  .rtable .tag{margin-left:0;}
  .rtable .rm{padding:8px 0;font-size:13px;}

  /* modals: sit near the top so the keyboard never covers them */
  .ov{place-items:start center;padding:max(16px,7dvh) 12px 12px;overflow-y:auto;}
  .mdl{max-height:calc(100dvh - 24px);overflow-y:auto;}
}
@media (max-width:380px){
  .dash-tools{grid-template-columns:28px minmax(0,1fr) 28px auto;gap:3px;}
  .dash-tools button{padding:0 7px;}
  .dlabel{font-size:11.5px;}
  .vcard.compact{padding:12px 12px 10px;}
  .pin-box{width:46px;height:54px;}
}
.brand{cursor:pointer;-webkit-user-select:none;user-select:none;padding:4px 0;}

/* ---- v9: reply check-ins ---- */
.ck-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.ck-head h2{margin:0;}
.ck-btns{display:flex;gap:6px;}
button.ed.on{background:var(--lime);border-color:var(--lime);}
.ck-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;}
.ck-slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;text-align:left;border:1.5px solid #e6e4d4;background:#fffefb;border-radius:14px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,transform .15s;}
.ck-slot:disabled{cursor:default;}
.ck-slot:not(:disabled):active{transform:scale(.98);}
.ck-slot b{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);}
.ck-slot span{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
.ck-slot em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--sub);}
.ck-slot.s-upcoming{opacity:.6;}
.ck-slot.s-open{background:var(--lime);border-color:var(--lime);} .ck-slot.s-open b,.ck-slot.s-open em{color:var(--ink);}
.ck-slot.s-overdue,.ck-slot.s-missed{background:#fff4f1;border-color:#f6cfc6;} .ck-slot.s-overdue em,.ck-slot.s-missed em{color:#b3261e;}
.ck-slot.s-done{background:var(--ink);border-color:var(--ink);color:#fff;} .ck-slot.s-done b{color:#aaa;} .ck-slot.s-done em{color:var(--lime);}
.ck-slot.s-late,.ck-slot.s-partial{background:#fff7e0;border-color:#f0dca0;} .ck-slot.s-late em,.ck-slot.s-partial em{color:#6b5400;}
.ck-slots.mini{gap:6px;margin-top:0;} .ck-slots.mini .ck-slot{padding:7px 9px;border-radius:11px;} .ck-slots.mini .ck-slot span{font-size:13px;} .ck-slots.mini .ck-slot em{font-size:10.5px;}
.ck-x{font-size:11px;color:#b3261e;font-weight:600;}
.ck-bad{color:#b3261e!important;}
.mdl.ck-mdl{max-width:460px;text-align:left;}
.ck-mdl h2{margin-top:0;} .ck-mdl h2 .muted{font-size:14px;font-weight:600;}
.ck-list{margin:12px 0;border:1px solid #e6e4d4;border-radius:14px;overflow:hidden;}
.ck-plat{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);background:#f3f1e6;padding:6px 12px;}
.ck-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 8px 6px 12px;border-top:1px solid #f0eee3;font-size:13px;font-weight:700;}
.ck-plat + .ck-row{border-top:0;}
.ck-row > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
label.ck-box{display:inline-flex;align-items:center;gap:6px;margin:0;min-height:34px;padding:5px 10px;border:1.5px solid #e6e4d4;border-radius:999px;background:#fff;color:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:0;text-transform:none;cursor:pointer;-webkit-user-select:none;user-select:none;}
label.ck-box input{width:16px;height:16px;margin:0;accent-color:var(--ink);}
label.ck-box:has(input:checked){background:var(--lime);border-color:var(--lime);}
label.ck-box:has(input:disabled){cursor:default;}
.ck-hint{font-size:12px;color:var(--sub);min-height:16px;margin:8px 0 0;}
.ck-noteview{font-size:12.5px;background:#f3f1e6;border-radius:10px;padding:8px 10px;margin:0;}
/* ---- v10: 👑 Supreme Leader ---- */

.sl-nav{display:flex;gap:4px;} .sl-nav .te-mini{min-width:42px;}

  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; }
  if(db){
    dbAvailable = true;
    db.collection('entries').orderBy('date','desc').limit(200).onSnapshot(
      snap => { entries = {}; snap.docs.forEach(d => entries[d.id] = d.data()); render(); },
      err => { dbAvailable = false; entries = localLoad(); render(); }
    );
    // Supreme Leader settings (shifts, check-in times, accounts, passcodes, PIN); missing/unreadable → the defaults in this file
    db.collection('vibe_settings').doc('main').onSnapshot(
      snap => { applySettings(snap.exists ? snap.data() : null); render(); },
      err => {}
    );
    try{
      auth = firebase.auth();
      auth.onAuthStateChanged(u => {
        leaderUser = u;
        if(u){ adminMode = true; try{ sessionStorage.setItem('kpi_admin','1'); }catch(e){} }
        render();
      });

  } else {
    entries = localLoad();
    render();
  }
  try{ adminMode = sessionStorage.getItem('kpi_admin') === '1'; }catch(e){}
  // opened from a notification: vibe.html?tab=rimsha
  const tab = new URLSearchParams(location.search).get('tab');
  if(tab && VAS.some(v=>v.id===tab)) activeTab = tab;
  render();

  setInterval(tickLiveElements, 1000);
  pushReady().then(pushRefresh);
}


// ---------- status card (Zahra-style) ----------
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const viewDates={};
const getViewDate=id=>viewDates[id]||todayKey();
const pad2=n=>String(n).padStart(2,'0');
const fmtHMS=ms=>{const s=Math.floor(ms/1000);return `${pad2(Math.floor(s/3600))}:${pad2(Math.floor(s%3600/60))}:${pad2(s%60)}`;};
const fmt24=iso=>{ if(!iso) return '—'; const d=new Date(iso); const h=d.getHours(); return (h%12||12)+':'+pad2(d.getMinutes())+' '+(h<12?'AM':'PM'); };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- reply check-ins ----------
const minOf=d=>d.getHours()*60+d.getMinutes();
const hmMin=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmtMin=m=>{ const h=Math.floor(m/60)%24; return (h%12||12)+':'+pad2(m%60)+' '+(h<12?'AM':'PM'); };
// state per check-in: done | late | partial (submitted) · open | overdue | upcoming | missed (not submitted)
function checkinSlots(va, dk, e=getEntry(va.id,dk)){
  const today=todayKey(), nowMin=minOf(new Date());
  return (va.checkins||[]).map((t,i)=>{
    const n=i+1, rec=(e.checkins||{})[n]||null, due=hmMin(t), opens=due-CHECKIN_EARLY;
    let state;
    if(rec) state=rec.done.length<(rec.total||CHECK_TOTAL)?'partial':(minOf(new Date(rec.at))>due+CHECKIN_GRACE?'late':'done');
    else if(dk<today) state='missed';
    else if(dk>today||nowMin<opens) state='upcoming';
    else state=nowMin<=due+CHECKIN_GRACE?'open':'overdue';
    return {n,t,due,opens,rec,state};
  });
}
function slotTiles(va, dk, actionable){
  const today=todayKey();
  return checkinSlots(va,dk).map(s=>{
    const canDo=actionable&&dk===today&&(s.state==='open'||s.state==='overdue');
    const em={
      done:`✓ ${fmt24(s.rec&&s.rec.at)}`, late:`Late · ${fmt24(s.rec&&s.rec.at)}`,
      partial:`${s.rec?s.rec.done.length:0}/${s.rec&&s.rec.total||CHECK_TOTAL} · ${fmt24(s.rec&&s.rec.at)}`,
      open:canDo?'Due now — tap to check in':'Due now', overdue:canDo?'Overdue — tap to check in':'Overdue',
      upcoming:`Opens ${fmtMin(s.opens)}`, missed:'Missed'
    }[s.state];
    return `<button class="ck-slot s-${s.state}" data-ck-open="${va.id}|${dk}|${s.n}" ${s.rec||canDo?'':'disabled'}><b>Check-in ${s.n}</b><span>${fmtMin(s.due)}</span><em>${em}</em></button>`;
  }).join('');
}
// summary for a day: {got,total,extra:['1 late',…]}, or null for a day with no sign-in and no check-ins
function checkinSummary(va, dk){
  const s=checkinSlots(va,dk), got=s.filter(x=>x.rec).length;
  if(!s.length||(!got&&!getEntry(va.id,dk).signIn)) return null;
  const n=st=>s.filter(x=>x.state===st).length, extra=[];
  if(n('late')) extra.push(n('late')+' late'); if(n('partial')) extra.push(n('partial')+' partial');
  if(n('overdue')) extra.push(n('overdue')+' overdue'); if(n('missed')) extra.push(n('missed')+' missed');
  return {got,total:s.length,extra};
}
function checkinCell(va, dk){
  const c=checkinSummary(va,dk); if(!c) return '—';
  return `<span class="tag ${c.got===c.total&&!c.extra.length?'ok':'off'}">${c.got}/${c.total}</span>${c.extra.length?` <small class="ck-x">${c.extra.join(' · ')}</small>`:''}`;
}
function checkinChip(va, dk){
  const c=checkinSummary(va,dk); if(!c) return '';
  return `<span class="chip">Check-ins <b>${c.got}/${c.total}</b>${c.extra.length?` · <b class="ck-bad">${c.extra.join(' · ')}</b>`:''}</span>`;
}
function openCheckin(vaId, dk, n){
  const va=VAS.find(v=>v.id===vaId); if(!va) return;
  const slot=checkinSlots(va,dk)[n-1]; if(!slot) return;
  const rec=slot.rec, ro=!!rec;
  if(!ro && (dk!==todayKey() || !(slot.state==='open'||slot.state==='overdue') || !isUnlocked(vaId))) return;
  const done=new Set(rec?rec.done:[]);
  const list=PLATFORMS.map(p=>`<div class="ck-plat">${p}</div>${accountsFor(p).map(a=>`<div class="ck-row"><span title="${esc(a)}">${esc(a)}</span>${CHECK_TASKS.map(t=>{
    const k=[p,a,t.id].join('|');
    return `<label class="ck-box"><input type="checkbox" data-k="${esc(k)}" ${done.has(k)?'checked':''} ${ro?'disabled':''}>${t.label}</label>`;
  }).join('')}</div>`).join('')}`).join('');
  const {close,box}=openOverlay(`
    <h2>${esc(va.name)} · Check-in ${n} <span class="muted">· ${fmtMin(slot.due)}</span></h2>
    <p class="muted">${ro
      ? `Submitted ${fmt24(rec.at)}${slot.state==='late'?' (late)':''} · ${rec.done.length} of ${rec.total||CHECK_TOTAL} ticked.`
      : 'Go through every account: reply to all DMs and to the comments on the latest post, then tick each one off.'}</p>
    <div class="ck-list">${list}</div>
    ${ro ? (rec.note?`<p class="ck-noteview"><b>Note:</b> ${esc(rec.note)}</p>`:'')
         : `<label for="ckNote">Note</label><input type="text" id="ckNote" maxlength="200" placeholder="Required if anything is left unticked">`}
    <p class="ck-hint" id="ckHint"></p>
    <div class="mdl-actions">${ro
      ? `${adminMode?'<button class="btn danger" id="ckClear">Clear check-in</button>':''}<button class="btn ghost" id="ckClose">Close</button>`
      : '<button class="btn ghost" id="ckClose">Cancel</button><button class="btn lime" id="ckSave">Submit check-in</button>'}</div>`);
  box.classList.add('ck-mdl');
  box.querySelector('#ckClose').onclick=close;
  const clr=box.querySelector('#ckClear');
  if(clr) clr.onclick=()=>{ const c={...(getEntry(vaId,dk).checkins||{})}; delete c[n]; writeEntry(vaId,dk,{checkins:c}); close(); };
  if(ro) return;
  const boxes=[...box.querySelectorAll('input[data-k]')], note=box.querySelector('#ckNote'), save=box.querySelector('#ckSave'), hint=box.querySelector('#ckHint');
  const upd=()=>{
    const c=boxes.filter(b=>b.checked).length, all=c===boxes.length, hasNote=!!note.value.trim();
    save.disabled=!all&&!hasNote;
    save.textContent=all?'Submit check-in':`Submit partial (${c}/${boxes.length})`;
    hint.textContent=all?'Everything ticked.':`${boxes.length-c} left${hasNote?'':' — tick them, or add a note saying why'}.`;
  };
  boxes.forEach(b=>b.addEventListener('change',upd)); note.addEventListener('input',upd);
  save.onclick=()=>{
    const rec={at:new Date().toISOString(), done:boxes.filter(b=>b.checked).map(b=>b.dataset.k), total:boxes.length, note:note.value.trim()};
    writeEntry(vaId,dk,{checkins:{...(getEntry(vaId,dk).checkins||{}),[n]:rec}});
    close();
  };
  upd();
}

// ---------- push to the phone/computer even when vibe is closed (sent by scripts/vibe-push.mjs) ----------
let swReg=null, messaging=null;
const pushState={};   // vaId -> 'on' | 'error' | 'unsupported'
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function pushReady(){
  if(messaging) return messaging;
  if(!('serviceWorker' in navigator) || !window.isSecureContext || location.protocol==='file:') return null;
  try{
    swReg=swReg||await navigator.serviceWorker.register('/firebase-messaging-sw.js',{scope:'/firebase-cloud-messaging-push-scope'});
    if(!VAPID_KEY || !db || typeof firebase==='undefined' || !firebase.messaging || !(await firebase.messaging.isSupported())) return null;
    messaging=firebase.messaging();
    // vibe is open in front: FCM doesn't show the push itself, so show it here
    messaging.onMessage(p=>{ const n=p.notification||{}, d=p.data||{}; showNote(n.title||'vibe.',{body:n.body,tag:d.tag,renotify:true},d.vaId,d.n); });
    return messaging;
  }catch(e){ return null; }
}
const tokenDoc=(vaId,token)=>db.collection('pushTokens').doc(vaId+'__'+token);
async function pushEnable(vaId){
  const m=await pushReady();
  if(!m || Notification.permission!=='granted'){ pushState[vaId]='unsupported'; return; }
  try{
    const token=await m.getToken({vapidKey:VAPID_KEY, serviceWorkerRegistration:swReg});
    await tokenDoc(vaId,token).set({vaId, token, ua:navigator.userAgent.slice(0,200), updatedAt:new Date().toISOString()});
    try{ localStorage.setItem('vibe_push_'+vaId, token); }catch(e){}
    pushState[vaId]='on';
  }catch(e){ pushState[vaId]='error'; }
}
async function pushDisable(vaId){
  delete pushState[vaId];
  let token=null; try{ token=localStorage.getItem('vibe_push_'+vaId); localStorage.removeItem('vibe_push_'+vaId); }catch(e){}
  if(token && db){ try{ await tokenDoc(vaId,token).delete(); }catch(e){} }
}
// tokens can rotate: re-save them for everyone who has reminders on on this device
async function pushRefresh(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const ids=VAS.filter(v=>v.checkins&&remindOn(v.id)).map(v=>v.id);
  for(const id of ids) await pushEnable(id);
  if(ids.length) render();
}
function pushNote(vaId){
  if(!remindOn(vaId)) return '';
  if('Notification' in window && Notification.permission==='denied') return 'Notifications are blocked in this browser\'s settings, so reminders only show in the tab title and on this page.';
  if(isIOS && !isStandalone()) return 'On iPhone: tap Share → Add to Home Screen, open vibe from that icon, and turn reminders on there to get notifications.';
  if(pushState[vaId]==='on') return 'This device gets notifications even when vibe is closed.';
  if(pushState[vaId]==='error') return 'Couldn\'t register this device for notifications — reminders only appear while vibe is open. Try turning reminders off and on again.';
  return 'Notifications only appear while vibe is open on this device.';
}
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',ev=>{
  if(ev.data && ev.data.type==='vibe-open-checkin') openFromNotification(ev.data.vaId, ev.data.n);
});
const ckNotified=new Set();
let ckSig='';
function checkinReminders(){
  const dk=todayKey(); let due=0, sig='';
  VAS.forEach(va=>{
    const slots=checkinSlots(va,dk); sig+=slots.map(s=>s.state).join(',')+';';
    if(!remindOn(va.id)) return;
    const e=getEntry(va.id,dk);
    slots.forEach(s=>{
      if(s.state!=='open'&&s.state!=='overdue') return;
      due++;
      if(!e.signIn||e.signOut) return;   // only ping while on shift
      const k=`vibe_nt_${va.id}_${dk}_${s.n}_${s.state}`;
      let seen=ckNotified.has(k); try{ seen=seen||localStorage.getItem(k)==='1'; localStorage.setItem(k,'1'); }catch(err){}
      ckNotified.add(k);
      if(!seen) notifyCheckin(va,s);
    });
  });
  document.title=due?`(${due}) Check-in due · vibe.`:'vibe.';
  // a check-in just opened or went overdue: refresh the view, unless someone is typing in it
  if(ckSig && sig!==ckSig){
    const a=document.activeElement;
    if(a && a.closest && a.closest('#app') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
    render();
  }
  ckSig=sig;
}

function monthStats(va, dk){
  const [y,m]=dk.split('-').map(Number);
  const last=new Date(y,m,0).getDate(), today=todayKey();
  let booked=0, verified=0, missed=0;
  for(let day=1; day<=last; day++){
    const k=`${y}-${pad2(m)}-${pad2(day)}`;
    const e=getEntry(va.id,k);
    if(va.role==='va') booked+=totals(e).appts;
    else VAS.filter(v=>v.role==='va').forEach(v=>{ if(getEntry(v.id,k).verifiedByNoor) verified++; });
    if(k<today && !e.signIn) missed++;   // past day with no sign-in
  }
  return {booked, verified, missed, month:MONTH_NAMES[m-1]};
}

  } else { const t=totals(e); big=t.appts; small=t.dms; label='Appointments booked'; }

  const working=isToday && e.signIn && !e.signOut;
  const statusTxt=working?'Working':(e.signIn&&e.signOut?'Signed out':(e.signIn?'No sign-out':'Offline'));

    </div>

// ---------- overlay / modals ----------
function openOverlay(inner){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="mdl" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('in'));
  const onKey=e=>{ if(e.key==='Escape') close(); };
  const close=()=>{ ov.classList.remove('in'); setTimeout(()=>ov.remove(),220); document.removeEventListener('keydown',onKey); };
  document.addEventListener('keydown',onKey);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  return {ov, close, box:ov.firstElementChild};
}
const SHIELD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>';

function openPinModal(){
  const n=ADMIN_PIN.length;
  const {ov,close,box}=openOverlay(`
    <div class="mdl-ico">${SHIELD}</div>
    <h2>Supreme Leader access</h2><p class="muted">Enter your ${n}-digit PIN</p>
    <div class="pin-row" id="pinRow">${Array.from({length:n},()=>'<input class="pin-box" type="password" inputmode="numeric" autocomplete="off" maxlength="1">').join('')}</div>
    <p class="pin-err" id="pinErr"></p>`);
  const row=box.querySelector('#pinRow'), err=box.querySelector('#pinErr');
  const boxes=[...row.querySelectorAll('input')];
  const check=()=>{
    const v=boxes.map(b=>b.value).join('');
    if(v.length<n) return;
    if(v===ADMIN_PIN){
      row.classList.add('ok'); boxes.forEach(b=>b.disabled=true);
      setTimeout(()=>{ adminMode=true; try{sessionStorage.setItem('kpi_admin','1')}catch(e){} close(); render(); },450);
    } else {
      err.textContent='Wrong PIN — try again.'; row.classList.add('bad');
      row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
      setTimeout(()=>{ boxes.forEach(b=>{b.value='';b.classList.remove('filled');}); row.classList.remove('bad'); boxes[0].focus(); },420);
    }
  };
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{
      b.value=b.value.replace(/\D/g,'').slice(-1);
      b.classList.toggle('filled',!!b.value); err.textContent='';
      if(b.value && boxes[i+1]) boxes[i+1].focus();
      check();
    });
    b.addEventListener('keydown',ev=>{
      if(ev.key==='Backspace' && !b.value && boxes[i-1]){ boxes[i-1].value=''; boxes[i-1].classList.remove('filled'); boxes[i-1].focus(); }
      if(ev.key==='ArrowLeft' && boxes[i-1]) boxes[i-1].focus();
      if(ev.key==='ArrowRight' && boxes[i+1]) boxes[i+1].focus();
    });
    b.addEventListener('paste',ev=>{
      const d=(ev.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,n);
      if(!d) return; ev.preventDefault();
      d.split('').forEach((c,k)=>{ boxes[k].value=c; boxes[k].classList.add('filled'); });
      boxes[Math.min(d.length,n-1)].focus(); check();
    });
  });
  setTimeout(()=>boxes[0].focus(),120);
}

      </div>

      <div class="te-row"><div><label>Sign in</label><input type="time" id="teIn"></div><button class="te-mini" data-now="teIn">Now</button><button class="te-mini" data-clr="teIn">Clear</button></div>
      <div class="te-row"><div><label>Sign out</label><input type="time" id="teOut"></div><button class="te-mini" data-now="teOut">Now</button><button class="te-mini" data-clr="teOut">Clear</button></div>
      <p class="te-sum" id="teSum"></p>
    </div>
    <div class="mdl-actions"><button class="btn ghost" id="teCancel">Cancel</button><button class="btn lime" id="teSave">Save</button></div>`);
  box.classList.add('wide');

  const who=$('teWho'), day=$('teDay'), inI=$('teIn'), outI=$('teOut'), sum=$('teSum'), save=$('teSave');

    const e=getEntry(who.value,day.value||todayKey());
    inI.value=toT(e.signIn); outI.value=toT(e.signOut);
    const v=cur(); $('teShift').textContent=v.shiftStart!=null?'Shift '+v.shiftLabel:v.shiftLabel;
    $('teShiftFill').style.display=v.shiftStart!=null?'':'none'; upd();
  };
  const at=t=>new Date(`${day.value}T${t}:00`);
  const upd=()=>{
    sum.classList.remove('bad'); save.disabled=!day.value;
    if(inI.value&&outI.value){
      const m=Math.round((at(outI.value)-at(inI.value))/60000);
      if(m<=0){ sum.textContent='Sign-out must be after sign-in.'; sum.classList.add('bad'); save.disabled=true; }
      else sum.textContent=`Total ${Math.floor(m/60)}h ${pad2(m%60)}m`;
    } else if(outI.value&&!inI.value){ sum.textContent='Add a sign-in time too.'; sum.classList.add('bad'); save.disabled=true; }
    else sum.textContent=inI.value?'Still on shift (no sign-out).':'No times recorded.';
  };
  [who,day].forEach(x=>x.addEventListener('change',load));
  [inI,outI].forEach(x=>x.addEventListener('input',upd));
  box.querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>{ const d=new Date(); $(b.dataset.now).value=pad2(d.getHours())+':'+pad2(d.getMinutes()); upd(); });
  box.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{ $(b.dataset.clr).value=''; upd(); });
  $('teClrAll').onclick=()=>{ inI.value=''; outI.value=''; upd(); };
  $('teShiftFill').onclick=()=>{ const v=cur(); inI.value=pad2(v.shiftStart)+':00'; outI.value=pad2(v.shiftEnd)+':00'; upd(); };
  $('teCancel').onclick=close;
  save.onclick=()=>{
    const iso=t=>t?at(t).toISOString():null;
    writeEntry(who.value,day.value,{signIn:iso(inI.value),signOut:iso(outI.value),editedByAdmin:true,editedAt:new Date().toISOString()});
    dashDate=day.value>=todayKey()?null:day.value;
    close();
  };
  load();
}

const fmtNow = d => d.toLocaleString([], {weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true});

// ---------- live (real-time) date/time/hours ticking ----------
function tickLiveElements(){
  const now = new Date();
  document.querySelectorAll('.live-clock-time').forEach(el=>{
    el.textContent = fmtNow(now);
  });
  document.querySelectorAll('.live-hours').forEach(el=>{
    const signIn = el.dataset.signin || null;
    const signOut = el.dataset.signout || null;
    if(!signIn) return;
    const hrs = hoursBetween(signIn, signOut || now.toISOString());
    el.textContent = hrs.toFixed(2);
  });
  document.querySelectorAll('.live-total').forEach(el=>{
    const day=el.dataset.day, isT=day===todayKey(); let h=0;
    VAS.forEach(v=>{ const e=getEntry(v.id,day); if(e.signIn) h+=hoursBetween(e.signIn, e.signOut||(isT?now.toISOString():e.signIn)); });
    el.textContent=h.toFixed(2);
  });
  document.querySelectorAll('.live-hm').forEach(el=>{
    if(el.dataset.signin) el.textContent = fmtHM(now - new Date(el.dataset.signin))+' h';
  });
  document.querySelectorAll('.live-clock-hm').forEach(el=>{ el.textContent = fmt24(now.toISOString()); });
  document.querySelectorAll('.live-hms[data-live="1"]').forEach(el=>{
    if(el.dataset.signin) el.textContent = fmtHMS(now - new Date(el.dataset.signin));
  });
  // if the day has rolled over past midnight while the page stayed open, refresh the whole view
  const k = todayKey();
  if(k !== tickLiveElements._lastDay){
    if(tickLiveElements._lastDay !== undefined){ dashDate=null; Object.keys(viewDates).forEach(k=>delete viewDates[k]); render(); }
    tickLiveElements._lastDay = k;
  }
  checkinReminders();
}

  wrap.querySelector('#gateBtn').onclick = tryUnlock;

  const tog = wrap.querySelector('#gateToggle');
  tog.onclick = ()=>{ const show = input.type==='password'; input.type = show?'text':'password'; tog.innerHTML = show?EYEOFF:EYE; input.focus(); };
  input.focus({preventScroll:true});
}

// ---------- VA page ("My shift") ----------
const histOpen={};
const SVG_CHEV_L='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>', SVG_CHEV_R='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
function renderVaPage(app, vaId){

  if(va.role === 'supervisor'){ app.appendChild(clockBar()); renderSupervisionPage(app, va); return; }

  // the page follows the picked day, so a missed day (e.g. after midnight) can still be finished
  const today = todayKey(), back = new Date(); back.setDate(back.getDate()-LOG_BACK_DAYS);
  const d = getViewDate(vaId), isToday = d === today, now = new Date(), nowMin = minOf(now);
  const tooOld = !adminMode && d < localKey(back);
  const e = getEntry(vaId, d), t = totals(e);
  const locked = (e.submitted && !adminMode) || tooOld;
  const live = isToday && !!e.signIn && !e.signOut;
  const ms = e.signIn ? ((e.signOut?new Date(e.signOut):(live?now:new Date(e.signIn))) - new Date(e.signIn)) : 0;
  const [yy,mm,dd] = d.split('-').map(Number);

    <div class="va-sh-top"><span><i class="db-dot ${dot}"></i>${statusText}</span><span>${e.signIn?`${fmt24(e.signIn)} → ${e.signOut?fmt24(e.signOut):'now'}`:''}</span></div>
    <span class="va-clock live-hms" data-live="${live?1:0}" data-signin="${e.signIn||''}">${fmtHMS(ms)}</span>
    <div>
      <div class="va-track"><span class="va-fill" style="width:${e.signIn?pos(cur):0}%"></span>${slots.map(s=>`<i class="s-${st(s)}" style="left:${pos(s.due)}%" title="Check-in ${s.n} · ${fmtMin(s.due)}"></i>`).join('')}</div>

      ${live?'<button class="va-btn out" data-a="out">Sign out</button>':''}

  const bIn = shift.querySelector('[data-a=in]'); if(bIn) bIn.onclick = ()=>writeEntry(vaId, today, {signIn:new Date().toISOString()});
  const bOut = shift.querySelector('[data-a=out]'); if(bOut) bOut.onclick = ()=>writeEntry(vaId, today, {signOut:new Date().toISOString()});

  // check-ins that need doing now

    <div class="ck-slots mini">${slotTiles(va,d,true)}</div>

    if(r){ r.appts+=Number(l.appts||0); r.dms+=Number(l.dms||0); } else rows.push({platform:l.platform, account:l.account, appts:Number(l.appts||0), dms:Number(l.dms||0)}); });
  const save = ()=>writeEntry(vaId, d, {logs: rows.map(r=>({...r}))});
  const ctr = (r,i,f,label,aria)=>`<div class="va-ctr">
      <button data-i="${i}" data-f="${f}" data-step="-1" aria-label="One fewer ${aria}" ${locked||!r[f]?'disabled':''}>−</button>
      <label><input type="number" inputmode="numeric" min="0" data-i="${i}" data-f="${f}" value="${r[f]}" aria-label="${aria}s on ${esc(r.account)}" ${locked?'disabled':''}><small>${label}</small></label>
      <button data-i="${i}" data-f="${f}" data-step="1" aria-label="One more ${aria}" ${locked?'disabled':''}>+</button></div>`;
  const have = new Set(rows.map(r=>r.platform+'|'+r.account));
  const work = document.createElement('section'); work.className = 'db-sec';
  work.innerHTML = `
    <div class="db-sh"><h2>${isToday?"Today's work":'Work'}</h2><span class="db-eye">${t.appts} APPTS · ${t.dms} DMS</span></div>
    <div class="db-list va-work">
      ${rows.length?rows.map((r,i)=>`<div class="va-row">
        <div class="va-acc"><b>${esc(r.account)}</b><span>${r.platform}</span>${!locked&&!r.dms&&!r.appts?`<button class="sl-x" data-rm="${i}" aria-label="Remove ${esc(r.account)}">×</button>`:''}</div>
        <div class="va-ctrs">${ctr(r,i,'dms','DMS','DM')}${ctr(r,i,'appts','APPTS','appointment')}</div>
      </div>`).join(''):`<p class="va-empty">${locked?'Nothing was logged.':'Nothing logged yet — add the first account you work on.'}</p>`}
      ${locked?'':`<div class="va-add"><select id="vAdd" aria-label="Add an account"><option value="">+ Add an account</option>${PLATFORMS.map(p=>`<optgroup label="${p}">${accountsFor(p).filter(a=>!have.has(p+'|'+a)).map(a=>`<option value="${esc(p+'|'+a)}">${esc(a)}</option>`).join('')}</optgroup>`).join('')}</select></div>`}
    </div>`;

  work.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ const r=rows[Number(b.dataset.i)]; r[b.dataset.f]=Math.max(0,r[b.dataset.f]+Number(b.dataset.step)); save(); });
  work.querySelectorAll('input[data-f]').forEach(inp=>inp.onchange=()=>{ rows[Number(inp.dataset.i)][inp.dataset.f]=Math.max(0,Math.floor(Number(inp.value)||0)); save(); });
  work.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ rows.splice(Number(b.dataset.rm),1); save(); });
  const add = work.querySelector('#vAdd');
  if(add) add.onchange=()=>{ if(!add.value) return; const i=add.value.indexOf('|'); rows.push({platform:add.value.slice(0,i), account:add.value.slice(i+1), appts:0, dms:0}); save(); };

  // submit bar
  let msg, warn = false;
  if(tooOld && !e.submitted) msg = `Older than ${LOG_BACK_DAYS} days — ask an admin to log this day.`;
  else if(e.submitted && e.verifiedByNoor) msg = 'Submitted · verified ✓';
  else if(e.submitted) msg = adminMode ? 'Submitted · god mode can still edit' : 'Submitted · waiting for Noor';
  else if(isToday && nowMin < end) msg = 'Submit when your shift ends';

  const sub = bar.querySelector('#vSubmit'); if(sub) sub.onclick = ()=>writeEntry(vaId, d, {submitted:true});

  // last 7 days (folded)
  const days = [...Array(7)].map((_,i)=>shiftDay(today,-i)), open = !!histOpen[vaId];
  const hist = document.createElement('section'); hist.className = 'db-plat'+(open?' open':'');
  hist.innerHTML = `<button class="db-pb" aria-expanded="${open}"><b>Last 7 days</b><svg class="db-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    ${open?`<div class="va-hist">${days.map(dt=>{ const he=getEntry(vaId,dt), ht=totals(he), hh=hoursBetween(he.signIn,he.signOut);
      return `<div class="va-h${dt===d?' cur':''}"><button class="va-hd" data-day="${dt}">${dayTitle(dt)}</button>
        <span>${he.signIn?hh.toFixed(1)+' h':'—'}</span><span>${ht.appts} appt · ${ht.dms} DMs</span><span>${checkinCell(va,dt)}</span>
        <span>${he.submitted?(he.verifiedByNoor?'<span class="tag verified">Verified</span>':'<span class="tag ok">Submitted</span>'):(he.signIn?'<span class="tag off">Open</span>':'')}</span>
        ${adminMode?`<span class="acts"><button class="ed" data-edit-time="${vaId}|${dt}">✎</button>${he.submitted?`<button class="ed danger" data-unsub="${vaId}|${dt}">↺</button>`:''}</span>`:''}</div>`; }).join('')}</div>`:''}`;
  wrap.appendChild(hist);
  hist.querySelector('.db-pb').onclick = ()=>{ histOpen[vaId]=!open; render(); };
  hist.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ viewDates[vaId]=b.dataset.day; render(); window.scrollTo({top:0}); });

  // head controls
  const go = k=>{ viewDates[vaId] = k>=today ? today : k; render(); };
  head.querySelector('#vPrev').onclick = ()=>go(shiftDay(d,-1));
  head.querySelector('#vNext').onclick = ()=>go(shiftDay(d,1));
  head.querySelector('#vDate').onchange = ev=>{ if(ev.target.value) go(ev.target.value); };
  const vt = head.querySelector('#vToday'); if(vt) vt.onclick = ()=>go(today);
  head.querySelector('#vLock').onclick = ()=>{ lockVa(vaId); render(); };
}

// ---------- settings: Supreme Leader → Settings writes vibe_settings/main; anything missing falls back to the defaults at the top ----------
const BASE = JSON.parse(JSON.stringify({ vas:VAS, accounts:ACCOUNTS_BY_PLATFORM, passcodes:PASSCODES, pin:ADMIN_PIN, early:CHECKIN_EARLY, grace:CHECKIN_GRACE }));
const hmOf = h => pad2(Math.floor(h))+':'+pad2(Math.round(h%1*60));
function applySettings(s){
  s = s || {};
  VAS.forEach(v=>{
    const b = BASE.vas.find(x=>x.id===v.id), p = (s.people||{})[v.id] || {};
    Object.assign(v, JSON.parse(JSON.stringify(b)));
    if(v.role==='va'){
      if(Number.isFinite(p.shiftStart) && Number.isFinite(p.shiftEnd)){ v.shiftStart=p.shiftStart; v.shiftEnd=p.shiftEnd; }
      if(Array.isArray(p.checkins) && p.checkins.length) v.checkins=[...p.checkins].sort();
      v.shiftLabel = `${fmtMin(v.shiftStart*60)} – ${fmtMin(v.shiftEnd*60)}`;
    }
    PASSCODES[v.id] = p.passcode || BASE.passcodes[v.id];
  });
  Object.keys(ACCOUNTS_BY_PLATFORM).forEach(k=>delete ACCOUNTS_BY_PLATFORM[k]);
  Object.assign(ACCOUNTS_BY_PLATFORM, JSON.parse(JSON.stringify(s.accounts || BASE.accounts)));
  ADMIN_PIN = /^\d{4,8}$/.test(s.adminPin||'') ? s.adminPin : BASE.pin;
  CHECKIN_EARLY = Number.isFinite(s.early) ? s.early : BASE.early;
  CHECKIN_GRACE = Number.isFinite(s.grace) ? s.grace : BASE.grace;
  CHECK_TOTAL = checkKeys().length;
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('in'));
  setTimeout(()=>{ t.classList.remove('in'); setTimeout(()=>t.remove(),250); }, 2200);
}
async function deleteEntry(vaId, dk){
  const key=entryKey(vaId,dk);
  delete entries[key];
  if(dbAvailable && db){ try{ await db.collection('entries').doc(key).delete(); }catch(e){} render(); }
  else { localSave(); render(); }
}

// --- Live: what needs attention + everyone right now
function slAttention(){
  const today=todayKey(), nowMin=minOf(new Date()), out=[];
  VAS.forEach(va=>{
    const e=getEntry(va.id,today);
    if(va.shiftStart!=null){
      if(!e.signIn && nowMin>va.shiftStart*60+5 && nowMin<va.shiftEnd*60) out.push({va,dk:today,m:`${va.name} hasn't signed in — shift started ${fmtMin(va.shiftStart*60)}.`,act:'in'});
      if(e.signIn && !e.signOut && nowMin>va.shiftEnd*60+15) out.push({va,dk:today,m:`${va.name} is still clocked in after ${fmtMin(va.shiftEnd*60)}.`,act:'out'});
    }
    checkinSlots(va,today).filter(s=>s.state==='overdue').forEach(s=>out.push({va,dk:today,m:`${va.name}: check-in ${s.n} (${fmtMin(s.due)}) is overdue.`}));
    if(va.role!=='va') return;
    for(let i=1;i<=7;i++){
      const dk=shiftDay(today,-i), pe=getEntry(va.id,dk);
      if(pe.signIn && !pe.signOut) out.push({va,dk,m:`${va.name} never signed out on ${dayShort(dk)}.`});
      if(pe.signIn && !pe.submitted) out.push({va,dk,m:`${va.name} never submitted ${dayShort(dk)}.`});
      else if(pe.submitted && !pe.verifiedByNoor) out.push({va,dk,m:`${va.name}'s ${dayShort(dk)} is waiting to be verified.`,act:'verify',info:1});
    }
  });
  return out;
}

// --- Reports: any date range, per person, with CSV export
async function loadRange(from, to){
  if(dbAvailable && db){
    try{ const s=await db.collection('entries').where('date','>=',from).where('date','<=',to).get(); const m={}; s.docs.forEach(x=>m[x.id]=x.data()); return m; }catch(e){}
  }
  const m={}; Object.entries(entries).forEach(([k,v])=>{ if(v.date>=from && v.date<=to) m[k]=v; }); return m;
}
function repStats(m, from, to){
  const days=[]; for(let k=from; k<=to; k=shiftDay(k,1)) days.push(k);
  const ge=(id,dk)=>{ const e=m[entryKey(id,dk)]; return e?{logs:[],...e}:null; };
  const rows=[], daily=[];
  VAS.forEach(va=>{
    const r={va, days:0, hours:0, appts:0, dms:0, ckDone:0, ckExp:0, ckOn:0, late:0, unsub:0, verified:0};
    days.forEach(dk=>{
      const e=ge(va.id,dk); if(!e || !e.signIn) return;
      const t=totals(e), h=hoursBetween(e.signIn,e.signOut);
      r.days++; r.hours+=h; r.appts+=t.appts; r.dms+=t.dms;
      if(va.shiftStart!=null && minOf(new Date(e.signIn))>va.shiftStart*60+5) r.late++;
      let ck='';
      if(va.checkins){ const s=checkinSlots(va,dk,e); r.ckExp+=s.length; r.ckDone+=s.filter(x=>x.rec).length; r.ckOn+=s.filter(x=>x.state==='done').length; ck=`${s.filter(x=>x.rec).length}/${s.length}`; }
      if(va.role==='va'){ if(!e.submitted) r.unsub++; if(e.verifiedByNoor) r.verified++; }
      daily.push([dk, va.name, fmt24(e.signIn), e.signOut?fmt24(e.signOut):'', h.toFixed(2), va.role==='va'?t.appts:'', va.role==='va'?t.dms:'', ck,
        va.role==='va'?(e.submitted?'yes':'no'):'', va.role==='va'?(e.verifiedByNoor?'yes':'no'):'']);
    });
    rows.push(r);
  });
  return {rows, daily:daily.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0), nDays:days.length};
}
function downloadCsv(name, rows){
  const csv=rows.map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

    <div class="sl-sec">Check-in window</div>
    <div class="te-grid"><div><label>Opens (min before)</label><input type="number" id="stEarly" min="0" max="180" value="${CHECKIN_EARLY}"></div>
      <div><label>On time until (min after)</label><input type="number" id="stGrace" min="0" max="120" value="${CHECKIN_GRACE}"></div></div>
    <div class="sl-sec">Accounts · one per line</div>
    <div class="sl-grid2">${PLATFORMS.map(p=>`<div><label>${p}</label><textarea class="sl-ta" data-plat="${p}" spellcheck="false">${esc(accountsFor(p).join('\n'))}</textarea></div>`).join('')}</div>
    <div class="sl-sec">God mode PIN (tap the logo)</div>
    <div class="sl-pin"><input type="text" inputmode="numeric" id="stPin" value="${esc(ADMIN_PIN)}" maxlength="8" autocomplete="off"></div>
    <div class="sl-foot"><button class="btn lime" id="stSave">Save settings</button><button class="btn ghost" id="stDef">Reset to defaults</button></div>
    <p class="sl-msg" id="stMsg"></p>`;
  const msg=card.querySelector('#stMsg'), say=(t,c)=>{ msg.className='sl-msg '+(c||''); msg.textContent=t; };
  const ref=db.collection('vibe_settings').doc('main');
  const fail=e=>say(e&&e.code==='permission-denied'?'Not allowed — the vibe_settings rule is missing in Firestore, or this account isn\'t the admin.':'Couldn\'t save — check the connection and try again.','bad');
  card.querySelector('#lgOut').onclick=ev=>{ ev.preventDefault(); auth.signOut(); };
  card.addEventListener('click',ev=>{
    const add=ev.target.closest('[data-addck]'); if(add){ add.insertAdjacentHTML('beforebegin',ckIn('')); add.previousElementSibling.querySelector('input').focus(); return; }
    const rm=ev.target.closest('[data-rmck]'); if(rm) rm.parentElement.remove();
  });
  card.querySelector('#stSave').onclick=async()=>{
    const people={}, accounts={}; let err='';
    card.querySelectorAll('[data-person]').forEach(b=>{
      const v=VAS.find(x=>x.id===b.dataset.person), p={passcode:b.querySelector('[data-s=pass]').value.trim()};
      if(!p.passcode) err=err||`${v.name} needs a passcode.`;
      if(v.role==='va'){
        const s=b.querySelector('[data-s=start]').value, e=b.querySelector('[data-s=end]').value;
        if(!s||!e||hmMin(e)<=hmMin(s)) err=err||`${v.name}'s shift must end after it starts.`;
        else { p.shiftStart=hmMin(s)/60; p.shiftEnd=hmMin(e)/60; }
        p.checkins=[...new Set([...b.querySelectorAll('.sl-cks input[type=time]')].map(i=>i.value).filter(Boolean))].sort();
        if(!p.checkins.length) err=err||`${v.name} needs at least one check-in time.`;
      }
      people[v.id]=p;
    });
    card.querySelectorAll('[data-plat]').forEach(t=>{
      const list=[...new Set(t.value.split('\n').map(x=>x.trim()).filter(Boolean))];
      if(!list.length) err=err||`${t.dataset.plat} needs at least one account.`;
      accounts[t.dataset.plat]=list;
    });
    const pin=card.querySelector('#stPin').value.trim(), early=Number(card.querySelector('#stEarly').value), grace=Number(card.querySelector('#stGrace').value);
    if(!/^\d{4,8}$/.test(pin)) err=err||'The PIN must be 4–8 digits.';
    if(!Number.isInteger(early)||early<0||early>180||!Number.isInteger(grace)||grace<0||grace>120) err=err||'Check the check-in window minutes.';
    if(err){ say(err,'bad'); return; }
    say('Saving…');
    try{ await ref.set({people, accounts, adminPin:pin, early, grace, updatedAt:new Date().toISOString(), updatedBy:leaderUser.email||''}); toast('Settings saved for everyone'); }
    catch(e){ fail(e); }
  };
  card.querySelector('#stDef').onclick=()=>openConfirm({title:'Reset all settings?', msg:'Shifts, check-in times, accounts, passcodes and the PIN go back to the built-in defaults for everyone.', ok:'Reset', danger:true},
    async()=>{ try{ await ref.delete(); toast('Back to defaults'); }catch(e){ fail(e); } });
}

// god-mode quick actions (Live view)
document.addEventListener('click',ev=>{
  if(!adminMode) return;
  const now=()=>new Date().toISOString(), b=ev.target.closest('[data-sled],[data-slin],[data-slout],[data-slv]'); if(!b) return;
  if(b.dataset.sled){ const [id,dk]=b.dataset.sled.split('|'); slOpenDay(id,dk); }
  else if(b.dataset.slin){ writeEntry(b.dataset.slin,todayKey(),{signIn:now(),editedByAdmin:true,editedAt:now()}); toast('Signed in'); }
  else if(b.dataset.slout){ writeEntry(b.dataset.slout,todayKey(),{signOut:now(),editedByAdmin:true,editedAt:now()}); toast('Signed out'); }
  else if(b.dataset.slv){ const [id,dk]=b.dataset.slv.split('|'); writeEntry(id,dk,{verifiedByNoor:true,verifiedAt:now()}); toast('Verified'); }
});

init();
</script>
</body>
