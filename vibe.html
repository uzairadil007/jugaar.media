<style>
:root{
  --lime:#d8ff29; --ink:#0a0a0a; --paper:#ffffff; --line:#e8e8e8; --sub:#6b6b6b;
}
:root:not([data-theme="light"]){ }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0;}
.brand{display:flex;align-items:center;font-size:19px;}
.brand .logo{font-family:Helvetica,Arial,sans-serif;font-style:italic;font-weight:800;letter-spacing:.01em;color:#fff;}
.brand .logo-dot{color:var(--lime);}
nav{display:flex;gap:4px;background:#161616;border-radius:10px;padding:4px;flex-wrap:wrap;}
nav button{background:none;border:0;color:#bbb;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;}
nav button.active{background:var(--lime);color:var(--ink);}
.admin-toggle{display:flex;align-items:center;gap:8px;}
.admin-pin-wrap{position:relative;display:flex;align-items:center;}
input.admin-pin{width:104px;padding:9px 30px 9px 12px;border-radius:9px;border:1.5px solid #2b2b2b;background:#101010;color:var(--lime);
  font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:13px;letter-spacing:.18em;text-align:center;
  transition:box-shadow .15s,border-color .15s;}
input.admin-pin:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(216,255,41,.28);}
input.admin-pin::placeholder{color:#5a5a5a;letter-spacing:.02em;font-family:Helvetica,Arial,sans-serif;font-size:10.5px;text-transform:uppercase;}
button.admin-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8a8a8a;cursor:pointer;
  font-size:14px;padding:8px;line-height:1;}
button.admin-unlock{background:var(--lime);color:var(--ink);border:0;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 0 0 0 rgba(216,255,41,.5);
  transition:transform .1s;}
button.admin-unlock:active{transform:translateY(1px);}
.admin-pin-wrap.shake{animation:shakeAnim .4s;}
.admin-pin-err{width:100%;text-align:center;font-size:10.5px;color:#ff6b6b;margin-top:4px;}
.admin-pill{font-size:11px;background:var(--lime);color:var(--ink);padding:6px 12px;border-radius:20px;font-weight:800;letter-spacing:.03em;
  box-shadow:0 0 0 2px rgba(216,255,41,.25);}
button.admin-exit{background:transparent;border:1px solid #444;color:#eee;border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;}
main{max-width:980px;margin:0 auto;padding:22px 20px 40px;width:100%;flex:1 0 auto;}
.site-footer{flex-shrink:0;text-align:center;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);}
.site-footer a{color:var(--ink);font-weight:700;text-decoration:none;}
.banner{background:#fff7e0;border:1px solid #f0dca0;color:#6b5400;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:18px;}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;background:#fff;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat b{display:block;font-size:24px;margin-bottom:2px;}
.stat span{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
h2{font-size:18px;margin:0 0 4px;}
h3{font-size:14px;margin:0 0 12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
.muted{color:var(--sub);font-size:13px;}
.clock{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.clock-time{font-size:34px;font-weight:800;}
.clock-status{font-size:12.5px;color:var(--sub);margin-top:4px;}

/* ---- passcode gate (modern) ---- */
.g2-wrap{display:flex;justify-content:center;padding:clamp(8px,4vh,40px) 0 20px;}
.g2-card{position:relative;width:100%;max-width:400px;background:#fffefb;border:1.5px solid #e6e4d4;border-radius:28px;
  padding:38px 30px 30px;text-align:center;overflow:hidden;box-shadow:0 1px 0 #fff inset,0 24px 60px -28px rgba(10,10,10,.28);
  animation:g2In .7s cubic-bezier(.2,.8,.2,1) both;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;}
.g2-card::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:70%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(216,255,41,.38),rgba(216,255,41,0));animation:g2Glow 6s ease-in-out infinite alternate;}
.g2-card>*{position:relative;}
.g2-card>.g2-i{animation:g2Up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 150ms);}
.g2-icon{width:78px;height:78px;margin:0 auto 18px;border-radius:24px;background:var(--ink);display:grid;place-items:center;
  animation:g2Float 4s ease-in-out infinite;box-shadow:0 12px 28px -10px rgba(10,10,10,.5);}
.g2-icon::after{content:"";position:absolute;inset:0;border-radius:24px;border:2px solid var(--lime);opacity:0;animation:g2Ring 2.6s ease-out infinite;}
.g2-icon svg{width:36px;height:36px;overflow:visible;}
.g2-icon .shackle{transform-origin:16px 11px;transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
.g2-card h2{font-size:23px;letter-spacing:-.01em;margin:0 0 10px;}
.g2-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#55554e;background:#f2f0e4;border-radius:999px;padding:6px 12px;}
.g2-chip i{width:7px;height:7px;border-radius:50%;background:#f0553a;animation:g2Blink 1.6s ease-in-out infinite;}
.g2-sub{font-size:14px;color:var(--sub);margin:16px 0 18px;}
.g2-field{position:relative;}
.g2-field input{width:100%;height:56px;padding:0 50px 0 18px;border:2px solid transparent;border-radius:16px;background:#f3f1e6;color:var(--ink);
  font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:18px;letter-spacing:.14em;text-align:center;
  transition:background .2s,border-color .2s,box-shadow .25s;}
.g2-field input::placeholder{letter-spacing:.02em;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#9a9a90;}
.g2-field input:hover{background:#eeebdd;}
.g2-field input:focus{outline:none;background:#fff;border-color:var(--ink);box-shadow:0 0 0 5px rgba(216,255,41,.55);}
.g2-field input.bad{border-color:#f0553a;background:#fff4f1;box-shadow:0 0 0 5px rgba(240,85,58,.14);}
.g2-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;border-radius:12px;cursor:pointer;color:#7a7a72;display:grid;place-items:center;transition:background .2s,color .2s;}
.g2-eye:hover{background:rgba(10,10,10,.06);color:var(--ink);}
.g2-eye svg{width:20px;height:20px;}
.g2-err{min-height:20px;margin:10px 0 0;font-size:13px;font-weight:600;color:#e2452a;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;}
.g2-err.show{opacity:1;transform:none;}
.g2-btn{position:relative;width:100%;height:54px;margin-top:6px;border:0;border-radius:16px;background:var(--ink);color:var(--lime);font-weight:800;font-size:15px;letter-spacing:.02em;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:transform .15s,box-shadow .25s,background .3s,color .3s;}
.g2-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(216,255,41,.28) 50%,transparent 70%);transform:translateX(-120%);}
.g2-btn:hover{box-shadow:0 12px 26px -12px rgba(10,10,10,.6);transform:translateY(-1px);}
.g2-btn:hover::before{transition:transform .8s;transform:translateX(120%);}
.g2-btn:active{transform:translateY(1px) scale(.99);}
.g2-btn svg{width:18px;height:18px;transition:transform .25s;}
.g2-btn:hover svg{transform:translateX(4px);}
.g2-card.shake{animation:g2Shake .45s;}
.g2-card.ok{transform:scale(.97) translateY(-6px);opacity:0;transition-delay:.35s;}
.g2-card.ok .shackle{transform:translateY(-4px) rotate(24deg);}
.g2-card.ok .g2-icon{background:var(--lime);animation:none;transform:scale(1.06);transition:background .3s,transform .4s cubic-bezier(.34,1.56,.64,1);}
.g2-card.ok .g2-icon svg *{stroke:var(--ink);}
.g2-card.ok .g2-btn{background:var(--lime);color:var(--ink);}
@keyframes g2In{from{opacity:0;transform:translateY(24px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes g2Up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes g2Float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes g2Ring{0%{opacity:.7;transform:scale(1);}100%{opacity:0;transform:scale(1.55);}}
@keyframes g2Glow{from{transform:translateX(-6%);}to{transform:translateX(8%) translateY(6%);}}
@keyframes g2Blink{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes g2Shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
@media (max-width:480px){.g2-card{padding:30px 20px 24px;border-radius:24px;}.g2-field input{font-size:16px;}}
@media (prefers-reduced-motion:reduce){.g2-card,.g2-card *,.g2-card::before{animation:none!important;transition:none!important;}}

<script>
const VAS = [
  { id:'rimsha', name:'Rimsha', role:'va', shiftStart:9,  shiftEnd:15, shiftLabel:'9:00 AM – 3:00 PM' },

];
const PLATFORMS = ['Instagram','Facebook','TikTok','YouTube'];
const ACCOUNTS_BY_PLATFORM = {
  'Instagram': ['@tsk_diet','@tskdiet_stories','@tehreemkhan_tsk'],
  'Facebook':  ['@tsk_diet','@tskdiet_stories','@tehreemkhan_tsk'],
  'TikTok':    ['@tskdiet'],
  'YouTube':   ['Account 1','Account 2','Account 3'],
};
const accountsFor = platform => ACCOUNTS_BY_PLATFORM[platform] || ['Account 1'];
const ADMIN_PIN = '1997';
const PASSCODES = { rimsha:'@rimsha3#', amna:'@amna9(', noor:'@noor4$' };

let db = null, dbAvailable = false;
let entries = {};          // key: vaId_date -> {signIn,signOut,logs[],submitted,verifiedByNoor,verifiedAt}
let adminMode = false;
let activeTab = 'dashboard';
let unlocked = {};          // vaId -> true, once passcode entered this session
const localKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => localKey(new Date());
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true}) : '—';
const hoursBetween = (a,b) => a && b ? Math.max(0,(new Date(b)-new Date(a))/3600000) : 0;
const entryKey = (va,d) => va+'_'+d;

function getEntry(va, date){
  return entries[entryKey(va,date)] || { vaId:va, date, signIn:null, signOut:null, logs:[], submitted:false };
}
function totals(e){
  return e.logs.reduce((a,l)=>({appts:a.appts+Number(l.appts||0), dms:a.dms+Number(l.dms||0)}), {appts:0,dms:0});
}
function dmsByPlatform(day){
  const out = {}; PLATFORMS.forEach(p=> out[p]=0);
  VAS.filter(v=>v.role==='va').forEach(va=>{
    getEntry(va.id, day).logs.forEach(l=>{ out[l.platform] = (out[l.platform]||0) + Number(l.dms||0); });
  });
  return out;
}

// ---------- per-VA passcode lock ----------
function isUnlocked(vaId){
  if(adminMode) return true;
  if(unlocked[vaId]) return true;
  try{ return sessionStorage.getItem('vibe_unlock_'+vaId) === '1'; }catch(e){ return false; }
}
function unlockVa(vaId){
  unlocked[vaId] = true;
  try{ sessionStorage.setItem('vibe_unlock_'+vaId, '1'); }catch(e){}
}
function lockVa(vaId){
  delete unlocked[vaId];
  try{ sessionStorage.removeItem('vibe_unlock_'+vaId); }catch(e){}
}

// ---------- persistence ----------
function localSave(){ try{ localStorage.setItem('kpi_fallback', JSON.stringify(entries)); }catch(e){} }
function localLoad(){ try{ return JSON.parse(localStorage.getItem('kpi_fallback')||'{}'); }catch(e){ return {}; } }

async function writeEntry(va, date, patch){
  const key = entryKey(va,date);
  const current = getEntry(va,date);
  const next = { ...current, ...patch };
  entries[key] = next;
  if(dbAvailable && db){
    try{ await db.collection('entries').doc(key).set(next); }
    catch(err){ /* rejected write: keep local state, re-render */ render(); }
  } else {
    localSave(); render();
  }
}

const firebaseConfig = {
  apiKey: "AIzaSyAZn-MWlArpHYcb7Z88u-wzKdrBxtIsYiE",
  authDomain: "tracker-9a8cb.firebaseapp.com",
  projectId: "tracker-9a8cb",
  storageBucket: "tracker-9a8cb.firebasestorage.app",
  messagingSenderId: "765187139896",
  appId: "1:765187139896:web:61ddd4fad7ee85364239cd"
};

async function init(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; }
  if(db){
    dbAvailable = true;
    db.collection('entries').orderBy('date','desc').limit(200).onSnapshot(
      snap => { entries = {}; snap.docs.forEach(d => entries[d.id] = d.data()); render(); },
      err => { dbAvailable = false; entries = localLoad(); render(); }

// ---------- status card (Zahra-style) ----------
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const viewDates={};
const getViewDate=id=>viewDates[id]||todayKey();
const pad2=n=>String(n).padStart(2,'0');
const fmtHMS=ms=>{const s=Math.floor(ms/1000);return `${pad2(Math.floor(s/3600))}:${pad2(Math.floor(s%3600/60))}:${pad2(s%60)}`;};
const fmt24=iso=>{ if(!iso) return '—'; const d=new Date(iso); const h=d.getHours(); return (h%12||12)+':'+pad2(d.getMinutes())+' '+(h<12?'AM':'PM'); };

function monthStats(va, dk){
  const [y,m]=dk.split('-').map(Number);
  const last=new Date(y,m,0).getDate(), today=todayKey();
  let booked=0, verified=0, missed=0;
  for(let day=1; day<=last; day++){
    const k=`${y}-${pad2(m)}-${pad2(day)}`;
    const e=getEntry(va.id,k);
    if(va.role==='va') booked+=totals(e).appts;
    else VAS.filter(v=>v.role==='va').forEach(v=>{ if(getEntry(v.id,k).verifiedByNoor) verified++; });
    if(k<today && !e.signIn) missed++;   // past day with no sign-in
  }
  return {booked, verified, missed, month:MONTH_NAMES[m-1]};
}

function mountStatusCard(parent, va, opts={}){
  const dk=opts.dk||getViewDate(va.id), today=todayKey(), isToday=dk===today;
  const e=getEntry(va.id,dk), sup=va.role==='supervisor';
  let big,small,label;
  if(sup){
    const st=VAS.filter(v=>v.role==='va').map(v=>getEntry(v.id,dk));
    big=st.filter(x=>x.verifiedByNoor).length; small=st.filter(x=>x.submitted).length; label='Entries verified';
  } else { const t=totals(e); big=t.appts; small=t.dms; label='Appointments booked'; }
  const pct=small>0?Math.min(100,big/small*100):0;
  const working=isToday && e.signIn && !e.signOut;
  const statusTxt=working?'Working':(e.signIn&&e.signOut?'Signed out':(e.signIn?'No sign-out':'Offline'));
  const ms=e.signIn?Math.max(0,(e.signOut?new Date(e.signOut):new Date())-new Date(e.signIn)):0;
  const mins=d=>d.getHours()*60+d.getMinutes();
  const lateIn=va.shiftStart!=null && e.signIn && mins(new Date(e.signIn))>va.shiftStart*60+5;
  const earlyOut=va.shiftEnd!=null && e.signOut && mins(new Date(e.signOut))<va.shiftEnd*60;
  const mo=monthStats(va,dk);

// ---------- overlay / modals ----------
function openOverlay(inner){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="mdl" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('in'));
  const onKey=e=>{ if(e.key==='Escape') close(); };
  const close=()=>{ ov.classList.remove('in'); setTimeout(()=>ov.remove(),220); document.removeEventListener('keydown',onKey); };
  document.addEventListener('keydown',onKey);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  return {ov, close, box:ov.firstElementChild};
}
const SHIELD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>';

function openPinModal(){
  const n=ADMIN_PIN.length;
  const {ov,close,box}=openOverlay(`
    <div class="mdl-ico">${SHIELD}</div>
    <h2>Admin access</h2><p class="muted">Enter your ${n}-digit PIN</p>
    <div class="pin-row" id="pinRow">${Array.from({length:n},()=>'<input class="pin-box" type="password" inputmode="numeric" autocomplete="off" maxlength="1">').join('')}</div>
    <p class="pin-err" id="pinErr"></p>`);
  const row=box.querySelector('#pinRow'), err=box.querySelector('#pinErr');
  const boxes=[...row.querySelectorAll('input')];
  const check=()=>{
    const v=boxes.map(b=>b.value).join('');
    if(v.length<n) return;
    if(v===ADMIN_PIN){
      row.classList.add('ok'); boxes.forEach(b=>b.disabled=true);
      setTimeout(()=>{ adminMode=true; try{sessionStorage.setItem('kpi_admin','1')}catch(e){} close(); render(); },450);
    } else {
      err.textContent='Wrong PIN — try again.'; row.classList.add('bad');
      row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
      setTimeout(()=>{ boxes.forEach(b=>{b.value='';b.classList.remove('filled');}); row.classList.remove('bad'); boxes[0].focus(); },420);
    }
  };
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{
      b.value=b.value.replace(/\D/g,'').slice(-1);
      b.classList.toggle('filled',!!b.value); err.textContent='';
      if(b.value && boxes[i+1]) boxes[i+1].focus();
      check();
    });
    b.addEventListener('keydown',ev=>{
      if(ev.key==='Backspace' && !b.value && boxes[i-1]){ boxes[i-1].value=''; boxes[i-1].classList.remove('filled'); boxes[i-1].focus(); }
      if(ev.key==='ArrowLeft' && boxes[i-1]) boxes[i-1].focus();
      if(ev.key==='ArrowRight' && boxes[i+1]) boxes[i+1].focus();
    });
    b.addEventListener('paste',ev=>{
      const d=(ev.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,n);
      if(!d) return; ev.preventDefault();
      d.split('').forEach((c,k)=>{ boxes[k].value=c; boxes[k].classList.add('filled'); });
      boxes[Math.min(d.length,n-1)].focus(); check();
    });
  });
  setTimeout(()=>boxes[0].focus(),120);
}

  const {close,box}=openOverlay(`

      <div class="te-row"><div><label>Sign out</label><input type="time" id="teOut"></div><button class="te-mini" data-now="teOut">Now</button><button class="te-mini" data-clr="teOut">Clear</button></div>
      <p class="te-sum" id="teSum"></p>
    </div>
    <div class="mdl-actions"><button class="btn ghost" id="teCancel">Cancel</button><button class="btn lime" id="teSave">Save</button></div>`);
  box.classList.add('wide');
  const $=id=>box.querySelector('#'+id);
  const who=$('teWho'), day=$('teDay'), inI=$('teIn'), outI=$('teOut'), sum=$('teSum'), save=$('teSave');
  const cur=()=>VAS.find(v=>v.id===who.value);
  const load=()=>{
    const e=getEntry(who.value,day.value||todayKey());
    inI.value=toT(e.signIn); outI.value=toT(e.signOut);
    const v=cur(); $('teShift').textContent=v.shiftStart!=null?'Shift '+v.shiftLabel:v.shiftLabel;
    $('teShiftFill').style.display=v.shiftStart!=null?'':'none'; upd();
  };
  const at=t=>new Date(`${day.value}T${t}:00`);
  const upd=()=>{
    sum.classList.remove('bad'); save.disabled=!day.value;
    if(inI.value&&outI.value){
      const m=Math.round((at(outI.value)-at(inI.value))/60000);
      if(m<=0){ sum.textContent='Sign-out must be after sign-in.'; sum.classList.add('bad'); save.disabled=true; }
      else sum.textContent=`Total ${Math.floor(m/60)}h ${pad2(m%60)}m`;
    } else if(outI.value&&!inI.value){ sum.textContent='Add a sign-in time too.'; sum.classList.add('bad'); save.disabled=true; }
    else sum.textContent=inI.value?'Still on shift (no sign-out).':'No times recorded.';
  };
  [who,day].forEach(x=>x.addEventListener('change',load));
  [inI,outI].forEach(x=>x.addEventListener('input',upd));
  box.querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>{ const d=new Date(); $(b.dataset.now).value=pad2(d.getHours())+':'+pad2(d.getMinutes()); upd(); });
  box.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{ $(b.dataset.clr).value=''; upd(); });
  $('teClrAll').onclick=()=>{ inI.value=''; outI.value=''; upd(); };
  $('teShiftFill').onclick=()=>{ const v=cur(); inI.value=pad2(v.shiftStart)+':00'; outI.value=pad2(v.shiftEnd)+':00'; upd(); };
  $('teCancel').onclick=close;
  save.onclick=()=>{
    const iso=t=>t?at(t).toISOString():null;
    writeEntry(who.value,day.value,{signIn:iso(inI.value),signOut:iso(outI.value),editedByAdmin:true,editedAt:new Date().toISOString()});
    dashDate=day.value>=todayKey()?null:day.value;
    close();
  };
  load();
}

// ---------- live (real-time) date/time/hours ticking ----------
function tickLiveElements(){
  const now = new Date();
  document.querySelectorAll('.live-clock-time').forEach(el=>{
    el.textContent = fmtNow(now);
  });
  document.querySelectorAll('.live-hours').forEach(el=>{
    const signIn = el.dataset.signin || null;
    const signOut = el.dataset.signout || null;
    if(!signIn) return;
    const hrs = hoursBetween(signIn, signOut || now.toISOString());
    el.textContent = hrs.toFixed(2);
  });
  document.querySelectorAll('.live-total').forEach(el=>{
    const day=el.dataset.day, isT=day===todayKey(); let h=0;
    VAS.forEach(v=>{ const e=getEntry(v.id,day); if(e.signIn) h+=hoursBetween(e.signIn, e.signOut||(isT?now.toISOString():e.signIn)); });
    el.textContent=h.toFixed(2);
  });
  document.querySelectorAll('.live-hms[data-live="1"]').forEach(el=>{
    if(el.dataset.signin) el.textContent = fmtHMS(now - new Date(el.dataset.signin));
  });
  // if the day has rolled over past midnight while the page stayed open, refresh the whole view
  const k = todayKey();
  if(k !== tickLiveElements._lastDay){
    if(tickLiveElements._lastDay !== undefined){ dashDate=null; Object.keys(viewDates).forEach(k=>delete viewDates[k]); render(); }
    tickLiveElements._lastDay = k;
  }
}

// ---------- Dashboard (single unified panel) ----------
let dashDate=null;
const expanded={};
const getDash=()=>dashDate||todayKey();
const dayShort=dk=>{ const [y,m,d]=dk.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'}); };
const dayTitle=dk=>{
  if(dk===todayKey()) return 'Today';
  if(dk===shiftDay(todayKey(),-1)) return 'Yesterday';
  const [y,m,d]=dk.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', year:'numeric'});
};
const shiftDay=(dk,n)=>{ const [y,m,d]=dk.split('-').map(Number); return localKey(new Date(y,m-1,d+n)); };
const pct=(a,b)=>b>0?Math.round(a/b*100):0;

function renderDashboard(app){
  const dk=getDash(), today=todayKey(), isToday=dk===today;
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const mins=d=>d.getHours()*60+d.getMinutes();
  const staff=VAS.filter(v=>v.role==='va');
  let teamAppts=0, teamDms=0, working=0, submitted=0, verified=0, totalH=0, vaH=0;
  const plat={}, acct={}; PLATFORMS.forEach(p=>plat[p]={dms:0,appts:0});
  const rows=VAS.map(va=>{
    const e=getEntry(va.id,dk), sup=va.role==='supervisor', t=totals(e);
    const live=isToday&&!!e.signIn&&!e.signOut;
    const ms=e.signIn?Math.max(0,(e.signOut?new Date(e.signOut):(live?now:new Date(e.signIn)))-new Date(e.signIn)):0;
    const hrs=ms/3600000; totalH+=hrs;
    if(!sup){
      vaH+=hrs; teamAppts+=t.appts; teamDms+=t.dms; if(live) working++; if(e.submitted) submitted++; if(e.verifiedByNoor) verified++;
      e.logs.forEach(l=>{
        const o=plat[l.platform]||(plat[l.platform]={dms:0,appts:0}); o.dms+=Number(l.dms||0); o.appts+=Number(l.appts||0);
        const k=l.platform+' '+l.account; const a=acct[k]||(acct[k]={dms:0,appts:0}); a.dms+=Number(l.dms||0); a.appts+=Number(l.appts||0);
      });
    }
    const state=live?'on':(e.signIn&&e.signOut?'done':(e.signIn?'warn':'off'));
    const stateTxt=live?'Working':(e.signIn&&e.signOut?'Signed out':(e.signIn?'No sign-out':'Not signed in'));
    const late=va.shiftStart!=null&&e.signIn&&mins(new Date(e.signIn))>va.shiftStart*60+5;
    const early=va.shiftEnd!=null&&e.signOut&&mins(new Date(e.signOut))<va.shiftEnd*60;
    return {va,e,t,sup,live,hrs,state,stateTxt,late,early};
  });
  const nStaff=staff.length;
  const edited=e=>e.editedByAdmin?' <span class="edt" title="Edited by admin">✎</span>':'';
  const detail=r=>{
    if(r.sup) return `${r.va.name} supervises ${staff.map(v=>v.name).join(' & ')} · verified ${verified} of ${submitted} submitted.`;
    if(!r.e.logs.length) return 'No work logged for this day.';
    return `<div class="chips">${r.e.logs.map(l=>`<span class="chip">${l.platform} · ${l.account} — <b>${l.appts}</b> appt · <b>${l.dms}</b> DMs</span>`).join('')}</div>${r.e.editedAt?`<p class="muted" style="margin:8px 0 0;">Times edited by admin at ${fmtTime(r.e.editedAt)}</p>`:''}`;
  };

  const wrap=document.createElement('div'); wrap.className='dboard';
  app.appendChild(wrap);

  const bar=document.createElement('div'); bar.className='mn-bar';
  bar.innerHTML=`
    <div><h2>${dayTitle(dk)}</h2>${isToday
      ? `<span class="muted live-clock-time">${fmtNow(now)}</span>`
      : `<span class="muted">Viewing a past day · live time ${fmtNow(now).replace(/^.*?,\s*/,'')} · <a href="#" id="dBackToday" style="color:inherit;font-weight:600;">Back to today</a></span>`}</div>
    <div class="dash-tools">
      <button id="dPrev" aria-label="Previous day">‹</button>
      <span class="dwrap"><span class="dlabel">${dayShort(dk)}</span><input type="date" id="dDate" value="${dk}" max="${today}"></span>
      <button id="dNext" aria-label="Next day" ${isToday?'disabled':''}>›</button>
      <button id="dToday" ${isToday?'disabled':''}>Today</button>
      ${adminMode?`<button id="admEditAny" class="adm-go">✎ Edit anyone's time</button>`:''}
    </div>`;
  wrap.appendChild(bar);

  const grid=document.createElement('div'); grid.className='vc-grid'; grid.style.marginTop='14px';
  wrap.appendChild(grid);
  rows.forEach(r=>{
    const el=mountStatusCard(grid,r.va,{compact:true,dk});
    const open=!!expanded[r.va.id];
    const x=document.createElement('div'); x.className='vc-x';
    x.innerHTML=`
      ${r.sup?'':(r.e.submitted?'<span class="tag ok">Submitted</span>':'')}
      ${r.sup?'':(r.e.verifiedByNoor?'<span class="tag verified">Verified</span>':'')}
      ${adminMode&&!r.sup&&r.e.submitted&&!r.e.verifiedByNoor?`<button class="ed" data-vfy="${r.va.id}">✓ Verify</button>`:''}
      ${adminMode&&!r.sup&&r.e.submitted?`<button class="ed danger" data-unsub="${r.va.id}|${dk}">↺ Unsubmit</button>`:''}
      <button class="xp-link" data-xp="${r.va.id}">${open?'Hide':'Details'} ${open?'▴':'▾'}</button>
      ${open?`<div class="vc-detail">${detail(r)}</div>`:''}`;
    el.appendChild(x);
  });

  const sum=document.createElement('div'); sum.className='mn';
  sum.innerHTML=`
    <div class="mn-nums">
      <div><b>${teamAppts}</b><span>Appointments · ${pct(teamAppts,teamDms)}%</span></div>
      <div><b>${teamDms}</b><span>DMs answered</span></div>
      <div><b>${working}/${nStaff}</b><span>Clocked in</span></div>
      <div><b><span class="live-total" data-day="${dk}" style="font-size:inherit;color:inherit;text-transform:none;letter-spacing:0;font-weight:inherit;">${totalH.toFixed(2)}</span></b><span>Team hours</span></div>
    </div>

  wrap.appendChild(sum);

  bar.querySelector('#dDate').onchange=ev=>{ dashDate=ev.target.value||null; render(); };
  bar.querySelector('#dPrev').onclick=()=>{ dashDate=shiftDay(dk,-1); render(); };
  bar.querySelector('#dNext').onclick=()=>{ const n=shiftDay(dk,1); dashDate=n>=today?null:n; render(); };
  bar.querySelector('#dToday').onclick=()=>{ dashDate=null; render(); };
  const bt=bar.querySelector('#dBackToday'); if(bt) bt.onclick=ev=>{ ev.preventDefault(); dashDate=null; render(); };
  wrap.querySelectorAll('[data-xp]').forEach(b=>b.onclick=()=>{ expanded[b.dataset.xp]=!expanded[b.dataset.xp]; render(); });
  wrap.querySelectorAll('[data-vfy]').forEach(b=>b.onclick=()=>writeEntry(b.dataset.vfy,dk,{verifiedByNoor:true,verifiedAt:new Date().toISOString()}));
  const any=bar.querySelector('#admEditAny'); if(any) any.onclick=()=>openTimeEditor(null,dk);
}

  const wrap = document.createElement('div');
  wrap.className='g2-wrap';
  wrap.innerHTML = `
    <div class="g2-card" id="gateCard">
      <div class="g2-icon g2-i" style="--i:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d8ff29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="3"/>
          <path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="16" r="1" fill="#d8ff29"/>
        </svg>
      </div>
      <h2 class="g2-i" style="--i:1">${va.name}'s private area</h2>
      <div class="g2-i" style="--i:2"><span class="g2-chip"><i></i>${va.shiftLabel}</span></div>
      <p class="g2-sub g2-i" style="--i:3">Enter your passcode to continue.</p>
      <div class="g2-field g2-i" style="--i:4">
        <input type="password" id="gatePass" placeholder="Passcode" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="g2-eye" id="gateToggle" aria-label="Show passcode">${EYE}</button>
      </div>
      <p class="g2-err" id="gateErr" role="alert"></p>
      <button class="g2-btn g2-i" style="--i:5" id="gateBtn"><span id="gateBtnTxt">Unlock</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>`;
  app.appendChild(wrap);
  const card = wrap.querySelector('#gateCard');
  const input = wrap.querySelector('#gatePass');
  const err = wrap.querySelector('#gateErr');
  const btnTxt = wrap.querySelector('#gateBtnTxt');
  let busy = false;
  const tryUnlock = ()=>{
    if(busy) return;
    if(input.value === PASSCODES[va.id]){
      busy = true;
      input.disabled = true; err.classList.remove('show'); input.classList.remove('bad');
      btnTxt.textContent = 'Unlocked';
      card.classList.add('ok');
      setTimeout(()=>{ unlockVa(va.id); render(); }, 850);
    } else {
      err.textContent = 'Incorrect passcode — try again.';
      err.classList.add('show'); input.classList.add('bad');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      input.value=''; input.focus();
    }
  };
  input.oninput = ()=>{ input.classList.remove('bad'); err.classList.remove('show'); };
  wrap.querySelector('#gateBtn').onclick = tryUnlock;
  input.onkeydown = ev => { if(ev.key==='Enter') tryUnlock(); };
  const tog = wrap.querySelector('#gateToggle');
  tog.onclick = ()=>{ const show = input.type==='password'; input.type = show?'text':'password'; tog.innerHTML = show?EYEOFF:EYE; input.focus(); };
  input.focus({preventScroll:true});
}

// ---------- Noor's supervision dashboard ----------
function renderSupervisionPage(app, noor){
  const d = todayKey();
  const staff = VAS.filter(v=>v.role==='va');
  const ne = getEntry(noor.id, d);
  const nStatus = !ne.signIn ? 'not-in' : (!ne.signOut ? 'working' : 'done');
  const nLiveHrs = hoursBetween(ne.signIn, ne.signOut || (nStatus==='working' ? new Date().toISOString() : null));

  mountStatusCard(app, noor, {actions:true});

  staff.forEach(va=>{
    const e = getEntry(va.id, d);
    const t = totals(e);
    const status = !e.signIn ? 'Not signed in' : (!e.signOut ? 'Working' : 'Signed out');
    const hrs = hoursBetween(e.signIn, e.signOut || (status==='Working' ? new Date().toISOString() : null));
    const card = document.createElement('div');
    card.className='card overflow';
    card.innerHTML = `
      <h3>${va.name} <span class="muted" style="text-transform:none;letter-spacing:0;">&middot; ${va.shiftLabel}</span></h3>
      <div class="grid3">
        <div class="stat"><b>${status}</b><span>Status today</span></div>
        <div class="stat"><b><span class="live-hours" data-signin="${e.signIn||''}" data-signout="${e.signOut||''}">${hrs.toFixed(2)}</span></b><span>Hours today</span></div>
        <div class="stat"><b>${t.appts} / ${t.dms}</b><span>Appts / DMs</span></div>
      </div>
      <footer class="actions">
        ${!e.submitted ? '<span class="tag off">Not submitted yet</span>' :
          (e.verifiedByNoor ? '<span class="tag verified">Verified ✓</span>' : `<button class="btn lime" data-verify="${va.id}">Verify today's entry</button>`)}
      </footer>`;
    app.appendChild(card);
    const btn = card.querySelector('[data-verify]');
    if(btn) btn.onclick = ()=> writeEntry(va.id, d, { verifiedByNoor:true, verifiedAt:new Date().toISOString() });

    const days = [...Array(7)].map((_,i)=>{ const dt=new Date(); dt.setDate(dt.getDate()-i); return localKey(dt); });
    const hist = document.createElement('div');
    hist.className='card overflow';
    hist.innerHTML = `<h3>${va.name} — last 7 days</h3>
      <table class="rtable c3"><thead><tr><th>Date</th><th class="num">Hours</th><th class="num">Appts</th><th class="num">DMs</th><th>Submitted</th><th>Verified</th><th></th></tr></thead>
      <tbody>${days.map(dt=>{
        const he = getEntry(va.id, dt); const ht = totals(he); const hh = hoursBetween(he.signIn, he.signOut);
        const acts = (he.submitted && !he.verifiedByNoor ? `<button class="btn ghost" data-verify-day="${va.id}_${dt}">Verify</button>` : '')
          + (adminMode ? `<button class="ed" data-edit-time="${va.id}|${dt}">✎ ${fmtTime(he.signIn)}–${fmtTime(he.signOut)}</button>` : '')
          + (adminMode && he.submitted ? `<button class="ed danger" data-unsub="${va.id}|${dt}">↺ Unsubmit</button>` : '');
        return `<tr><td data-label="Date">${dt}</td><td class="num" data-label="Hours">${hh.toFixed(1)}</td><td class="num" data-label="Appts">${ht.appts}</td><td class="num" data-label="DMs">${ht.dms}</td>
          <td data-label="Submitted">${he.submitted ? '<span class="tag ok">Submitted</span>' : '<span class="tag off">Open</span>'}</td>
          <td data-label="Verified">${he.verifiedByNoor ? '<span class="tag verified">Verified</span>' : '<span class="tag off">—</span>'}</td>
          <td class="acts">${acts}</td>
        </tr>`;
      }).join('')}</tbody></table>`;
    app.appendChild(hist);
    hist.querySelectorAll('[data-verify-day]').forEach(b=>{
      b.onclick = ()=>{
        const raw = b.dataset.verifyDay; const idx = raw.indexOf('_');
        const vid = raw.slice(0, idx), dt = raw.slice(idx+1);
        writeEntry(vid, dt, { verifiedByNoor:true, verifiedAt:new Date().toISOString() });
      };
    });
  });

  // Noor's own attendance history
  const nDays = [...Array(7)].map((_,i)=>{ const dt=new Date(); dt.setDate(dt.getDate()-i); return localKey(dt); });
  const nHist = document.createElement('div');
  nHist.className='card overflow';
  nHist.innerHTML = `<h3>Noor — attendance, last 7 days</h3>
    <table class="rtable"><thead><tr><th>Date</th><th>Sign in</th><th>Sign out</th><th class="num">Hours</th>${adminMode?'<th></th>':''}</tr></thead>
    <tbody>${nDays.map(dt=>{
      const he = getEntry(noor.id, dt); const hh = hoursBetween(he.signIn, he.signOut);
      return `<tr><td data-label="Date">${dt}</td><td data-label="Sign in">${fmtTime(he.signIn)}</td><td data-label="Sign out">${fmtTime(he.signOut)}</td><td class="num" data-label="Hours">${hh.toFixed(1)}</td>${adminMode?`<td><button class="ed" data-edit-time="${noor.id}|${dt}">✎ Edit</button></td>`:''}</tr>`;
    }).join('')}</tbody></table>`;
  app.appendChild(nHist);
}

// ---------- VA page ----------
// ---------- per-member notifications (shown only on that member's own tab) ----------
function mountMemberAlerts(parent, va){
  if(va.shiftStart==null) return;
  const d=todayKey(), e=getEntry(va.id,d), now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const list=[];
  if(!e.signIn && nowMin>va.shiftStart*60+5) list.push({m:`You haven't signed in yet.`});
  if(e.signIn && !e.signOut && nowMin>va.shiftEnd*60) list.push({m:`You're still clocked in past your shift end.`});
  if(e.signIn && !e.submitted && nowMin>va.shiftEnd*60) list.push({m:`You haven't submitted today's log.`});
  if(e.submitted && !e.verifiedByNoor) list.push({m:`Your day is submitted and awaiting verification.`,info:1});
  if(!list.length) return;
  const al=document.createElement('div'); al.className='alerts'; al.style.marginBottom='14px';
  al.innerHTML=list.map(a=>`<div class="alert ${a.info?'info':''}">${a.m}${adminMode&&!a.info?`<button class="ed" data-edit-time="${va.id}|${d}">✎ Fix time</button>`:''}</div>`).join('');
  parent.appendChild(al);
}

function renderVaPage(app, vaId){
  const va = VAS.find(v=>v.id===vaId);
  if(!isUnlocked(vaId)){ renderGate(app, va); return; }
  app.appendChild(clockBar());
  if(va.role === 'supervisor'){ renderSupervisionPage(app, va); return; }

  const d = todayKey();
  const e = getEntry(vaId, d);
  const t = totals(e);
  const locked = e.submitted && !adminMode;
  const status = !e.signIn ? 'not-in' : (!e.signOut ? 'working' : 'done');
  const liveHrs = hoursBetween(e.signIn, e.signOut || (status==='working'?new Date().toISOString():null));

  const minutesOfDay = dt => dt.getHours()*60 + dt.getMinutes();
  const lateIn = e.signIn && minutesOfDay(new Date(e.signIn)) > va.shiftStart*60 + 5; // 5 min grace
  const earlyOut = e.signOut && minutesOfDay(new Date(e.signOut)) < va.shiftEnd*60;

  mountStatusCard(app, va, {actions:true});
  mountMemberAlerts(app, va);

  const form = document.createElement('div');
  form.className='card';
  form.innerHTML = `
    <h2>Log today's work</h2>
    <p class="muted" style="margin-bottom:14px;">Add one row per account you worked on today.</p>
    <div class="form-row">
      <div><label>Platform</label><select id="fPlatform" ${locked?'disabled':''}>${PLATFORMS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div><label>Account</label><select id="fAccount" ${locked?'disabled':''}>${accountsFor(PLATFORMS[0]).map(a=>`<option>${a}</option>`).join('')}</select></div>
      <div><label>Appointments</label><input type="number" inputmode="numeric" min="0" id="fAppts" value="0" ${locked?'disabled':''}></div>
      <div><label>DMs answered</label><input type="number" inputmode="numeric" min="0" id="fDms" value="0" ${locked?'disabled':''}></div>
      <div><button class="btn" id="addRow" ${locked?'disabled':''}>+ Add</button></div>
    </div>
    <div class="overflow">
    <table class="rtable"><thead><tr><th>Platform</th><th>Account</th><th class="num">Appointments</th><th class="num">DMs</th>${locked?'':'<th></th>'}</tr></thead>
    <tbody id="logRows">
      ${e.logs.length===0 ? `<tr><td colspan="${locked?4:5}" class="muted">No entries yet.</td></tr>` : e.logs.map((l,i)=>`
      <tr><td data-label="Platform">${l.platform}</td><td data-label="Account">${l.account}</td><td class="num" data-label="Appointments">${l.appts}</td><td class="num" data-label="DMs">${l.dms}</td>
      ${locked?'':`<td><button class="rm" data-i="${i}">Remove</button></td>`}</tr>`).join('')}
    </tbody></table>
    </div>
    <div class="grid3" style="margin-top:16px;">
      <div class="stat"><b>${t.appts}</b><span>Appointments today</span></div>
      <div class="stat"><b>${t.dms}</b><span>DMs answered today</span></div>
      <div class="stat"><b>${liveHrs.toFixed(1)}</b><span>Hours worked today</span></div>
    </div>
    <footer class="actions">
      <button class="btn lime" id="submitDay" ${locked||e.logs.length===0?'disabled':''}>${e.submitted?'Re-submit day':'Submit day'}</button>
      ${e.submitted&&adminMode?`<button class="btn ghost" data-unsub="${vaId}|${d}">↺ Unsubmit day</button>`:''}
      ${e.submitted ? `<span class="lock-note">${locked ? 'Submitted — locked. Only an admin can edit this now.' : 'Admin mode: editing an already-submitted day.'}</span>` : ''}
    </footer>`;
  app.appendChild(form);

  form.querySelector('#fPlatform').onchange = ev=>{
    const fAccount = form.querySelector('#fAccount');
    fAccount.innerHTML = accountsFor(ev.target.value).map(a=>`<option>${a}</option>`).join('');
  };
  form.querySelector('#addRow').onclick = ()=>{
    const platform = form.querySelector('#fPlatform').value;
    const account = form.querySelector('#fAccount').value;
    const appts = Number(form.querySelector('#fAppts').value||0);
    const dms = Number(form.querySelector('#fDms').value||0);
    const logs = [...e.logs, {platform,account,appts,dms}];
    writeEntry(vaId, d, { logs });
  };
  form.querySelectorAll('.rm').forEach(btn=>{
    btn.onclick = ()=>{
      const logs = e.logs.filter((_,idx)=> idx !== Number(btn.dataset.i));
      writeEntry(vaId, d, { logs });
    };
  });
  const submitBtn = form.querySelector('#submitDay');
  if(submitBtn) submitBtn.onclick = ()=> writeEntry(vaId, d, { submitted: true });

  // history (last 7 days incl today)
  const hist = document.createElement('div');
  hist.className='card overflow';
  const days = [...Array(7)].map((_,i)=>{
    const dt = new Date(); dt.setDate(dt.getDate()-i);
    return localKey(dt);
  });
  hist.innerHTML = `<h3>Last 7 days</h3>
    <table class="rtable c3"><thead><tr><th>Date</th><th>Sign in</th><th>Sign out</th><th class="num">Hours</th><th class="num">Appts</th><th class="num">DMs</th><th>Status</th>${adminMode?'<th></th>':''}</tr></thead>
    <tbody>${days.map(dt=>{
      const he = getEntry(vaId, dt);
      const ht = totals(he);
      const hh = hoursBetween(he.signIn, he.signOut);
      return `<tr><td data-label="Date">${dt}</td><td data-label="Sign in">${fmtTime(he.signIn)}</td><td data-label="Sign out">${fmtTime(he.signOut)}</td><td class="num" data-label="Hours">${hh.toFixed(1)}</td><td class="num" data-label="Appts">${ht.appts}</td><td class="num" data-label="DMs">${ht.dms}</td><td data-label="Status" class="full">${he.submitted?'<span class="tag ok">Submitted</span>':(he.signIn?'<span class="tag off">Open</span>':'—')}</td>${adminMode?`<td class="acts"><button class="ed" data-edit-time="${vaId}|${dt}">✎ Edit</button>${he.submitted?`<button class="ed danger" data-unsub="${vaId}|${dt}">↺ Unsubmit</button>`:''}</td>`:''}</tr>`;
    }).join('')}</tbody></table>`;
  app.appendChild(hist);
}

init();
</script>
